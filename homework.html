<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제 | 김민관 수학</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: '맑은 고딕', sans-serif; background: #f8fafc; color: #1e293b; }
  .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  .sub { color: #64748b; font-size: 14px; margin-bottom: 32px; }
  .card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 15px; outline: none; transition: border 0.2s; margin-bottom: 16px;
  }
  input:focus, select:focus, textarea:focus { border-color: #2563eb; }
  .btn {
    width: 100%; padding: 14px; background: #2563eb; color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn.secondary { background: #f1f5f9; color: #1e293b; margin-top: 10px; }
  .btn.secondary:hover { background: #e2e8f0; }
  .btn.danger { background: #dc2626; margin-top: 10px; }
  .btn.sm { padding: 8px 16px; width: auto; font-size: 13px; margin-top: 0; }
  .msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .msg.error { background: #fef2f2; color: #dc2626; }
  .msg.success { background: #f0fdf4; color: #16a34a; }
  canvas { width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; cursor: crosshair; touch-action: none; background: #fff; display: block; }
  .canvas-btns { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 16px; }
  .canvas-btns button { flex: 1; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
  .canvas-btns button:hover { background: #f1f5f9; }
  .problem-box { background: #f8fafc; border-radius: 10px; padding: 20px; margin-bottom: 20px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
  .score-box { text-align: center; padding: 24px; background: #eff6ff; border-radius: 12px; margin-bottom: 16px; }
  .score-box .score { font-size: 48px; font-weight: 900; color: #2563eb; }
  .score-box .label { font-size: 14px; color: #64748b; margin-top: 4px; }
  .feedback { background: #f8fafc; border-radius: 10px; padding: 16px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .section-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .problem-list { list-style: none; }
  .problem-list li { padding: 14px 16px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px; font-size: 14px; cursor: pointer; border: 1.5px solid transparent; transition: border 0.2s; }
  .problem-list li:hover { border-color: #2563eb; }
  .problem-list li.selected { border-color: #2563eb; background: #eff6ff; }
  .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .nav-bar span { font-size: 14px; color: #64748b; }
  .nav-back { color: #2563eb; font-size: 14px; font-weight: 600; cursor: pointer; background: none; border: none; }
  .student-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
  .student-row .id { color: #64748b; font-size: 12px; }
  .scores-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .scores-table th { background: #f1f5f9; padding: 10px 12px; text-align: left; font-weight: 700; }
  .scores-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  .tab-btns { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab-btn { flex: 1; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 600; }
  .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .spinner { text-align: center; padding: 20px; color: #64748b; font-size: 14px; }
  .page { display: none; }
  #page-login { display: block; }
</style>
</head>
<body>
<div class="container">

  <!-- 로그인 -->
  <div id="page-login" class="page" style="display:block">
    <h1>김민관 수학</h1>
    <p class="sub">숙제 시스템에 로그인하세요</p>
    <div class="card">
      <div id="login-msg"></div>
      <label>아이디</label>
      <input type="text" id="login-id" placeholder="아이디 입력" autocomplete="username">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:#64748b; margin-top:-4px; cursor:pointer;">
        <input type="checkbox" id="remember-me" style="width:auto; margin:0;"> 로그인 정보 저장
      </label>
      <button class="btn" onclick="login()">로그인</button>
    </div>
  </div>

  <!-- 선생님 페이지 -->
  <div id="page-teacher" class="page">
    <div class="nav-bar">
      <h1>데일리 퀴즈</h1>
      <div style="display:flex; gap:8px;">
        <button class="nav-back" onclick="location.href='index.html'" style="background:#f1f5f9; color:#1e293b; border:1.5px solid #e2e8f0; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:700;">← 홈으로</button>
        <button class="nav-back" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="tab-btns">
      <button class="tab-btn active" onclick="teacherTab('problems')">문제 등록</button>
      <button class="tab-btn" onclick="teacherTab('students')">학생 관리</button>
      <button class="tab-btn" onclick="teacherTab('scores')">점수 현황</button>
      <button class="tab-btn" onclick="teacherTab('settings')">설정</button>
    </div>

    <!-- 문제 등록 -->
    <div id="t-tab-problems" class="card">
      <p class="section-title">문제 등록</p>
      <label>문제 제목</label>
      <input type="text" id="t-title" placeholder="예: 6월 2주차 숙제">
      <label>문제 내용</label>
      <textarea id="t-content" rows="6" placeholder="문제 내용을 입력하세요"></textarea>
      <label>문제 사진 첨부 (선택)</label>
      <div id="t-drop-zone" style="border:2px dashed #cbd5e1; border-radius:12px; padding:24px; text-align:center; color:#94a3b8; font-size:14px; cursor:pointer; transition:all 0.2s; margin-bottom:8px;">
        🖼️ 이미지를 여기에 드래그하거나 클릭해서 선택
        <input type="file" id="t-image" accept="image/*" style="display:none;">
      </div>
      <div id="t-image-preview" style="margin-bottom:16px;"></div>
      <label>총 문항 수</label>
      <input type="number" id="t-total" placeholder="예: 5" min="1">
      <button class="btn" onclick="saveProblems()">저장</button>
      <div id="teacher-msg" style="margin-top:12px"></div>
      <div id="t-problem-list" style="margin-top:20px"></div>
    </div>

    <!-- 학생 관리 -->
    <div id="t-tab-students" class="card" style="display:none">
      <p class="section-title">학생 추가</p>
      <label>이름</label>
      <input type="text" id="new-sname" placeholder="홍길동">
      <label>아이디</label>
      <input type="text" id="new-sid" placeholder="hong123">
      <label>초기 비밀번호</label>
      <input type="text" id="new-spw" placeholder="1234">
      <button class="btn" onclick="addStudent()">추가</button>
      <div id="add-student-msg" style="margin-top:12px"></div>
      <div style="margin-top:24px">
        <p class="section-title">학생 목록</p>
        <div id="student-list-area"><p class="spinner">불러오는 중...</p></div>
      </div>
    </div>

    <!-- 점수 현황 -->
    <div id="t-tab-scores" class="card" style="display:none">
      <p class="section-title">점수 현황</p>
      <div id="scores-area"><p class="spinner">불러오는 중...</p></div>
    </div>

    <!-- 설정 -->
    <div id="t-tab-settings" class="card" style="display:none">
      <p class="section-title">비밀번호 변경</p>
      <label>현재 비밀번호</label>
      <input type="password" id="t-old-pw" placeholder="현재 비밀번호">
      <label>새 비밀번호</label>
      <input type="password" id="t-new-pw" placeholder="새 비밀번호">
      <button class="btn" onclick="changePassword()">변경</button>
      <div id="teacher-pw-msg" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 학생 페이지 -->
  <div id="page-student" class="page">
    <div class="nav-bar">
      <div>
        <h1 id="student-greeting"></h1>
        <p class="sub" style="margin-bottom:0">숙제를 풀고 제출하세요</p>
      </div>
      <button class="nav-back" onclick="logout()">로그아웃</button>
    </div>

    <div class="tab-btns">
      <button class="tab-btn active" onclick="studentTab('homework')">숙제 풀기</button>
      <button class="tab-btn" onclick="studentTab('settings')">설정</button>
    </div>

    <!-- 숙제 풀기 -->
    <div id="s-tab-homework">
      <div class="card">
        <p class="section-title">문제 선택</p>
        <div id="problem-list-area"><p class="spinner">문제를 불러오는 중...</p></div>
      </div>
      <div id="solve-area" style="display:none">
        <div class="card">
          <p class="section-title" id="solve-title"></p>
          <div class="problem-box" id="solve-content"></div>
          <label>손글씨로 풀기</label>
          <canvas id="draw-canvas" height="400"></canvas>
          <div class="canvas-btns">
            <button onclick="clearCanvas()">🗑 지우기</button>
            <button onclick="undoCanvas()">↩ 되돌리기</button>
          </div>
          <button class="btn" id="submit-btn" onclick="submitAnswer()">제출 & AI 채점</button>
        </div>
      </div>
    </div>

    <!-- 설정 -->
    <div id="s-tab-settings" class="card" style="display:none">
      <p class="section-title">비밀번호 변경</p>
      <label>현재 비밀번호</label>
      <input type="password" id="s-old-pw" placeholder="현재 비밀번호">
      <label>새 비밀번호</label>
      <input type="password" id="s-new-pw" placeholder="새 비밀번호">
      <button class="btn" onclick="changePassword()">변경</button>
      <div id="student-pw-msg" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="page-result" class="page">
    <div class="nav-bar">
      <h1>채점 결과</h1>
      <button class="nav-back" onclick="backToStudent()">← 돌아가기</button>
    </div>
    <div class="card">
      <div class="score-box">
        <div class="score" id="result-score"></div>
        <div class="label" id="result-label"></div>
      </div>
      <p style="font-weight:700; margin-bottom:10px">AI 피드백</p>
      <div class="feedback" id="result-feedback"></div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
const GEMINI_KEY = 'AQ.Ab8RN6LVfn-MmMP7-TbtXpZxEs7seO59LUMMLJOt2bOg3rsYKg';

let currentUser = null;
let problems = JSON.parse(localStorage.getItem('mkmath-problems') || '[]');
let selectedProblem = null;
let canvasHistory = [];
let canvas, ctx, drawing = false;

// 저장된 로그인 정보 불러오기
window.addEventListener('DOMContentLoaded', function() {
  const saved = JSON.parse(localStorage.getItem('saved_login') || 'null');
  if (saved) {
    document.getElementById('login-id').value = saved.id || '';
    document.getElementById('login-pw').value = saved.pw || '';
    document.getElementById('remember-me').checked = true;
  }
});

async function login() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const remember = document.getElementById('remember-me').checked;
  const msgEl = document.getElementById('login-msg');
  if (!id || !pw) { showMsg(msgEl, '아이디와 비밀번호를 입력하세요', 'error'); return; }

  try {
    const res = await fetch(`${SCRIPT_URL}?action=login&id=${encodeURIComponent(id)}&password=${encodeURIComponent(pw)}`);
    const data = await res.json();
    if (data.success) {
      if (remember) {
        localStorage.setItem('saved_login', JSON.stringify({ id, pw }));
      } else {
        localStorage.removeItem('saved_login');
      }
      currentUser = { id, role: data.role, name: data.name };
      if (data.role === 'teacher') {
        show('page-teacher');
        loadProblemList();
      } else {
        document.getElementById('student-greeting').textContent = data.name + ' 학생';
        show('page-student');
        loadProblems();
      }
    } else {
      showMsg(msgEl, '아이디 또는 비밀번호가 틀렸습니다', 'error');
    }
  } catch(e) {
    showMsg(msgEl, '연결 오류가 발생했습니다', 'error');
  }
}

function logout() {
  currentUser = null;
  selectedProblem = null;
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  show('page-login');
}

function show(pageId) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(pageId).style.display = 'block';
}

// 선생님 탭
function teacherTab(tab) {
  ['problems','students','scores','settings'].forEach(t => {
    document.getElementById('t-tab-' + t).style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('#page-teacher .tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['problems','students','scores','settings'][i] === tab);
  });
  if (tab === 'students') loadStudentList();
  if (tab === 'scores') loadScores();
}

// 학생 탭
function studentTab(tab) {
  document.getElementById('s-tab-homework').style.display = tab === 'homework' ? 'block' : 'none';
  document.getElementById('s-tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
  document.querySelectorAll('#page-student .tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && tab==='homework') || (i===1 && tab==='settings'));
  });
}

// 이미지 미리보기 + 드래그 앤 드롭
document.addEventListener('DOMContentLoaded', function() {
  const imgInput = document.getElementById('t-image');
  const dropZone = document.getElementById('t-drop-zone');

  function showPreview(file) {
    const preview = document.getElementById('t-image-preview');
    if (file) {
      const reader = new FileReader();
      reader.onload = e => {
        preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%; border-radius:8px; border:1.5px solid #e2e8f0;">`;
      };
      reader.readAsDataURL(file);
    } else {
      preview.innerHTML = '';
    }
  }

  if (dropZone) {
    dropZone.addEventListener('click', () => imgInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='#2563eb'; dropZone.style.background='#eff6ff'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor='#cbd5e1'; dropZone.style.background=''; });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.borderColor='#cbd5e1'; dropZone.style.background='';
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const dt = new DataTransfer(); dt.items.add(file); imgInput.files = dt.files;
        showPreview(file);
        dropZone.querySelector('span') && (dropZone.querySelector('span').textContent = file.name);
      }
    });
  }

  if (imgInput) {
    imgInput.addEventListener('change', function() {
      const file = this.files[0];
      const preview = document.getElementById('t-image-preview');
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%; border-radius:8px; border:1.5px solid #e2e8f0;">`;
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = '';
      }
    });
  }
});

// 문제 저장/불러오기
function saveProblems() {
  const title = document.getElementById('t-title').value.trim();
  const content = document.getElementById('t-content').value.trim();
  const total = parseInt(document.getElementById('t-total').value);
  const msgEl = document.getElementById('teacher-msg');
  if (!title || !content || !total) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }

  const imgInput = document.getElementById('t-image');
  const file = imgInput && imgInput.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => {
      problems.push({ id: Date.now(), title, content, total, image: e.target.result });
      localStorage.setItem('mkmath-problems', JSON.stringify(problems));
      resetProblemForm(msgEl);
    };
    reader.readAsDataURL(file);
  } else {
    problems.push({ id: Date.now(), title, content, total, image: null });
    localStorage.setItem('mkmath-problems', JSON.stringify(problems));
    resetProblemForm(msgEl);
  }
}

function resetProblemForm(msgEl) {
  document.getElementById('t-title').value = '';
  document.getElementById('t-content').value = '';
  document.getElementById('t-total').value = '';
  document.getElementById('t-image').value = '';
  document.getElementById('t-image-preview').innerHTML = '';
  showMsg(msgEl, '저장되었습니다!', 'success');
  loadProblemList();
}

function loadProblemList() {
  const area = document.getElementById('t-problem-list');
  if (problems.length === 0) { area.innerHTML = ''; return; }
  area.innerHTML = '<p style="font-weight:700;margin-bottom:12px">등록된 문제</p>' +
    problems.map((p,i) => `
      <div class="student-row">
        <span>${p.title} (${p.total}문항)</span>
        <button class="btn danger sm" onclick="deleteProblem(${i})">삭제</button>
      </div>`).join('');
}

function deleteProblem(idx) {
  problems.splice(idx, 1);
  localStorage.setItem('mkmath-problems', JSON.stringify(problems));
  loadProblemList();
}

function loadProblems() {
  const area = document.getElementById('problem-list-area');
  problems = JSON.parse(localStorage.getItem('mkmath-problems') || '[]');
  if (problems.length === 0) {
    area.innerHTML = '<p style="color:#64748b;font-size:14px">등록된 문제가 없습니다</p>';
    return;
  }
  area.innerHTML = '<ul class="problem-list">' +
    problems.map(p => `<li onclick="selectProblem(${p.id})" id="prob-${p.id}">${p.title}</li>`).join('') + '</ul>';
}

function selectProblem(id) {
  selectedProblem = problems.find(p => p.id === id);
  document.querySelectorAll('.problem-list li').forEach(li => li.classList.remove('selected'));
  document.getElementById('prob-' + id).classList.add('selected');
  document.getElementById('solve-title').textContent = selectedProblem.title;
  document.getElementById('solve-content').textContent = selectedProblem.content;
  document.getElementById('solve-area').style.display = 'block';
  initCanvas();
  window.scrollTo(0, document.getElementById('solve-area').offsetTop - 20);
}

// 학생 관리
async function addStudent() {
  const name = document.getElementById('new-sname').value.trim();
  const sid = document.getElementById('new-sid').value.trim();
  const spw = document.getElementById('new-spw').value.trim();
  const msgEl = document.getElementById('add-student-msg');
  if (!name || !sid || !spw) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }
  try {
    const res = await fetch(`${SCRIPT_URL}?action=addStudent&teacherId=${encodeURIComponent(currentUser.id)}&sname=${encodeURIComponent(name)}&sid=${encodeURIComponent(sid)}&spw=${encodeURIComponent(spw)}`);
    const data = await res.json();
    if (data.success) {
      showMsg(msgEl, '추가되었습니다!', 'success');
      document.getElementById('new-sname').value = '';
      document.getElementById('new-sid').value = '';
      document.getElementById('new-spw').value = '';
      loadStudentList();
    } else {
      showMsg(msgEl, '오류가 발생했습니다', 'error');
    }
  } catch(e) {
    showMsg(msgEl, '연결 오류', 'error');
  }
}

async function loadStudentList() {
  const area = document.getElementById('student-list-area');
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getStudents`);
    const data = await res.json();
    if (data.students.length === 0) { area.innerHTML = '<p style="color:#64748b;font-size:14px">학생이 없습니다</p>'; return; }
    area.innerHTML = data.students.map(s =>
      `<div class="student-row"><div><div>${s.name}</div><div class="id">@${s.id}</div></div></div>`
    ).join('');
  } catch(e) {
    area.innerHTML = '<p style="color:#dc2626;font-size:14px">불러오기 실패</p>';
  }
}

async function loadScores() {
  const area = document.getElementById('scores-area');
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getScores`);
    const data = await res.json();
    if (!data.scores || data.scores.length === 0) { area.innerHTML = '<p style="color:#64748b;font-size:14px">제출된 숙제가 없습니다</p>'; return; }
    area.innerHTML = '<table class="scores-table"><thead><tr><th>이름</th><th>문제</th><th>점수</th><th>날짜</th></tr></thead><tbody>' +
      data.scores.map(s => `<tr><td>${s.name}</td><td>${s.title||''}</td><td>${s.score}/${s.total}</td><td>${s.date}</td></tr>`).join('') +
      '</tbody></table>';
  } catch(e) {
    area.innerHTML = '<p style="color:#dc2626;font-size:14px">불러오기 실패</p>';
  }
}

// 비밀번호 변경
async function changePassword() {
  const isTeacher = currentUser.role === 'teacher';
  const oldPw = document.getElementById(isTeacher ? 't-old-pw' : 's-old-pw').value;
  const newPw = document.getElementById(isTeacher ? 't-new-pw' : 's-new-pw').value;
  const msgEl = document.getElementById(isTeacher ? 'teacher-pw-msg' : 'student-pw-msg');
  if (!oldPw || !newPw) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }
  try {
    const res = await fetch(`${SCRIPT_URL}?action=changePassword&id=${encodeURIComponent(currentUser.id)}&oldPassword=${encodeURIComponent(oldPw)}&newPassword=${encodeURIComponent(newPw)}`);
    const data = await res.json();
    showMsg(msgEl, data.success ? '변경되었습니다!' : '현재 비밀번호가 틀렸습니다', data.success ? 'success' : 'error');
  } catch(e) {
    showMsg(msgEl, '오류가 발생했습니다', 'error');
  }
}

// 캔버스
function initCanvas() {
  canvas = document.getElementById('draw-canvas');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 400 * window.devicePixelRatio;
  ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  canvasHistory = [];
  canvas.onpointerdown = startDraw;
  canvas.onpointermove = draw;
  canvas.onpointerup = endDraw;
  canvas.onpointerleave = endDraw;
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startDraw(e) { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
function draw(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
function endDraw() { if (drawing) { canvasHistory.push(canvas.toDataURL()); drawing = false; } }

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
  canvasHistory = [];
}

function undoCanvas() {
  if (canvasHistory.length <= 1) { clearCanvas(); return; }
  canvasHistory.pop();
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
    ctx.drawImage(img, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
  };
  img.src = canvasHistory[canvasHistory.length - 1];
}

// 제출
async function submitAnswer() {
  if (!selectedProblem) { alert('문제를 선택해주세요'); return; }
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'AI 채점 중...';
  btn.disabled = true;

  const imageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
  const prompt = `다음은 수학 문제와 학생의 손글씨 답안입니다.

문제:
${selectedProblem.content}

총 문항 수: ${selectedProblem.total}문제

학생의 손글씨 답안 이미지를 보고:
1. 각 문제별로 맞았는지 틀렸는지 판단해주세요
2. 맞은 문제 수를 알려주세요
3. 틀린 문제에 대해 간단한 피드백을 주세요

답변 형식:
점수: X/${selectedProblem.total}
피드백:
(각 문제별 피드백)`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: imageData } }] }]
      })
    });
    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text;
    const scoreMatch = text.match(/점수:\s*(\d+)\s*\/\s*(\d+)/);
    const score = scoreMatch ? scoreMatch[1] : '?';
    const total = scoreMatch ? scoreMatch[2] : selectedProblem.total;
    const feedback = text.replace(/점수:.*\n?/, '').trim();

    await fetch(`${SCRIPT_URL}?action=saveScore&name=${encodeURIComponent(currentUser.name)}&id=${encodeURIComponent(currentUser.id)}&date=${new Date().toLocaleDateString('ko-KR')}&score=${score}&total=${total}&title=${encodeURIComponent(selectedProblem.title)}`);

    document.getElementById('result-score').textContent = `${score} / ${total}`;
    document.getElementById('result-label').textContent = `${currentUser.name} 학생`;
    document.getElementById('result-feedback').textContent = feedback;
    show('page-result');
  } catch(e) {
    alert('채점 중 오류가 발생했습니다: ' + e.message);
  } finally {
    btn.textContent = '제출 & AI 채점';
    btn.disabled = false;
  }
}

function backToStudent() {
  show('page-student');
  studentTab('homework');
}

function showMsg(el, text, type) {
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(() => el.innerHTML = '', 3000);
}
