<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제 | 김민관 수학</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: '맑은 고딕', sans-serif; background: #f8fafc; color: #1e293b; }

  .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }

  h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  .sub { color: #64748b; font-size: 14px; margin-bottom: 32px; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 15px; outline: none;
    transition: border 0.2s;
    margin-bottom: 16px;
  }
  input:focus, select:focus, textarea:focus { border-color: #2563eb; }

  .btn {
    width: 100%; padding: 14px;
    background: #2563eb; color: #fff;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #1d4ed8; }
  .btn.secondary {
    background: #f1f5f9; color: #1e293b;
    margin-top: 10px;
  }
  .btn.secondary:hover { background: #e2e8f0; }
  .btn.danger { background: #dc2626; margin-top: 10px; }
  .btn.danger:hover { background: #b91c1c; }

  .msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .msg.error { background: #fef2f2; color: #dc2626; }
  .msg.success { background: #f0fdf4; color: #16a34a; }

  canvas {
    width: 100%; border: 2px solid #e2e8f0;
    border-radius: 10px; cursor: crosshair;
    touch-action: none; background: #fff;
    display: block;
  }

  .canvas-btns { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 16px; }
  .canvas-btns button {
    flex: 1; padding: 10px;
    border: 1.5px solid #e2e8f0; border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 14px;
  }
  .canvas-btns button:hover { background: #f1f5f9; }

  .problem-box {
    background: #f8fafc; border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
    font-size: 15px; line-height: 1.8;
    white-space: pre-wrap;
  }

  .score-box {
    text-align: center; padding: 24px;
    background: #eff6ff; border-radius: 12px;
    margin-bottom: 16px;
  }
  .score-box .score { font-size: 48px; font-weight: 900; color: #2563eb; }
  .score-box .label { font-size: 14px; color: #64748b; margin-top: 4px; }

  .feedback { background: #f8fafc; border-radius: 10px; padding: 16px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }

  .tab-btns { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab-btn {
    flex: 1; padding: 10px;
    border: 1.5px solid #e2e8f0; border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

  #page-login, #page-teacher, #page-student, #page-result { display: none; }
  #page-login { display: block; }

  .section-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .problem-list { list-style: none; }
  .problem-list li {
    padding: 14px 16px; background: #f8fafc;
    border-radius: 8px; margin-bottom: 8px;
    font-size: 14px; cursor: pointer;
    border: 1.5px solid transparent;
    transition: border 0.2s;
  }
  .problem-list li:hover { border-color: #2563eb; }
  .problem-list li.selected { border-color: #2563eb; background: #eff6ff; }

  .spinner { text-align: center; padding: 20px; color: #64748b; font-size: 14px; }

  .nav-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: #2563eb; font-size: 14px; font-weight: 600;
    text-decoration: none; margin-bottom: 24px;
    cursor: pointer; background: none; border: none;
  }
</style>
</head>
<body>

<div class="container">

  <!-- 로그인 -->
  <div id="page-login">
    <h1>김민관 수학</h1>
    <p class="sub">숙제 시스템에 로그인하세요</p>
    <div class="card">
      <div id="login-msg"></div>
      <div class="tab-btns">
        <button class="tab-btn active" onclick="setRole('student')">학생</button>
        <button class="tab-btn" onclick="setRole('teacher')">선생님</button>
      </div>
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')login()">
      <button class="btn" onclick="login()">로그인</button>
    </div>
  </div>

  <!-- 선생님 페이지 -->
  <div id="page-teacher">
    <button class="nav-back" onclick="logout()">← 로그아웃</button>
    <h1>선생님 페이지</h1>
    <p class="sub">문제를 등록하고 관리하세요</p>

    <div class="card">
      <p class="section-title">문제 등록</p>
      <label>문제 제목</label>
      <input type="text" id="t-title" placeholder="예: 6월 2주차 숙제">
      <label>문제 내용</label>
      <textarea id="t-content" rows="6" placeholder="문제 내용을 입력하세요&#10;(여러 문제는 번호를 붙여 구분하세요)"></textarea>
      <label>총 문항 수</label>
      <input type="number" id="t-total" placeholder="예: 5" min="1">
      <button class="btn" onclick="saveProblems()">저장</button>
      <div id="teacher-msg" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <p class="section-title">비밀번호 변경</p>
      <label>현재 비밀번호</label>
      <input type="password" id="t-old-pw" placeholder="현재 비밀번호">
      <label>새 비밀번호</label>
      <input type="password" id="t-new-pw" placeholder="새 비밀번호">
      <button class="btn" onclick="changePassword('teacher')">변경</button>
      <div id="teacher-pw-msg" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 학생 페이지 -->
  <div id="page-student">
    <button class="nav-back" onclick="logout()">← 로그아웃</button>
    <h1>숙제 풀기</h1>
    <p class="sub">문제를 선택하고 손으로 풀어주세요</p>

    <div class="card">
      <label>이름</label>
      <input type="text" id="s-name" placeholder="이름을 입력하세요">
      <p class="section-title" style="margin-top:8px">문제 선택</p>
      <div id="problem-list-area"><p class="spinner">불러오는 중...</p></div>
    </div>

    <div id="solve-area" style="display:none">
      <div class="card">
        <p class="section-title" id="solve-title"></p>
        <div class="problem-box" id="solve-content"></div>
        <label>손글씨로 풀기 (Apple Pencil 또는 손가락)</label>
        <canvas id="draw-canvas" height="400"></canvas>
        <div class="canvas-btns">
          <button onclick="clearCanvas()">지우기</button>
          <button onclick="undoCanvas()">되돌리기</button>
        </div>
        <button class="btn" onclick="submitAnswer()">제출 & AI 채점</button>
      </div>
    </div>

    <div class="card">
      <p class="section-title">비밀번호 변경</p>
      <label>현재 비밀번호</label>
      <input type="password" id="s-old-pw" placeholder="현재 비밀번호">
      <label>새 비밀번호</label>
      <input type="password" id="s-new-pw" placeholder="새 비밀번호">
      <button class="btn" onclick="changePassword('student')">변경</button>
      <div id="student-pw-msg" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="page-result">
    <button class="nav-back" onclick="backToStudent()">← 다시 풀기</button>
    <h1>채점 결과</h1>
    <div class="card">
      <div class="score-box">
        <div class="score" id="result-score"></div>
        <div class="label" id="result-label"></div>
      </div>
      <p style="font-weight:700; margin-bottom:10px">AI 피드백</p>
      <div class="feedback" id="result-feedback"></div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
const GEMINI_KEY = 'AQ.Ab8RN6LVfn-MmMP7-TbtXpZxEs7seO59LUMMLJOt2bOg3rsYKg';

let currentRole = 'student';
let problems = JSON.parse(localStorage.getItem('mkmath-problems') || '[]');
let selectedProblem = null;
let canvasHistory = [];

function setRole(role) {
  currentRole = role;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && role==='student') || (i===1 && role==='teacher'));
  });
}

async function login() {
  const pw = document.getElementById('login-pw').value;
  const msgEl = document.getElementById('login-msg');
  if (!pw) { showMsg(msgEl, '비밀번호를 입력하세요', 'error'); return; }

  try {
    const res = await fetch(`${SCRIPT_URL}?action=login&role=${currentRole}&password=${encodeURIComponent(pw)}`);
    const data = await res.json();
    if (data.success) {
      show(currentRole === 'teacher' ? 'page-teacher' : 'page-student');
      if (currentRole === 'student') loadProblems();
    } else {
      showMsg(msgEl, '비밀번호가 틀렸습니다', 'error');
    }
  } catch(e) {
    showMsg(msgEl, '연결 오류가 발생했습니다', 'error');
  }
}

function logout() {
  show('page-login');
  document.getElementById('login-pw').value = '';
}

function show(pageId) {
  ['page-login','page-teacher','page-student','page-result'].forEach(id => {
    document.getElementById(id).style.display = id === pageId ? 'block' : 'none';
  });
}

function saveProblems() {
  const title = document.getElementById('t-title').value.trim();
  const content = document.getElementById('t-content').value.trim();
  const total = parseInt(document.getElementById('t-total').value);
  const msgEl = document.getElementById('teacher-msg');

  if (!title || !content || !total) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }

  problems.push({ id: Date.now(), title, content, total });
  localStorage.setItem('mkmath-problems', JSON.stringify(problems));
  document.getElementById('t-title').value = '';
  document.getElementById('t-content').value = '';
  document.getElementById('t-total').value = '';
  showMsg(msgEl, '저장되었습니다!', 'success');
}

function loadProblems() {
  const area = document.getElementById('problem-list-area');
  problems = JSON.parse(localStorage.getItem('mkmath-problems') || '[]');
  if (problems.length === 0) {
    area.innerHTML = '<p style="color:#64748b;font-size:14px">등록된 문제가 없습니다</p>';
    return;
  }
  area.innerHTML = '<ul class="problem-list">' +
    problems.map(p => `<li onclick="selectProblem(${p.id})" id="prob-${p.id}">${p.title}</li>`).join('') +
    '</ul>';
}

function selectProblem(id) {
  selectedProblem = problems.find(p => p.id === id);
  document.querySelectorAll('.problem-list li').forEach(li => li.classList.remove('selected'));
  document.getElementById('prob-' + id).classList.add('selected');
  document.getElementById('solve-title').textContent = selectedProblem.title;
  document.getElementById('solve-content').textContent = selectedProblem.content;
  document.getElementById('solve-area').style.display = 'block';
  initCanvas();
  window.scrollTo(0, document.getElementById('solve-area').offsetTop - 20);
}

// Canvas
let canvas, ctx, drawing = false;

function initCanvas() {
  canvas = document.getElementById('draw-canvas');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 400 * window.devicePixelRatio;
  ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  canvasHistory = [];

  canvas.addEventListener('pointerdown', startDraw);
  canvas.addEventListener('pointermove', draw);
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointerleave', endDraw);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startDraw(e) {
  drawing = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  e.preventDefault();
}

function draw(e) {
  if (!drawing) return;
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  e.preventDefault();
}

function endDraw() {
  if (drawing) {
    canvasHistory.push(canvas.toDataURL());
    drawing = false;
  }
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
  canvasHistory = [];
}

function undoCanvas() {
  if (canvasHistory.length <= 1) { clearCanvas(); return; }
  canvasHistory.pop();
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
    ctx.drawImage(img, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
  };
  img.src = canvasHistory[canvasHistory.length - 1];
}

async function submitAnswer() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) { alert('이름을 입력해주세요'); return; }
  if (!selectedProblem) { alert('문제를 선택해주세요'); return; }

  const btn = document.querySelector('#solve-area .btn');
  btn.textContent = 'AI 채점 중...';
  btn.disabled = true;

  const imageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

  const prompt = `다음은 수학 문제와 학생의 손글씨 답안입니다.

문제:
${selectedProblem.content}

총 문항 수: ${selectedProblem.total}문제

학생의 손글씨 답안 이미지를 보고:
1. 각 문제별로 맞았는지 틀렸는지 판단해주세요
2. 맞은 문제 수를 알려주세요
3. 틀린 문제에 대해 간단한 피드백을 주세요

답변 형식:
점수: X/${selectedProblem.total}
피드백:
(각 문제별 피드백)`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: 'image/jpeg', data: imageData } }
          ]
        }]
      })
    });

    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text;

    const scoreMatch = text.match(/점수:\s*(\d+)\s*\/\s*(\d+)/);
    const score = scoreMatch ? scoreMatch[1] : '?';
    const total = scoreMatch ? scoreMatch[2] : selectedProblem.total;
    const feedback = text.replace(/점수:.*\n?/, '').trim();

    // 점수 저장
    await fetch(`${SCRIPT_URL}?action=saveScore&name=${encodeURIComponent(name)}&date=${new Date().toLocaleDateString('ko-KR')}&score=${score}&total=${total}`);

    document.getElementById('result-score').textContent = `${score} / ${total}`;
    document.getElementById('result-label').textContent = `${name} 학생`;
    document.getElementById('result-feedback').textContent = feedback;
    show('page-result');

  } catch(e) {
    alert('채점 중 오류가 발생했습니다: ' + e.message);
  } finally {
    btn.textContent = '제출 & AI 채점';
    btn.disabled = false;
  }
}

function backToStudent() {
  show('page-student');
}

async function changePassword(role) {
  const oldPw = document.getElementById(role === 'teacher' ? 't-old-pw' : 's-old-pw').value;
  const newPw = document.getElementById(role === 'teacher' ? 't-new-pw' : 's-new-pw').value;
  const msgEl = document.getElementById(role === 'teacher' ? 'teacher-pw-msg' : 'student-pw-msg');

  if (!oldPw || !newPw) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }

  try {
    const res = await fetch(`${SCRIPT_URL}?action=changePassword&role=${role}&oldPassword=${encodeURIComponent(oldPw)}&newPassword=${encodeURIComponent(newPw)}`);
    const data = await res.json();
    if (data.success) {
      showMsg(msgEl, '변경되었습니다!', 'success');
    } else {
      showMsg(msgEl, '현재 비밀번호가 틀렸습니다', 'error');
    }
  } catch(e) {
    showMsg(msgEl, '오류가 발생했습니다', 'error');
  }
}

function showMsg(el, text, type) {
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(() => el.innerHTML = '', 3000);
}
</script>
</body>
</html>
