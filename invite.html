<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="청첩장 모임 초대장">
<meta property="og:description" content="10시 30분, 코지로오모테나시 발산마곡점에서 보아요">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>청첩장 모임 초대장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 장짜리 초대 카드: 사진 위 → 문구 → 버튼, 승인 후 같은 카드가 장소 안내로 바뀜 */
:root{
  --bg:#111f5c; --card:#fbfaf7; --ink:#1a2149; --muted:#6a6f8c;
  --accent:#2b3fa8; --no:#e8e6ef; --noInk:#5b5f78; --line:#e3e1ea;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{overflow-x:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#1c3290 0%,var(--bg) 60%,#0b1440 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:420px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.photo{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:#1d2f86}
.photo img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 6s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.photo::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,var(--card))}
.body{padding:4px 26px 30px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
.msg{color:var(--muted);font-size:15px;line-height:1.75;margin:0 0 26px}
.btns{display:flex;justify-content:center;align-items:center;gap:12px;min-height:72px;flex-wrap:wrap}
button{font-family:var(--body);border:0;border-radius:999px;cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
button:focus-visible{outline:3px solid #f2c14e;outline-offset:3px}
#no{background:var(--no);color:var(--noInk);font-size:var(--nofs,18px);padding:var(--nopad,16px 34px)}
#yes{background:var(--accent);color:#fff;font-weight:700;font-size:var(--yesfs,0px);padding:var(--yespad,0);max-width:100%;overflow:hidden;box-shadow:0 8px 22px rgba(43,63,168,.35)}
#yes.on{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 30px rgba(43,63,168,.6)}}
.tease{min-height:22px;margin:16px 0 0;font-size:14px;color:var(--accent)}
#done{display:none;padding:30px 24px 28px;text-align:center}
.done #intro{display:none}.done #done{display:block;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.time{font-family:var(--display);font-size:46px;font-weight:700;color:var(--accent);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.see{font-family:var(--display);font-size:22px;line-height:1.5;margin:0 0 20px;text-wrap:balance}
.see .place{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.addr{display:block;text-decoration:underline;text-underline-offset:3px}
.url{display:block;margin-top:10px;font-size:14px;color:var(--accent);text-decoration:underline;word-break:break-all}
.map{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);display:block;aspect-ratio:3/2;max-width:100%}
.map img{width:100%;height:100%;object-fit:cover;display:block}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-92%);font-size:40px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:drop .7s .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes drop{from{transform:translate(-50%,-260%);opacity:0}}
.pin::after{content:"코지로";position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);font-size:12px;background:#fff;color:var(--ink);padding:3px 8px;border-radius:8px;font-family:var(--body);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.osm{position:absolute;right:6px;bottom:4px;font-size:10px;color:#555;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px}
.addr{font-size:14px;color:var(--muted);line-height:1.6;margin:14px 0 18px}
.go{display:block;background:#03c75a;color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:15px;border-radius:14px}
.again{margin-top:14px;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
canvas#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var no=document.getElementById('no'), yes=document.getElementById('yes'), tease=document.getElementById('tease'), card=document.getElementById('card');
  var lines=['진짜요...?','한 번만 다시 생각해 봐요','맛있는 거 먹어요 🍶','그러지 말고요 🥺','버튼이 점점 사라지는데요?','이제 승인밖에 없어요 😆'];
  var step=0, MAX=lines.length;
  function apply(){
    var t=step/MAX;
    card.style.setProperty('--nofs',(18*(1-t*0.75))+'px');
    card.style.setProperty('--nopad',(16*(1-t*0.7))+'px '+(34*(1-t*0.7))+'px');
    card.style.setProperty('--yesfs',(step?(14+step*3.2):0)+'px');
    card.style.setProperty('--yespad',step?((12+step*2.5)+'px '+(26+step*5)+'px'):'0');
    yes.classList.toggle('on',step>0);
    yes.tabIndex=step?0:-1;
    if(step>=MAX){no.style.opacity='0';no.style.transform='scale(0)';setTimeout(function(){no.hidden=true},350);}
  }
  no.addEventListener('click',function(){
    if(step>=MAX) return;
    tease.textContent=lines[step]; step++; apply();
  });
  yes.addEventListener('click',function(){
    card.classList.add('done'); window.scrollTo({top:0,behavior:'smooth'}); confetti();
  });
  document.getElementById('again').addEventListener('click',function(){
    step=0; no.hidden=false; no.style.opacity=''; no.style.transform=''; tease.textContent=''; apply(); card.classList.remove('done');
  });
  apply();

  function confetti(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c=document.getElementById('fx'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
    var cols=['#2b3fa8','#f2c14e','#ffffff','#7fa2ff','#ff9eb5'],ps=[];
    for(var i=0;i<140;i++)ps.push({x:W/2,y:H*0.35,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,s:4+Math.random()*5,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.3});
    var t0=performance.now();
    (function f(now){
      x.clearRect(0,0,W,H);
      ps.forEach(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
      if(now-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,W,H);
    })(t0);
  }
})();
