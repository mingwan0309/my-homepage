<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- AI 초안을 손글씨 노트 이미지로 만들 때 쓰는 손글씨 폰트(선생님 화면에서만 사용) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gamja+Flower&display=swap">
  <style>*{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<script>['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});</script>
<title>질의응답 | 김민관 수학</title>
<script src="firebase-api.js?v=51"></script>
<script src="chat-widget.js" defer></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; background:#f8fafc; color:#1e293b; min-height:100vh; overflow-x:hidden; }
.topbar { background:#1e293b; color:#fff; padding:14px 32px; display:flex; align-items:center; justify-content:space-between; }
.topbar-logo { font-size:15px; font-weight:900; }
.topbar-logo span { color:#60a5fa; }
.btn-back { background:#334155; color:#fff; border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
.container { max-width:1100px; margin:0 auto; padding:32px 24px; }

/* LIST */
.page-title { font-size:26px; font-weight:900; margin-bottom:24px; }
.filter-bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.search-wrap { display:flex; gap:8px; flex:1; min-width:200px; }
.search-input { flex:1; padding:9px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px; outline:none; background:#fff; }
.search-input:focus { border-color:#2563eb; }
.btn-search { background:#1e3a8a; color:#fff; border:none; padding:9px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
.toggle-wrap { display:flex; align-items:center; gap:8px; font-size:13px; color:#64748b; white-space:nowrap; }
.toggle { position:relative; width:40px; height:22px; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:#cbd5e1; border-radius:11px; cursor:pointer; transition:0.2s; }
.toggle input:checked + .toggle-slider { background:#2563eb; }
.toggle-slider:before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:0.2s; }
.toggle input:checked + .toggle-slider:before { transform:translateX(18px); }
.unanswered-count { background:#ef4444; color:#fff; border-radius:50%; width:20px; height:20px; font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }

.qna-list { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.qna-item { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid #f1f5f9; cursor:pointer; transition:background 0.1s; }
.qna-item:last-child { border-bottom:none; }
.qna-item:hover { background:#f8fafc; }
.qna-num { width:36px; text-align:center; font-size:13px; color:#94a3b8; font-weight:600; flex-shrink:0; }
.qna-main { flex:1; min-width:0; }
.qna-title-row { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.qna-title { font-size:15px; font-weight:700; color:#1e293b; }
.qna-preview { font-size:13px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:500px; }
.qna-meta { font-size:12px; color:#94a3b8; margin-top:3px; }
.qna-status { flex-shrink:0; }
.badge-answered { background:#b91c1c; color:#fff; font-size:12px; font-weight:700; padding:5px 12px; border-radius:6px; white-space:nowrap; }
.badge-pending { background:#fef9c3; color:#854d0e; font-size:12px; font-weight:700; padding:5px 12px; border-radius:6px; white-space:nowrap; }
.empty-list { text-align:center; padding:60px 0; color:#94a3b8; font-size:14px; }
.spinner { text-align:center; padding:60px 0; color:#64748b; font-size:14px; }

/* DETAIL */
.detail-layout { display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:start; }
.sidebar { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,0.06); position:sticky; top:20px; }
.sidebar-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; gap:8px; }
.sidebar-label { color:#64748b; flex-shrink:0; }
.sidebar-val { font-weight:700; color:#1e293b; text-align:right; }
.sidebar-divider { border:none; border-top:1px solid #f1f5f9; margin:12px 0; }
.sidebar-q-item { font-size:13px; padding:7px 0; border-bottom:1px solid #f8fafc; display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:6px; }
.sidebar-q-item:hover .sq-title { color:#2563eb; }
.sq-title { color:#374151; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sq-title.current { color:#2563eb; }
.sq-time { color:#94a3b8; font-size:11px; white-space:nowrap; flex-shrink:0; }
.sidebar-total { font-size:12px; color:#64748b; margin-top:10px; }

.detail-main { background:#fff; border-radius:12px; padding:28px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.detail-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.btn-list { color:#64748b; font-size:14px; font-weight:600; cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:4px; }
.btn-list:hover { color:#1e293b; }
.detail-title { font-size:22px; font-weight:900; margin-bottom:8px; }
.detail-author { font-size:13px; color:#64748b; margin-bottom:20px; }
.detail-author span { color:#2563eb; font-weight:700; }
.detail-content { font-size:15px; line-height:1.9; color:#1e293b; padding-bottom:20px; border-bottom:1px solid #f1f5f9; word-break:break-word; }
.detail-content img { max-width:100%; border-radius:8px; margin-top:8px; cursor:pointer; border:1.5px solid #e2e8f0; }
.detail-content blockquote { border-left:3px solid #2563eb; padding-left:12px; color:#64748b; margin:8px 0; }
.detail-content h3 { font-size:16px; margin:8px 0 4px; }

.answer-box { margin-top:20px; background:#f8fafc; border-radius:10px; padding:20px; }
.answer-header { font-size:15px; font-weight:900; margin-bottom:4px; }
.answer-teacher { font-size:13px; color:#64748b; margin-bottom:14px; }
.answer-content { font-size:14px; line-height:1.9; color:#1e293b; word-break:break-word; }
.answer-content blockquote { border-left:3px solid #2563eb; padding-left:12px; color:#64748b; margin:8px 0; }
.answer-note { font-size:12px; color:#94a3b8; margin-top:12px; }
.answer-btns { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
.btn-edit-ans { background:none; border:1.5px solid #e2e8f0; color:#374151; padding:5px 12px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; }
.btn-del-ans { background:none; border:1.5px solid #fecaca; color:#dc2626; padding:5px 12px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; }
.no-answer-box { margin-top:20px; border:2px dashed #e2e8f0; border-radius:10px; padding:24px; text-align:center; }
.btn-write-ans { background:#1e3a8a; color:#fff; border:none; padding:10px 24px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; margin-top:12px; }

.detail-footer { display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:20px; border-top:1px solid #f1f5f9; }
.btn-list2 { background:#f1f5f9; color:#374151; border:none; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-del-q { background:#fff; border:1.5px solid #fecaca; color:#dc2626; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }

/* EDITOR */
.editor-section-title { font-size:15px; font-weight:900; margin-bottom:12px; }
.editor-wrap { border:1.5px solid #e2e8f0; border-radius:10px; overflow:hidden; }
.editor-toolbar { background:#f8fafc; padding:8px 10px; display:flex; gap:2px; align-items:center; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; }
.tb-btn { background:none; border:none; padding:4px 8px; border-radius:5px; font-size:13px; font-weight:700; cursor:pointer; color:#374151; min-width:28px; text-align:center; line-height:1; }
.tb-btn:hover { background:#e2e8f0; }
.tb-sep { width:1px; height:18px; background:#e2e8f0; margin:0 3px; flex-shrink:0; }
.editor-body { min-height:160px; padding:14px; font-size:14px; line-height:1.8; outline:none; color:#1e293b; }
.editor-body:empty:before { content:attr(data-placeholder); color:#94a3b8; }
.editor-body blockquote { border-left:3px solid #2563eb; padding-left:12px; color:#64748b; margin:8px 0; }
.editor-body h3 { font-size:16px; margin:8px 0 4px; }
.editor-body img { max-width:100%; border-radius:6px; margin-top:6px; }
.editor-btns { display:flex; justify-content:flex-end; gap:10px; margin-top:12px; }

/* WRITE */
.write-wrap { max-width:720px; margin:0 auto; background:#fff; border-radius:12px; padding:28px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.write-title-h { font-size:20px; font-weight:900; margin-bottom:24px; }
.write-label { font-size:13px; font-weight:700; color:#374151; margin-bottom:6px; display:block; }
.write-input { width:100%; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px; outline:none; margin-bottom:16px; }
.write-input:focus { border-color:#2563eb; }
.write-footer { display:flex; align-items:center; justify-content:space-between; margin-top:16px; flex-wrap:wrap; gap:10px; }
.secret-check { display:flex; align-items:center; gap:7px; font-size:13px; color:#64748b; cursor:pointer; user-select:none; }
.secret-check input { width:15px; height:15px; cursor:pointer; }
.write-btns { display:flex; gap:10px; }
.btn-cancel { background:#f1f5f9; color:#64748b; border:none; padding:10px 20px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-save { background:#0f766e; color:#fff; border:none; padding:10px 24px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }

.denied { text-align:center; padding:80px 20px; }
.denied h2 { font-size:20px; font-weight:800; color:#dc2626; margin-bottom:12px; }
.hidden { display:none !important; }

@media (max-width:768px) {
  html, body { overflow-x:hidden; }
  .detail-layout { grid-template-columns:1fr; }
  .sidebar { position:static; order:-1; padding:16px; }
  .container { padding:18px 13px 40px; }
  .topbar { padding:11px 14px; }
  .btn-back { padding:10px 14px; font-size:13px; }
  /* 학생 네비바 — 손가락 크기 (인라인 스타일보다 우선) */
  #student-nav a { padding:14px 14px !important; font-size:14px !important; }
  #student-nav a[style*="background:#3b6cf7"] { padding:10px 14px !important; font-size:13px !important; }
  /* 검색줄: 좁은 화면에서 버튼과 토글이 겹치므로 세로로 쌓기 */
  .filter-bar { gap:10px; flex-direction:column; align-items:stretch; }
  .search-wrap { width:100%; min-width:0; }
  .toggle-wrap { justify-content:flex-end; width:100%; }
  .qna-preview { max-width:100%; }
  .page-title { font-size:21px; margin-bottom:16px; }
  /* 목록 항목 — 손가락 크기 확보 + 내용 잘 보이게 */
  .qna-item { gap:10px; padding:15px 14px; align-items:flex-start; }
  .qna-num { display:none; }
  .qna-title { font-size:15.5px; }
  .qna-meta { font-size:12.5px; }
  .badge-answered, .badge-pending { font-size:12px; padding:6px 11px; }
  /* 검색 */
  .search-input { font-size:16px; padding:13px 14px; }
  .btn-search { padding:13px 18px; font-size:14px; min-height:46px; }
  .toggle-wrap { font-size:13px; }
  /* 상세 */
  .detail-main { padding:18px 16px; }
  .detail-title { font-size:19px; }
  .detail-author { font-size:13px; }
  .detail-content { font-size:15px; line-height:1.8; }
  .answer-box { padding:16px; }
  .answer-content { font-size:14.5px; }
  .btn-list, .btn-list2, .btn-del-q { font-size:14px; padding:12px 16px; min-height:46px; }
  .btn-edit-ans, .btn-del-ans { padding:10px 14px; font-size:13px; min-height:42px; }
  .btn-write-ans { padding:14px 24px; font-size:15px; min-height:48px; }
  .detail-footer { flex-wrap:wrap; gap:10px; }
  /* 사이드바 */
  .sidebar-row { font-size:13.5px; }
  .sidebar-q-item { padding:11px 0; font-size:13.5px; }
  /* 글쓰기 에디터 */
  .editor-section-title { font-size:16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo" style="cursor:pointer;" onclick="location.href='index.html'">김민관 <span>수학</span></span>
  <a href="index.html" class="btn-back">← 홈으로</a>
</div>

<div id="student-nav" style="display:none;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;gap:4px;align-items:center;position:sticky;top:0;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;">
  <a href="index.html" style="background:#3b6cf7;color:#fff;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;text-decoration:none;margin-right:8px;white-space:nowrap;flex-shrink:0;">🏠 홈</a>
  <a href="clinic.html" style="color:#475569;font-size:13px;font-weight:600;text-decoration:none;padding:12px 14px;white-space:nowrap;flex-shrink:0;">🏥 클리닉 신청</a>
  <a href="qna.html" style="color:#3b6cf7;font-size:13px;font-weight:600;text-decoration:none;padding:12px 14px;border-bottom:2px solid #3b6cf7;white-space:nowrap;flex-shrink:0;">💬 질의응답</a>
  <a href="textbook.html" style="color:#475569;font-size:13px;font-weight:600;text-decoration:none;padding:12px 14px;white-space:nowrap;flex-shrink:0;">📖 부교재 해설 강의</a>
  <a href="mypage.html" style="color:#475569;font-size:13px;font-weight:600;text-decoration:none;padding:12px 14px;white-space:nowrap;flex-shrink:0;">👤 마이페이지</a>
</div>

<!-- ACCESS DENIED -->
<div id="page-denied" class="hidden">
  <div class="denied">
    <h2>로그인이 필요합니다</h2>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;">학생 또는 선생님 계정으로 로그인 후 이용해주세요.</p>
    <a href="index.html" style="background:#2563eb;color:#fff;padding:10px 24px;border-radius:8px;font-weight:700;text-decoration:none;font-size:14px;">로그인하러 가기</a>
  </div>
</div>

<!-- LIST VIEW -->
<div id="view-list" class="hidden">
  <div class="container">
    <div class="page-title">질의응답</div>
    <p style="font-size:12px;color:#94a3b8;margin:-8px 0 14px;">📌 다른 학생들도 볼 수 있는 게시판이에요. 개인적으로 급하게 물어볼 건 우측 하단 💬 1:1 문의를 이용해주세요.</p>
    <div class="filter-bar">
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="검색" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-search" onclick="doSearch()">검색</button>
      </div>
      <div class="toggle-wrap" id="unanswered-wrap">
        <label class="toggle"><input type="checkbox" id="toggle-unanswered" onchange="renderList()"><span class="toggle-slider"></span></label>
        답변 필요 질문만 <span class="unanswered-count" id="unanswered-count">0</span>
      </div>
      <div class="toggle-wrap" id="myquestions-wrap">
        <label class="toggle"><input type="checkbox" id="toggle-mine" onchange="renderList()"><span class="toggle-slider"></span></label>
        내 글만 보기
      </div>
    </div>
    <div id="list-container" class="qna-list"><div class="spinner">불러오는 중...</div></div>
    <div style="margin-top:20px;display:flex;justify-content:flex-end;" id="write-btn-wrap">
      <button onclick="showWrite()" style="background:#0f766e;color:#fff;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;">✏️ 질문 작성</button>
    </div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div id="view-detail" class="hidden">
  <div class="container">
    <div id="detail-layout" class="detail-layout">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-row"><span class="sidebar-label">이름</span><span class="sidebar-val" id="sb-name">-</span></div>
        <div class="sidebar-row"><span class="sidebar-label">고등학교</span><span class="sidebar-val" id="sb-school">-</span></div>
        <div class="sidebar-row"><span class="sidebar-label">수강 강좌</span><span class="sidebar-val" id="sb-class">-</span></div>
        <hr class="sidebar-divider">
        <div id="sb-other-qs"></div>
        <div class="sidebar-total" id="sb-total"></div>
      </div>
      <div class="detail-main">
        <div class="detail-nav">
          <button class="btn-list" onclick="showList()">← 목록으로 돌아가기</button>
          <span id="detail-badge"></span>
        </div>
        <div class="detail-title" id="detail-title"></div>
        <div class="detail-author" id="detail-author"></div>
        <div class="detail-content" id="detail-content"><div class="spinner">불러오는 중...</div></div>
        <div id="ai-draft-box" style="display:none;"></div>
        <div id="answer-section"></div>
        <div class="detail-footer">
          <button class="btn-list2" onclick="showList()">＜ 목록으로</button>
          <div style="display:flex;gap:8px;">
            <button class="btn-edit-q" id="btn-edit-q" onclick="editQuestion()" style="display:none;background:#fff;border:1.5px solid #bfdbfe;color:#1d4ed8;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">수정</button>
            <button class="btn-del-q" id="btn-del-q" onclick="deleteQuestion()">삭제</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- WRITE VIEW -->
<div id="view-write" class="hidden">
  <div class="container">
    <div class="write-wrap">
      <div class="write-title-h">질의응답 작성</div>
      <label class="write-label">제목</label>
      <input type="text" class="write-input" id="write-title" placeholder="문제 질문 시 [과목][교재][페이지][번호]을 먼저 말하고">
      <label class="write-label">내용</label>
      <div class="editor-wrap">
        <div class="editor-toolbar">
          <button class="tb-btn" onclick="fmt('write','formatBlock','h3')" title="제목">H</button>
          <button class="tb-btn" onclick="fmt('write','bold')" title="굵게"><b>B</b></button>
          <button class="tb-btn" onclick="fmt('write','italic')" title="기울임"><i>I</i></button>
          <button class="tb-btn" onclick="fmt('write','underline')" title="밑줄"><u>U</u></button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="fmt('write','insertHorizontalRule')" title="구분선">—</button>
          <button class="tb-btn" onclick="fmt('write','formatBlock','blockquote')" title="인용">❝❞</button>
        </div>
        <div class="editor-body" id="write-editor" contenteditable="true" data-placeholder="문제 질문 시 과목교재페이지번호를 먼저 말하고, 자세하게 질문해주세요"
          onpaste="handlePaste(event,'write')"></div>
      </div>
      <div style="border:2px dashed #e2e8f0;border-radius:8px;padding:14px;text-align:center;color:#94a3b8;font-size:13px;cursor:pointer;margin-top:8px;"
        onclick="document.getElementById('write-file').click()"
        ondragover="event.preventDefault()" ondrop="handleFileDrop(event,'write')">
        📎 사진 또는 파일을 끌어서 업로드
      </div>
      <input type="file" id="write-file" accept="image/*" multiple style="display:none" onchange="insertImages(this.files,'write')">
      <div class="write-footer">
        <label class="secret-check"><input type="checkbox" id="write-secret"> 비밀글</label>
        <div class="write-btns">
          <button class="btn-cancel" onclick="showList()">취소</button>
          <button class="btn-save" id="write-save-btn" onclick="submitQuestion()">저장</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
let session = null;
let allQuestions = [];
let currentQuestion = null;
let currentAnswer = null;
let editingAnswer = false;

window.addEventListener('DOMContentLoaded', function() {
  session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (!session) {
    document.getElementById('page-denied').classList.remove('hidden');
    return;
  }
  var isEmbedded = window.self !== window.top;
  if (isEmbedded) {
    // admin.html 안에 iframe으로 삽입된 경우 - 관리 페이지 자체 메뉴가 있으니 이 페이지의 상단바/탭은 중복이라 숨김
    var tb=document.querySelector('.topbar'); if(tb) tb.style.display='none';
  }
  if (session.role !== 'teacher' && session.role !== 'assistant') {
    document.getElementById('unanswered-wrap').classList.add('hidden');
    if (!isEmbedded) {
      var snav=document.getElementById('student-nav');if(snav){snav.style.display='flex';var mc=document.getElementById('snav-myclass');if(mc&&session.classId)mc.href='class.html?id='+session.classId;}
    }
  } else {
    document.getElementById('myquestions-wrap').classList.add('hidden');
  }
  showList();
});

/* ========= VIEWS ========= */
function showView(name) {
  ['list','detail','write'].forEach(function(v){
    document.getElementById('view-'+v).classList.add('hidden');
  });
  document.getElementById('view-'+name).classList.remove('hidden');
  window.scrollTo(0,0);
}

function showList() {
  editingAnswer = false;
  showView('list');
  loadQuestions();
}

function showDetail(id) {
  editingAnswer = false;
  showView('detail');
  loadDetail(id);
}

function showWrite() {
  showView('write');
  document.getElementById('write-title').value = '';
  document.getElementById('write-editor').innerHTML = '';
  document.getElementById('write-secret').checked = false;
}

/* ========= LIST ========= */
async function loadQuestions() {
  document.getElementById('list-container').innerHTML = '<div class="spinner">불러오는 중...</div>';
  try {
    const url = SU + '?action=getQuestions&role=' + encodeURIComponent(session.role) + '&studentId=' + encodeURIComponent(session.id || '');
    const data = await fetch(url).then(r => r.json());
    allQuestions = data.questions || [];
    renderList();
    // 내 질문 중 답변 달린 것들은 이 목록 화면을 본 순간 "확인함"으로 처리 (질의응답 네비 배지 해제용)
    if (session.role === 'student') {
      var mySeen = new Set(JSON.parse(localStorage.getItem('mkmath_qna_seen') || '[]'));
      allQuestions.forEach(function(q){ if (q.studentId === session.id && q.status === 'answered') mySeen.add(q.id); });
      localStorage.setItem('mkmath_qna_seen', JSON.stringify(Array.from(mySeen)));
    }
  } catch(e) {
    document.getElementById('list-container').innerHTML = '<div class="empty-list">불러오기 실패. 다시 시도해주세요.</div>';
  }
}

function renderList() {
  const keyword = (document.getElementById('search-input').value || '').toLowerCase();
  const unansweredOnly = document.getElementById('toggle-unanswered').checked;
  const pending = allQuestions.filter(q => q.status !== 'answered').length;
  document.getElementById('unanswered-count').textContent = pending;

  const mineOnly = document.getElementById('toggle-mine') && document.getElementById('toggle-mine').checked;
  let list = allQuestions;
  if (keyword) list = list.filter(q => (q.title||'').toLowerCase().includes(keyword) || (q.contentPreview||'').toLowerCase().includes(keyword));
  if (unansweredOnly) list = list.filter(q => q.status !== 'answered');
  if (mineOnly) list = list.filter(q => q.studentId === (session.id || ''));


  if (!list.length) {
    document.getElementById('list-container').innerHTML = '<div class="empty-list">등록된 질문이 없습니다.</div>';
    return;
  }

  document.getElementById('list-container').innerHTML = list.map(function(q, i) {
    const num = allQuestions.indexOf(q) >= 0 ? allQuestions.length - allQuestions.indexOf(q) : '-';
    const lock = q.secret === 'true' ? ' 🔒' : '';
    const canView = q.canSee === true || q.canSee === 'true' || session.role === 'teacher' || session.role === 'assistant' || q.studentId === (session.id || '');
    const badge = q.status === 'answered'
      ? '<span class="badge-answered">답변 완료</span>'
      : '<span class="badge-pending">답변 대기</span>';
    const clickAttr = canView ? 'onclick="showDetail(\'' + q.id + '\')" style="cursor:pointer;"' : 'style="opacity:0.5;cursor:default;"';
    return '<div class="qna-item" ' + clickAttr + '>'
      + '<div class="qna-num">' + num + '</div>'
      + '<div class="qna-main">'
      + '<div class="qna-title-row"><span class="qna-title">' + esc(q.title) + lock + '</span></div>'
      + (q.contentPreview ? '<div class="qna-preview">' + esc(q.contentPreview) + '</div>' : '')
      + '<div class="qna-meta">' + esc(q.studentName) + ' · ' + (q.date||q.createdAt||'') + '</div>'
      + '</div>'
      + '<div class="qna-status">' + badge + '</div>'
      + '</div>';
  }).join('');
}

function doSearch() { renderList(); }

/* ========= DETAIL ========= */
async function loadDetail(id) {
  document.getElementById('detail-title').textContent = '불러오는 중...';
  document.getElementById('detail-content').innerHTML = '';
  document.getElementById('answer-section').innerHTML = '';

  // 선생님/조교만 사이드바 표시
  const isTeacher = session.role === 'teacher' || session.role === 'assistant';
  document.getElementById('sidebar').style.display = isTeacher ? '' : 'none';
  if (!isTeacher) {
    document.getElementById('detail-layout').style.gridTemplateColumns = '1fr';
  } else {
    document.getElementById('detail-layout').style.gridTemplateColumns = '';
  }

  try {
    const url = SU + '?action=getQuestion&id=' + encodeURIComponent(id) + '&role=' + encodeURIComponent(session.role) + '&studentId=' + encodeURIComponent(session.id || '');
    const data = await fetch(url).then(r => r.json());
    if (!data.question) {
      document.getElementById('detail-title').textContent = '';
      document.getElementById('detail-content').innerHTML = '<p style="color:#dc2626;padding:20px 0;">비밀글이거나 존재하지 않는 질문입니다.</p>';
      document.getElementById('detail-badge').innerHTML = '';
      document.getElementById('btn-del-q').style.display = 'none';
      return;
    }
    currentQuestion = data.question;
    currentAnswer = data.answer || null;

    document.getElementById('detail-badge').innerHTML = currentQuestion.status === 'answered'
      ? '<span class="badge-answered">답변 완료</span>'
      : '<span class="badge-pending">답변 대기</span>';
    document.getElementById('detail-title').textContent = currentQuestion.title;
    document.getElementById('detail-author').innerHTML = '<span>' + esc(currentQuestion.studentName) + '(학생)</span> - ' + (currentQuestion.date || '');
    document.getElementById('detail-content').innerHTML = fixDriveImgSrc(currentQuestion.content || '');

    // delete / edit button (본인 or 선생님만)
    var isOwner = currentQuestion.studentId === (session.id || '');
    if (isTeacher || isOwner) {
      document.getElementById('btn-del-q').style.display = '';
    } else {
      document.getElementById('btn-del-q').style.display = 'none';
    }
    // 수정은 본인만 (답변 없을 때만)
    if (isOwner && !currentAnswer) {
      document.getElementById('btn-edit-q').style.display = '';
    } else {
      document.getElementById('btn-edit-q').style.display = 'none';
    }

    // sidebar
    if (isTeacher) {
      document.getElementById('sb-name').textContent = currentQuestion.studentName;
      document.getElementById('sb-school').textContent = '-';
      document.getElementById('sb-class').textContent = '-';
      fetch(SU + '?action=getStudentInfo&studentId=' + encodeURIComponent(currentQuestion.studentId))
        .then(r => r.json()).then(d => {
          if (d.info) {
            document.getElementById('sb-school').textContent = d.info.school || '-';
            document.getElementById('sb-class').textContent = d.info.cls || '-';
          }
        }).catch(() => {});

      const others = data.otherQuestions || [];
      document.getElementById('sb-other-qs').innerHTML = others.map(function(oq) {
        const isCur = oq.id === id;
        return '<div class="sidebar-q-item" onclick="showDetail(\'' + oq.id + '\')">'
          + '<span class="sq-title' + (isCur ? ' current' : '') + '">' + esc(oq.title) + '</span>'
          + '<span class="sq-time">' + relTime(oq.date) + '</span>'
          + '</div>';
      }).join('');
      document.getElementById('sb-total').textContent = (data.studentTotal || others.length) + '개의 질문 기록';
    }

    renderAnswer();
    if (isTeacher) loadAiDraft(currentQuestion.id); else document.getElementById('ai-draft-box').style.display = 'none';
  } catch(e) {
    document.getElementById('detail-content').innerHTML = '<p style="color:#dc2626">불러오기 실패</p>';
  }
}

/* ========= AI 풀이 초안 (선생님/조교 전용, 2026-09-17 추가) =========
   학생이 질문을 올리면 Apps Script가 AI(Gemini Pro 우선, 실패 시 Claude)로 풀이 초안을 만들어 qna_ai_drafts에 저장해두고,
   여기서 그걸 읽어 보여줌. 학생에게는 절대 직접 안 보임 — 선생님이 확인 후 "답변에 넣기"로 써야 공개됨. */
var aiDraftCur = null;
async function loadAiDraft(qid) {
  var box = document.getElementById('ai-draft-box');
  aiDraftCur = null;
  box.style.display = '';
  box.innerHTML = '<div style="margin-top:20px;font-size:12.5px;color:#94a3b8;">🤖 AI 초안 확인 중...</div>';
  try {
    var r = await fetch(SU + '?action=getAiDraft&questionId=' + encodeURIComponent(qid)).then(function(r){ return r.json(); });
    aiDraftCur = r.draft || null;
  } catch(e) { aiDraftCur = null; }
  renderAiDraft();
}
function renderAiDraft() {
  var box = document.getElementById('ai-draft-box');
  var btnStyle = 'padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;';
  var regenBtn = '<button type="button" id="ai-regen-btn" onclick="regenerateAiDraft()" style="' + btnStyle + 'background:#fff;border:1.5px solid #cbd5e1;color:#475569;">🔄 초안 다시 만들기</button>';
  var head = '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;">'
    + '<div style="font-size:14px;font-weight:800;color:#6d28d9;">🤖 AI 풀이 초안 <span style="font-size:11px;font-weight:600;color:#94a3b8;">· 학생에게는 안 보여요. 확인 후 답변에 넣어야 공개돼요</span></div>'
    + '</div>';
  if (!aiDraftCur) {
    box.innerHTML = '<div style="margin-top:20px;background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:14px 16px;">' + head
      + '<div style="font-size:13px;color:#64748b;margin-bottom:10px;">이 질문엔 아직 초안이 없어요. (이 기능 전에 올라온 질문이거나, 아직 만드는 중일 수 있어요 — 보통 30초 안에 생겨요)</div>'
      + '<button type="button" id="ai-regen-btn" onclick="regenerateAiDraft()" style="' + btnStyle + 'background:#7c3aed;border:none;color:#fff;">🤖 지금 초안 만들기</button>'
      + '</div>';
    return;
  }
  if (aiDraftCur.error && !aiDraftCur.text) {
    box.innerHTML = '<div style="margin-top:20px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px 16px;">' + head
      + '<div style="font-size:13px;color:#c2410c;margin-bottom:10px;">초안을 못 만들었어요: ' + esc(aiDraftCur.error) + '</div>' + regenBtn + '</div>';
    return;
  }
  // 노트 사진이 이미 만들어져 있으면(질문 올라올 때 자동 생성) 사진을 먼저 크게 보여주고, 글 초안은 접어둠
  var imgSrc = aiDraftCur.imageUrl ? aiDriveThumb(aiDraftCur.imageUrl) : '';
  var imgBlock = imgSrc
    ? '<div style="background:#fff;border:1px solid #ede9fe;border-radius:8px;padding:8px;">' + aiNoteSplitHtml(imgSrc) + '<div style="font-size:11px;color:#94a3b8;text-align:center;">위: 노트 왼쪽 반 · 아래: 오른쪽 반 (사진 누르면 전체 크게 보기)</div></div>'
    : '<div style="font-size:13px;color:#c2410c;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;">📷 노트 사진이 아직 없어요' + (aiDraftCur.imageError ? ' — ' + esc(aiDraftCur.imageError) : ' (만드는 중이거나 실패했을 수 있어요)') + '</div>';
  box.innerHTML = '<div style="margin-top:20px;background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:14px 16px;">' + head
    + imgBlock
    + '<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12.5px;color:#6d28d9;font-weight:700;">📝 글 초안 보기</summary>'
    + '<div style="white-space:pre-wrap;font-size:14px;line-height:1.7;color:#1e293b;background:#fff;border:1px solid #ede9fe;border-radius:8px;padding:12px 14px;max-height:420px;overflow:auto;margin-top:6px;">' + esc(aiDraftCur.text) + '</div></details>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">'
    + (imgSrc ? '<button type="button" onclick="aiImageToAnswer()" style="' + btnStyle + 'background:#1e3a8a;border:none;color:#fff;">🖼 이 노트 사진을 답변에 넣기</button>' : '')
    + '<button type="button" id="ai-img-btn" onclick="regenerateAiImage()" style="' + btnStyle + 'background:#fff;border:1.5px solid #1e3a8a;color:#1e3a8a;">📷 사진 ' + (imgSrc ? '다시 ' : '') + '만들기</button>'
    + '<button type="button" onclick="aiDraftToAnswer(false)" style="' + btnStyle + 'background:#fff;border:1.5px solid #c4b5fd;color:#6d28d9;">✏️ 글로 넣기</button>'
    + regenBtn
    + '</div>'
    + '<div style="font-size:11.5px;color:#94a3b8;margin-top:8px;">' + (aiDraftCur.createdAt ? aiDraftCur.createdAt + ' 생성 · ' : '') + 'AI 풀이는 틀릴 수 있어요. 꼭 확인하고 고쳐서 보내주세요.</div>'
    + '</div>';
}
// 16:9 가로 노트 사진을 폰에서 읽기 좋게 "왼쪽 반 / 오른쪽 반" 두 장으로 나눠 세로로 쌓아 보여주는 HTML
// (사진 자체는 한 장이고 CSS로 잘라서 보여주는 것 — 사진을 누르면 라이트박스에서 전체가 열림)
function aiNoteSplitHtml(src) {
  var box = 'overflow:hidden;width:100%;aspect-ratio:16/18;border-radius:6px;background:#fff;margin:6px 0;';
  var img = 'width:200%;max-width:none;height:auto;display:block;';
  return '<div class="ai-note-half" style="' + box + '"><img src="' + src + '" style="' + img + '" alt="풀이 노트 왼쪽"></div>'
       + '<div class="ai-note-half" style="' + box + '"><img src="' + src + '" style="' + img + 'margin-left:-100%;" alt="풀이 노트 오른쪽"></div>';
}
// 드라이브 파일 주소 → 화면에 <img>로 뜨는 thumbnail 주소 (view 주소를 그대로 쓰면 이미지가 안 뜸)
function aiDriveThumb(url) {
  var m = String(url || '').match(/\/d\/([^\/]+)/) || String(url || '').match(/[?&]id=([^&]+)/);
  return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600') : url;
}
// 이미 만들어진 노트 사진을 답변 편집기에 바로 넣기 (API 호출 없음)
function aiImageToAnswer() {
  if (!aiDraftCur || !aiDraftCur.imageUrl) return;
  if (!editingAnswer) startEdit();
  var el = document.getElementById('ans-editor');
  if (!el) return;
  var html = aiNoteSplitHtml(aiDriveThumb(aiDraftCur.imageUrl)) + '<p><br></p>';
  el.innerHTML = (el.innerHTML.trim() && el.innerHTML.trim() !== '<br>') ? el.innerHTML + html : html;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
}
// 노트 사진만 다시 만들기 (글 초안은 그대로 두고 Gemini 이미지 생성만 다시 — 결과는 초안 문서에 저장되고 화면을 다시 불러옴)
async function regenerateAiImage() {
  if (!aiDraftCur || !aiDraftCur.text) { alert('글 초안이 먼저 있어야 사진을 만들 수 있어요. "초안 다시 만들기"를 눌러주세요.'); return; }
  var btn = document.getElementById('ai-img-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'AI가 노트 사진 만드는 중... (30초~1분)'; }
  try {
    var r = await fetch(SU, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ action:'aiNoteImage', questionId: currentQuestion.id, content: currentQuestion.content || '', draftText: aiDraftCur.text }) }).then(function(x){ return x.json(); });
    if (!r || !r.success || !r.url) alert('노트 사진 만들기 실패: ' + ((r && (r.msg || r.error)) || '응답 없음'));
  } catch(e) { alert('노트 사진 만들기 실패: ' + (e && e.message || e)); }
  await loadAiDraft(currentQuestion.id);
}
async function regenerateAiDraft() {
  var btn = document.getElementById('ai-regen-btn');
  if (btn) { btn.disabled = true; btn.textContent = '만드는 중... (최대 1분)'; }
  try {
    // silent: 선생님이 직접 눌러서 만드는 거라 "초안 준비됨" 알림톡은 안 보냄
    await fetch(SU, { method:'POST', body: JSON.stringify({ action:'aiDraftAnswer', questionId: currentQuestion.id, title: currentQuestion.title || '', content: currentQuestion.content || '', studentName: currentQuestion.studentName || '', silent: true }) });
  } catch(e) {}
  await loadAiDraft(currentQuestion.id);
}
// 초안을 답변 편집기에 넣기 — asImage면 손글씨 노트 이미지로 만들어 업로드해서 <img>로 삽입
async function aiDraftToAnswer(asImage) {
  if (!aiDraftCur || !aiDraftCur.text) return;
  if (!editingAnswer) startEdit();
  var el = document.getElementById('ans-editor');
  if (!el) return;
  if (!asImage) {
    var html = aiDraftCur.text.split('\n').map(function(line){ return '<p>' + (esc(line) || '<br>') + '</p>'; }).join('');
    el.innerHTML = (el.innerHTML.trim() && el.innerHTML.trim() !== '<br>') ? el.innerHTML + html : html;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  var btn = document.getElementById('ai-img-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'AI가 노트 사진 만드는 중... (30초~1분)'; }
  var marker = 'ai-note-' + Date.now();
  try {
    // Gemini 이미지 생성(Code.gs aiNoteImage): 문제 사진 + 초안 글 → 스프링 노트 손글씨 사진. 키는 Apps Script 스크립트 속성에만 있음.
    el.focus();
    document.execCommand('insertHTML', false, '<span id="' + marker + '" style="color:#94a3b8;">[AI 노트 사진 만드는 중...]</span>');
    var r = await fetch(SU, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ action:'aiNoteImage', questionId: currentQuestion.id, content: currentQuestion.content || '', draftText: aiDraftCur.text }) }).then(function(x){ return x.json(); });
    var span = document.getElementById(marker);
    // Apps Script 바깥 catch는 msg가 아니라 error 필드로 돌려주므로 둘 다 확인, 그것도 없으면 응답 원문을 보여줌(진단용)
    if (!r || !r.success || !r.url) throw new Error((r && (r.msg || r.error)) || ('응답 없음: ' + JSON.stringify(r || null).slice(0, 300)));
    var m = r.url.match(/\/d\/([^\/]+)/);
    var src = m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600') : r.url;
    if (span) span.outerHTML = aiNoteSplitHtml(src) + '<p><br></p>';
    el.scrollIntoView({ behavior:'smooth', block:'center' });
  } catch(e) {
    var sp = document.getElementById(marker); if (sp) sp.remove();
    var msg = (e && e.message) || String(e);
    if (confirm('AI 노트 사진 만들기 실패: ' + msg + '\n\n대신 폰트로 그린 노트 이미지(수식은 정확함)로 넣을까요?')) {
      try {
        var pimg = await loadProblemImageForNote();
        var blob = await renderHandwritingNote(aiDraftCur.text, pimg);
        await insertImages([new File([blob], 'ai_note.jpg', { type:'image/jpeg' })], 'ans');
      } catch(e2) { alert('이미지 만들기 실패: ' + (e2 && e2.message || e2)); }
    }
  }
  if (btn) { btn.disabled = false; btn.textContent = '📷 AI 노트 사진으로 넣기'; }
}
// 초안 텍스트를 "책상 위 스프링 노트를 위에서 찍은 사진"처럼 그림.
// (AI 이미지 생성이 아니라 캔버스 렌더링이라 수식·숫자가 안 틀림 — 이미지 생성 AI는 한글·수식을 자주 망가뜨려서 일부러 이 방식)
// 참고한 모양(2026-09-17 사용자가 준 사진): 왼쪽에 큰 은색 스프링 코일, 크림색 종이에 푸른 회색 줄 + 빨간 세로 여백선,
// 문제 사진(캡처 그대로)을 왼쪽 위에 마스킹테이프 4장으로 붙임, 조각 오른쪽에 "풀이)"부터 시작해서 조각 아래로 이어지는
// 단정한 검은 펜 손글씨, "1. 2." 단계 제목 아래 본문은 들여쓰기, 분수는 위아래로 쌓아서(2/3 → ²⁄₃ 모양), 마지막 "답:" 줄엔 ✓ + 밑줄 두 줄.
async function renderHandwritingNote(text, problemImg) {
  try { await document.fonts.load('32px "Gamja Flower"'); } catch(e) {}
  // 같은 초안이면 매번 같은 모양이 나오게 고정 시드 난수 사용
  var seed = 7;
  String(text || '').split('').forEach(function(ch){ seed = (seed * 31 + ch.charCodeAt(0)) % 2147483647; });
  function rnd() { seed = (seed * 48271) % 2147483647; return seed / 2147483647; }
  function rr(a, b) { return a + (b - a) * rnd(); }

  var W = 1600;
  var PX = 96, PY = 14;                   // 종이 왼쪽 위(왼쪽엔 스프링 자리)
  var PW = W - PX;                        // 종이는 오른쪽 끝까지(사진처럼 잘려 보이게)
  var MARGIN = 150;                       // 빨간 여백선 위치(종이 왼쪽 기준)
  var PADL = MARGIN + 12, PADR = 40, PADTOP = 28, LINE = 62;
  var FS = 40;
  var FAMILY = '"Gamja Flower", "Nanum Pen Script", "Pretendard", sans-serif';
  var INK = '36,36,42';

  // 문제 사진 자리(왼쪽 위, 빨간 여백선 위에 걸쳐서)
  var snip = null;
  if (problemImg && problemImg.naturalWidth) {
    var maxSw = Math.round(PW * 0.38), maxSh = 300;
    var sc = Math.min(maxSw / problemImg.naturalWidth, maxSh / problemImg.naturalHeight, 1.3);
    snip = { w: Math.round(problemImg.naturalWidth * sc), h: Math.round(problemImg.naturalHeight * sc), x: 56, y: PADTOP - 4, rot: rr(-0.8, 0.8) * Math.PI / 180 };
  }
  function lineBox(i) {
    var top = PADTOP + LINE * i;
    if (snip && top < snip.y + snip.h + 10) { var x0 = snip.x + snip.w + 44; return { x: x0, w: PW - x0 - PADR }; }
    return { x: PADL, w: PW - PADL - PADR };
  }

  var measure = document.createElement('canvas').getContext('2d');
  function fontOf(px) { return px + 'px ' + FAMILY; }
  // ---- 한 줄을 토큰으로 쪼갬: 글자 / 분수(a/b → 위아래로 쌓음) / 윗첨자(x², x^2) ----
  var SUPS = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','ⁿ':'n' };
  var FRAC_RE = /^(\([^()]{1,24}\)|[0-9]+|[a-zA-Zπ])\s*\/\s*(\([^()]{1,24}\)|[0-9]+|[a-zA-Zπ])/;
  function stripParen(s) { return /^\(.*\)$/.test(s) ? s.slice(1, -1) : s; }
  function tokenize(line) {
    var toks = [], i = 0;
    while (i < line.length) {
      var rest = line.slice(i), m = FRAC_RE.exec(rest);
      var prev = i > 0 ? line[i - 1] : ' ';
      // 분수: 바로 앞이 글자/숫자가 아닐 때만(예: "x2/3"처럼 붙은 건 제외)
      if (m && !/[0-9a-zA-Z가-힣)]/.test(prev)) { toks.push({ t:'frac', num: stripParen(m[1]), den: stripParen(m[2]) }); i += m[0].length; continue; }
      var ch = line[i];
      if (SUPS[ch]) { toks.push({ t:'sup', s: SUPS[ch] }); i++; continue; }
      if (ch === '^' && i + 1 < line.length && /[0-9a-zA-Z]/.test(line[i + 1])) { toks.push({ t:'sup', s: line[i + 1] }); i += 2; continue; }
      toks.push({ t:'ch', c: ch }); i++;
    }
    return toks;
  }
  function tokW(tk) {
    if (tk.t === 'ch') { measure.font = fontOf(FS); return measure.measureText(tk.c).width * (tk.c === ' ' ? 0.85 : 1); }
    if (tk.t === 'sup') { measure.font = fontOf(FS * 0.55); return measure.measureText(tk.s).width + 2; }
    measure.font = fontOf(FS * 0.74);
    return Math.max(measure.measureText(tk.num).width, measure.measureText(tk.den).width) + 12;
  }

  // ---- 줄바꿈(토큰 단위, 공백에서 끊기) + 단계 제목 아래 들여쓰기 ----
  var paras = String(text || '').split('\n');
  if (!/^\s*풀이/.test(paras[0] || '')) paras.unshift('풀이)');
  var lines = [];   // {toks, indent, isHead, isAns}
  var indent = 0;
  paras.forEach(function(para){
    if (!para.trim()) { lines.push({ toks: [], indent: 0 }); return; }
    var isHead = /^\s*(풀이\)|\d+[.)])/.test(para);
    var isAns = /^\s*답\s*[:：]/.test(para);
    if (isHead) indent = /^\s*풀이/.test(para) ? 0 : 34;
    var myIndent = isHead ? 0 : indent;
    var toks = tokenize(para.replace(/^\s+/, ''));
    var cur = [], curW = 0, lastSpace = -1;
    for (var k = 0; k < toks.length; k++) {
      var w = tokW(toks[k]);
      var avail = lineBox(lines.length).w - myIndent - (isAns ? 42 : 0);
      if (curW + w > avail && cur.length) {
        var cut = lastSpace > 0 ? lastSpace : cur.length;
        lines.push({ toks: cur.slice(0, cut), indent: myIndent, isHead: isHead, isAns: isAns });
        var carry = cur.slice(cut).filter(function(t, idx){ return !(idx === 0 && t.t === 'ch' && t.c === ' '); });
        cur = carry; curW = 0; cur.forEach(function(t){ curW += tokW(t); }); lastSpace = -1;
        isHead = false; isAns = false; myIndent = indent;
      }
      cur.push(toks[k]); curW += w;
      if (toks[k].t === 'ch' && toks[k].c === ' ') lastSpace = cur.length;
    }
    if (cur.length) lines.push({ toks: cur, indent: myIndent, isHead: isHead, isAns: isAns });
  });
  var minLines = snip ? Math.ceil((snip.h + 30) / LINE) + 3 : 6;
  var PH = PADTOP + Math.max(lines.length, minLines) * LINE + 36;
  var H = PY + PH;

  var c = document.createElement('canvas'); c.width = W; c.height = H;
  var ctx = c.getContext('2d');

  // 나무 책상(왼쪽 스프링 뒤로 살짝 보임)
  var wood = ctx.createLinearGradient(0, 0, 0, H);
  wood.addColorStop(0, '#a8825d'); wood.addColorStop(1, '#8f6a45');
  ctx.fillStyle = wood; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(60,35,10,0.12)'; ctx.lineWidth = 1;
  for (var g = 0; g < 40; g++) { var gy = rnd() * H; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(PX + 10, gy + rr(-4, 4)); ctx.stroke(); }

  // 아래 깔린 장들 + 맨 위 종이
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.30)'; ctx.shadowBlur = 16; ctx.shadowOffsetX = -3; ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#ece9e0'; ctx.fillRect(PX - 2, PY + 6, PW + 4, PH);
  ctx.fillStyle = '#f3f1e9'; ctx.fillRect(PX - 1, PY + 3, PW + 4, PH);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#f9f8f3'; ctx.fillRect(PX, PY, PW, PH);
  ctx.restore();
  // 빛과 그늘: 스프링 쪽 종이 휨 + 오른쪽 아래 살짝 어두움
  var curl = ctx.createLinearGradient(PX, 0, PX + 120, 0);
  curl.addColorStop(0, 'rgba(70,55,35,0.20)'); curl.addColorStop(1, 'rgba(70,55,35,0)');
  ctx.fillStyle = curl; ctx.fillRect(PX, PY, 120, PH);
  var light = ctx.createLinearGradient(PX, PY, W, H);
  light.addColorStop(0, 'rgba(255,255,255,0.10)'); light.addColorStop(1, 'rgba(100,85,60,0.13)');
  ctx.fillStyle = light; ctx.fillRect(PX, PY, PW, PH);
  // 종이 질감
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (var n = 0; n < (PW * PH) / 260; n++) { ctx.fillRect(PX + rnd() * PW, PY + rnd() * PH, 1.3, 1.3); }
  for (var b = 0; b < 12; b++) {
    var bx = PX + rnd() * PW, by = PY + rnd() * PH, br = 80 + rnd() * 180;
    var bl = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    bl.addColorStop(0, 'rgba(120,100,70,' + rr(0.012, 0.035) + ')'); bl.addColorStop(1, 'rgba(120,100,70,0)');
    ctx.fillStyle = bl; ctx.fillRect(bx - br, by - br, br * 2, br * 2);
  }
  // 줄(푸른 회색) + 빨간 여백선
  ctx.strokeStyle = 'rgba(110,130,165,0.42)'; ctx.lineWidth = 1.3;
  for (var y = PY + PADTOP + LINE * 0.78; y < PY + PH - 10; y += LINE) { ctx.beginPath(); ctx.moveTo(PX + 40, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(215,90,90,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(PX + MARGIN, PY); ctx.lineTo(PX + MARGIN, PY + PH); ctx.stroke();

  // 큰 은색 스프링 코일(사진처럼 촘촘하게): 종이 구멍 → 왼쪽으로 크게 도는 타원 고리
  for (var sy = PY + 24; sy < H - 8; sy += 34) {
    ctx.beginPath(); ctx.ellipse(PX + 14, sy + 2, 5, 9, 0, 0, Math.PI * 2); ctx.fillStyle = '#3a2a1c'; ctx.fill();
    function coil(dx, dy, col, w) {
      ctx.beginPath(); ctx.ellipse(PX - 26 + dx, sy + dy, 44, 12, -0.22, 0, Math.PI * 2);
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
    }
    coil(2, 3, 'rgba(0,0,0,0.30)', 6);
    coil(0, 0, '#9a9ba0', 5.4);
    coil(-0.5, -1.2, '#eef0f2', 1.8);
  }

  // 문제 사진: 캡처 그대로(테두리 없이) 살짝 기울여 붙이고 마스킹테이프 4장
  if (snip) {
    var cx = PX + snip.x + snip.w / 2, cy = PY + snip.y + snip.h / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(snip.rot);
    ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 2;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-snip.w / 2, -snip.h / 2, snip.w, snip.h);
    ctx.shadowColor = 'transparent';
    try { ctx.drawImage(problemImg, -snip.w / 2, -snip.h / 2, snip.w, snip.h); } catch(e) {}
    function tape(tx, ty, ang, len) {
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(ang);
      var tw = len || 120, th = 34;
      ctx.beginPath(); ctx.moveTo(-tw / 2, -th / 2);
      for (var i = 0; i <= 6; i++) ctx.lineTo(-tw / 2 + rr(-3, 3), -th / 2 + (th / 6) * i);
      ctx.lineTo(-tw / 2, th / 2); ctx.lineTo(tw / 2, th / 2);
      for (var j = 6; j >= 0; j--) ctx.lineTo(tw / 2 + rr(-3, 3), -th / 2 + (th / 6) * j);
      ctx.closePath();
      ctx.fillStyle = 'rgba(238,226,186,0.62)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,140,95,0.18)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
    tape(-snip.w / 2 + 14, -snip.h / 2 + 10, -0.78, 130);      // 왼쪽 위 대각선
    tape(snip.w / 2 - 22, -snip.h / 2 + 38, 1.35, 110);        // 오른쪽 위 세로에 가깝게
    tape(-snip.w / 2 + 2, snip.h / 2 - 26, -0.78, 120);        // 왼쪽 아래 대각선
    tape(snip.w / 2 - 30, snip.h / 2 - 4, 0.78, 130);          // 오른쪽 아래 대각선
    ctx.restore();
  }

  // ---- 손글씨 ----
  ctx.textBaseline = 'alphabetic';
  function drawGlyph(s, x, y, px, heavy) {
    var size = px + rr(-0.6, 0.6), rot = rr(-0.8, 0.8) * Math.PI / 180, dy = rr(-0.8, 0.8);
    ctx.save(); ctx.translate(x, y + dy); ctx.rotate(rot);
    ctx.font = fontOf(size);
    ctx.fillStyle = 'rgba(' + INK + ',' + rr(0.9, 1) + ')';
    ctx.fillText(s, 0, 0);
    ctx.strokeStyle = 'rgba(' + INK + ',' + rr(0.5, 0.8) + ')';
    ctx.lineWidth = heavy ? rr(0.9, 1.3) : rr(0.25, 0.6); ctx.lineJoin = 'round';
    ctx.strokeText(s, 0, 0);
    ctx.restore();
  }
  lines.forEach(function(ln, i){
    if (!ln.toks.length) return;
    var box = lineBox(i);
    var baseY = PY + PADTOP + LINE * 0.78 + i * LINE - 7 + Math.sin(i * 1.3) * 1;
    var x = PX + box.x + ln.indent + rr(-2, 2);
    if (ln.isAns) {
      ctx.save(); ctx.strokeStyle = 'rgba(' + INK + ',0.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 6, baseY - 14); ctx.lineTo(x + 4, baseY - 2); ctx.lineTo(x + 28, baseY - 36); ctx.stroke(); ctx.restore();
      x += 44;
    }
    var startX = x;
    ln.toks.forEach(function(tk){
      if (tk.t === 'ch') {
        drawGlyph(tk.c, x, baseY, FS, ln.isHead);
        x += tokW(tk) + rr(-0.3, 0.3);
      } else if (tk.t === 'sup') {
        drawGlyph(tk.s, x - 3, baseY - FS * 0.45, FS * 0.55, false);
        x += tokW(tk) - 3;
      } else {
        // 분수: 분자 / 가로선 / 분모를 위아래로 쌓음
        var fpx = FS * 0.74, w = tokW(tk);
        measure.font = fontOf(fpx);
        var nw = measure.measureText(tk.num).width, dw = measure.measureText(tk.den).width;
        drawGlyph(tk.num, x + (w - nw) / 2, baseY - FS * 0.42, fpx, false);
        drawGlyph(tk.den, x + (w - dw) / 2, baseY + fpx * 0.66, fpx, false);
        ctx.save(); ctx.strokeStyle = 'rgba(' + INK + ',0.9)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x + 2, baseY - FS * 0.30 + rr(-0.5, 0.5)); ctx.lineTo(x + w - 2, baseY - FS * 0.30 + rr(-0.5, 0.5)); ctx.stroke(); ctx.restore();
        x += w + 2;
      }
    });
    if (ln.isAns) {
      ctx.save(); ctx.strokeStyle = 'rgba(' + INK + ',0.9)'; ctx.lineCap = 'round';
      [[9, 2.6], [16, 2.2]].forEach(function(u){
        ctx.lineWidth = u[1]; ctx.beginPath();
        for (var t = 0; t <= 1; t += 0.1) { var ux = startX - 4 + (x - startX + 10) * t, uy = baseY + u[0] + Math.sin(t * 9) * 1.2 + rr(-0.6, 0.6); if (t === 0) ctx.moveTo(ux, uy); else ctx.lineTo(ux, uy); }
        ctx.stroke();
      });
      ctx.restore();
    }
  });

  // 사진 느낌 마무리: 가장자리 살짝 어둡게
  var vig = ctx.createRadialGradient(W * 0.5, H * 0.45, H * 0.4, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(40,30,20,0.16)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

  return new Promise(function(resolve, reject){ c.toBlob(function(b){ b ? resolve(b) : reject(new Error('canvas')); }, 'image/jpeg', 0.92); });
}

// 질문에 첨부된 첫 번째 문제 사진을 캔버스에 그릴 수 있는 이미지로 불러옴 (없거나 실패하면 null)
// 드라이브 썸네일 주소는 캔버스에서 바로 못 쓰는 경우(CORS)가 있어서, 그때는 Apps Script로 파일 바이트를 나눠 받아옴(class.html 다운로드와 같은 방식)
async function loadProblemImageForNote() {
  var html = (currentQuestion && currentQuestion.content) || '';
  var m = /(?:drive\.google\.com\/file\/d\/|drive\.google\.com\/thumbnail\?id=|[?&]id=)([A-Za-z0-9_-]{20,})/.exec(html);
  if (!m) return null;
  var fileId = m[1];
  function loadImg(src) {
    return new Promise(function(resolve, reject){
      var im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = function(){ resolve(im); }; im.onerror = function(){ reject(new Error('img')); };
      im.src = src;
    });
  }
  try {
    var im = await loadImg('https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1200');
    // 실제로 캔버스에 그릴 수 있는지(오염 여부) 확인
    var t = document.createElement('canvas'); t.width = 2; t.height = 2;
    var tc = t.getContext('2d'); tc.drawImage(im, 0, 0, 2, 2); tc.getImageData(0, 0, 1, 1);
    return im;
  } catch(e) {}
  try {
    var CHUNK = 250000, start = 0, total = null, mime = 'image/jpeg', chunks = [];
    while (true) {
      var res = await fetch(SU, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ action:'getFileBase64', fileId: fileId, start: start, length: CHUNK }) });
      var d = await res.json();
      if (!d.success || !d.base64) return null;
      var bin = atob(d.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      chunks.push(bytes);
      if (total === null) { total = d.totalSize; mime = d.mimeType || mime; }
      start += bytes.length;
      if (bytes.length === 0 || start >= total) break;
    }
    var blob = new Blob(chunks, { type: mime });
    var url = URL.createObjectURL(blob);
    var im2 = await loadImg(url);
    return im2;
  } catch(e) { return null; }
}

  if (currentAnswer) {
    let html = '<div class="answer-box">'
      + '<div class="answer-header">답변</div>'
      + '<div class="answer-teacher">' + esc(currentAnswer.answeredBy || '김민관 선생님') + ' · ' + relTime(currentAnswer.createdAt) + '</div>'
      + '<div class="answer-content">' + fixDriveImgSrc(currentAnswer.content || '') + '</div>';
    if (isTeacher) {
      html += '<div class="answer-btns">'
        + '<button class="btn-edit-ans" onclick="startEdit()">✏️ 수정</button>'
        + '<button class="btn-del-ans" onclick="doDeleteAnswer()">🗑 삭제</button>'
        + '</div>';
    } else {
      html += '<div class="answer-note">질문 작성자가 아직 답변을 확인하지 않았어요.</div>';
    }
    html += '</div>';
    sec.innerHTML = html;
  } else {
    if (isTeacher) {
      sec.innerHTML = '<div class="no-answer-box"><p style="font-size:14px;color:#64748b;margin-bottom:4px;">아직 답변이 없습니다.</p><button class="btn-write-ans" onclick="startEdit()">답변 작성하기</button></div>';
    } else {
      sec.innerHTML = '<div class="no-answer-box"><p style="font-size:14px;color:#94a3b8;">선생님의 답변을 기다리고 있어요 🙏</p></div>';
    }
  }
}

function startEdit() { editingAnswer = true; renderAnswer(); }
function cancelEdit() { editingAnswer = false; renderAnswer(); }

async function saveAnswer() {
  const el = document.getElementById('ans-editor');
  if (!el) return;
  const content = el.innerHTML.trim();
  if (!content) { alert('답변 내용을 입력해주세요.'); return; }
  const answererName = session.role === 'assistant' ? ((session.name || '') + ' 조교') : '김민관 선생님';
  try {
    if (currentAnswer) {
      await fetch(SU, {method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateAnswer',id:currentAnswer.id,content:content,by:answererName})});
      currentAnswer.content = content;
      currentAnswer.answeredBy = answererName;
    } else {
      const newId = String(Date.now());
      await fetch(SU, {method:'POST',mode:'no-cors',body:JSON.stringify({action:'submitAnswer',questionId:currentQuestion.id,content:content,id:newId,by:answererName})});
      currentAnswer = { id: newId, content: content, createdAt: '방금 전', answeredBy: answererName };
      currentQuestion.status = 'answered';
      document.getElementById('detail-badge').innerHTML = '<span class="badge-answered">답변 완료</span>';
    }
    editingAnswer = false;
    renderAnswer();
  } catch(e) { alert('저장 실패'); }
}

async function doDeleteAnswer() {
  if (!confirm('답변을 삭제하시겠습니까?')) return;
  try {
    await fetch(SU + '?action=deleteAnswer&id=' + encodeURIComponent(currentAnswer.id) + '&questionId=' + encodeURIComponent(currentQuestion.id));
    currentAnswer = null;
    currentQuestion.status = 'pending';
    document.getElementById('detail-badge').innerHTML = '<span class="badge-pending">답변 대기</span>';
    editingAnswer = false;
    renderAnswer();
  } catch(e) { alert('삭제 실패'); }
}

function editQuestion() {
  // showWrite()가 폼을 초기화하므로 먼저 열고 그 다음 값 채움
  showWrite();
  document.getElementById('write-title').value = currentQuestion.title || '';
  document.getElementById('write-editor').innerHTML = currentQuestion.content || '';
  var secretChk = document.getElementById('write-secret');
  if (secretChk) secretChk.checked = currentQuestion.secret === true || String(currentQuestion.secret) === 'true';
  document.querySelector('#view-write .write-title-h').textContent = '질문 수정';
  var submitBtn = document.getElementById('write-save-btn');
  if (submitBtn) {
    submitBtn.textContent = '수정 완료';
    submitBtn.onclick = submitEditQuestion;
  }
}

async function submitEditQuestion() {
  const title = document.getElementById('write-title').value.trim();
  const content = document.getElementById('write-editor').innerHTML.trim();
  const secretChk = document.getElementById('write-secret');
  const secret = secretChk ? secretChk.checked : false;
  if (!title) { alert('제목을 입력해주세요.'); return; }
  if (!content || content === '<br>') { alert('내용을 입력해주세요.'); return; }
  try {
    await fetch(SU, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({ action: 'updateQuestion', id: currentQuestion.id, title, content, secret })
    });
    currentQuestion.title = title;
    currentQuestion.content = content;
    currentQuestion.secret = secret;
    // 작성 폼 원래대로 복원
    var submitBtn = document.getElementById('write-save-btn');
    if (submitBtn) { submitBtn.textContent = '질문 등록'; submitBtn.onclick = submitQuestion; }
    document.querySelector('#view-write .write-title-h').textContent = '질의응답 작성';
    showDetail(currentQuestion.id);
  } catch(e) { alert('수정 실패. 다시 시도해주세요.'); }
}

async function deleteQuestion() {
  if (!confirm('이 질문을 삭제하시겠습니까?')) return;
  try {
    await fetch(SU + '?action=deleteQuestion&id=' + encodeURIComponent(currentQuestion.id) + '&role=' + session.role + '&studentId=' + encodeURIComponent(session.id || ''));
    showList();
  } catch(e) { alert('삭제 실패'); }
}

/* ========= WRITE ========= */
async function submitQuestion() {
  const title = document.getElementById('write-title').value.trim();
  const content = document.getElementById('write-editor').innerHTML.trim();
  if (!title) { alert('제목을 입력해주세요.'); return; }
  if (!content) { alert('내용을 입력해주세요.'); return; }
  const secret = document.getElementById('write-secret').checked ? 'true' : 'false';
  const btn = document.getElementById('write-save-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    await fetch(SU, {method:'POST', mode:'no-cors', body:JSON.stringify({action:'submitQuestion', title:title, content:content, studentId:session.id||'', studentName:session.name||'', secret:secret})});
    alert('질문이 등록되었습니다!');
    showList();
  } catch(e) {
    alert('등록 실패. 다시 시도해주세요.');
  }
  btn.disabled = false; btn.textContent = '저장';
}

/* ========= EDITOR ========= */
function fmt(editorId, cmd, val) {
  const el = document.getElementById(editorId === 'write' ? 'write-editor' : 'ans-editor');
  if (!el) return;
  el.focus();
  document.execCommand(cmd, false, val || null);
}

function handlePaste(e, editorId) {
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      e.preventDefault();
      const file = items[i].getAsFile();
      insertImages([file], editorId);
      return;
    }
  }
}

function handleFileDrop(e, editorId) {
  e.preventDefault();
  insertImages(e.dataTransfer.files, editorId);
}

async function insertImages(files, editorId) {
  const el = document.getElementById(editorId === 'write' ? 'write-editor' : 'ans-editor');
  if (!el) return;
  const imgFiles = Array.from(files).filter(function(f){ return f.type && f.type.indexOf('image/') === 0; });
  for (const file of imgFiles) {
    if (file.size > 8 * 1024 * 1024) { alert(file.name + ' 파일이 너무 커요 (8MB 이하로 올려주세요).'); continue; }
    el.focus();
    const marker = 'img-up-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    document.execCommand('insertHTML', false, '<span id="' + marker + '" style="color:#94a3b8;">[이미지 업로드 중...]</span>');
    try {
      const base64 = await new Promise(function(resolve, reject){
        const reader = new FileReader();
        reader.onload = function(ev){ resolve(ev.target.result.split(',')[1]); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const up = await fetch(SU, {
        method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'uploadFile', fileName: 'qna_' + (session.id || '') + '_' + Date.now(), mimeType: file.type || 'image/jpeg', fileData: base64 })
      }).then(function(r){ return r.json(); });
      const span = document.getElementById(marker);
      if (up.success && span) {
        // uploadFile이 돌려주는 주소는 구글 드라이브 "보기" 페이지라서 <img>에 그대로 쓰면 안 뜬다.
        // 실제 이미지로 보이게 하려면 파일 id만 뽑아서 thumbnail 주소로 바꿔줘야 한다(다른 화면들과 동일한 방식).
        const m = up.url.match(/\/d\/([^\/]+)/) || up.url.match(/[?&]id=([^&]+)/);
        const imgSrc = m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600') : up.url;
        span.outerHTML = '<img src="' + imgSrc + '" style="max-width:100%;">';
      } else if (span) {
        // 왜 실패했는지 화면에 같이 보여줘야 원인을 찾을 수 있음(예전엔 "실패"만 떠서 진단이 안 됐음)
        var why = (up && (up.error || up.msg)) || '서버 응답 없음';
        console.error('[qna] 이미지 업로드 실패:', up);
        span.outerHTML = '<span style="color:#dc2626;">[이미지 업로드 실패: ' + esc(String(why)).slice(0, 200) + ']</span>';
      }
    } catch (e) {
      console.error('[qna] 이미지 업로드 예외:', e);
      const span = document.getElementById(marker);
      if (span) span.outerHTML = '<span style="color:#dc2626;">[이미지 업로드 실패: ' + esc(String((e && e.message) || e)).slice(0, 200) + ']</span>';
    }
  }
}

/* ========= HELPERS ========= */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 예전 버그로 이미지 주소가 구글 드라이브 "보기 페이지"(.../view) 그대로 저장된 옛 질문/답변도
// 화면에 보여줄 때 실제 이미지 주소(thumbnail)로 바꿔서 보이게 함(저장된 데이터 자체는 그대로 둠)
function fixDriveImgSrc(html) {
  if (!html) return html;
  return html.replace(/<img([^>]*)src="([^"]*drive\.google\.com[^"]*)"/gi, function(full, attrs, src){
    var m = src.match(/\/d\/([^\/]+)/) || src.match(/[?&]id=([^&]+)/);
    if (!m) return full;
    return '<img' + attrs + 'src="https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600"';
  });
}

function relTime(str) {
  if (!str) return '';
  try {
    // "yyyy.MM.dd HH:mm" 또는 "yyyy-MM-dd HH:mm" 파싱
    const m = str.match(/(\d{4})[.\-](\d{2})[.\-](\d{2})\s+(\d{2}):(\d{2})/);
    if (!m) return str;
    const d = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return '방금 전';
    if (mins < 60) return mins + '분 전';
    const h = Math.floor(mins / 60);
    if (h < 24) return h + '시간 전';
    const days = Math.floor(h / 24);
    if (days < 30) return days + '일 전';
    return Math.floor(days / 30) + '달 전';
  } catch(e) { return str; }
}
</script>
<!-- 사진 크게 보기 (2026-09-18): 질문/답변/AI 초안 안의 사진을 누르면 전체화면으로 열리고, 그동안만 핀치줌 허용 -->
<style>
#img-lb{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.95);display:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pinch-zoom pan-x pan-y;}
#img-lb.on{display:block;}
#img-lb .lb-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 8px 24px;box-sizing:border-box;}
#img-lb img{max-width:100%;height:auto;display:block;border-radius:6px;background:#fff;}
#img-lb.zoomed .lb-wrap{align-items:flex-start;justify-content:flex-start;}
#img-lb.zoomed img{max-width:none;width:220%;}
#img-lb .lb-bar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 10px;background:rgba(0,0,0,.6);z-index:2;}
#img-lb .lb-bar button{height:38px;padding:0 14px;border-radius:8px;border:1px solid #64748b;background:#1e293b;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
#img-lb .lb-hint{position:fixed;left:0;right:0;top:50px;text-align:center;font-size:12px;color:#cbd5e1;pointer-events:none;z-index:2;}
</style>
<div id="img-lb" onclick="if(event.target===this||event.target.classList.contains('lb-wrap'))closeImgLb()">
  <div class="lb-bar"><button type="button" id="lb-zoom-btn" onclick="toggleImgLbZoom()">🔍 확대</button><button type="button" onclick="closeImgLb()">✕ 닫기</button></div>
  <div class="lb-hint">두 손가락으로 벌리면 더 확대돼요 · 사진을 눌러도 확대/축소</div>
  <div class="lb-wrap"><img id="img-lb-img" alt="" onclick="toggleImgLbZoom()"></div>
</div>
<script>
(function(){
  var ORIG_VP = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover';
  function setVp(zoomable){ var m = document.querySelector('meta[name="viewport"]'); if (m) m.setAttribute('content', zoomable ? 'width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover' : ORIG_VP); }
  window.openImgLb = function(src){
    var lb = document.getElementById('img-lb'), im = document.getElementById('img-lb-img');
    // 드라이브 썸네일이면 더 큰 해상도로 요청
    im.src = String(src || '').replace(/([?&]sz=)w\d+/, '$1w2400');
    lb.classList.remove('zoomed'); document.getElementById('lb-zoom-btn').textContent = '🔍 확대';
    lb.classList.add('on'); lb.scrollTop = 0; lb.scrollLeft = 0;
    document.body.style.overflow = 'hidden'; setVp(true);
  };
  window.closeImgLb = function(){
    var lb = document.getElementById('img-lb'); lb.classList.remove('on','zoomed');
    document.getElementById('img-lb-img').src = ''; document.body.style.overflow = ''; setVp(false);
  };
  window.toggleImgLbZoom = function(){
    var lb = document.getElementById('img-lb'); lb.classList.toggle('zoomed');
    document.getElementById('lb-zoom-btn').textContent = lb.classList.contains('zoomed') ? '🔎 축소' : '🔍 확대';
  };
  // 질문 본문/답변/AI 초안 안의 사진 클릭 → 크게 보기 (편집 중인 입력창 안 사진은 제외)
  document.addEventListener('click', function(e){
    var img = e.target && e.target.closest ? e.target.closest('img') : null;
    if (!img || !img.src) return;
    if (img.closest('#img-lb') || img.closest('[contenteditable="true"]') || img.closest('.editor')) return;
    if (!img.closest('#detail-content') && !img.closest('#answer-section') && !img.closest('#ai-draft-box')) return;
    e.preventDefault(); openImgLb(img.src);
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.getElementById('img-lb').classList.contains('on')) closeImgLb(); });
})();
</script>
