<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; background:#f1f5f9; color:#1e293b; min-height:100vh; }
.topbar { background:#1e293b; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
.topbar-logo { font-size:15px; font-weight:900; }
.topbar-logo span { color:#60a5fa; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.topbar-user { font-size:13px; color:#94a3b8; }
.btn-home { background:#334155; color:#fff; border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
.btn-logout-t { background:none; border:none; color:#64748b; font-size:12px; cursor:pointer; }
.btn-logout-t:hover { color:#ef4444; }
.container { max-width:760px; margin:0 auto; padding:32px 20px; }
.section-title { font-size:20px; font-weight:900; margin-bottom:6px; }
.section-sub { font-size:13px; color:#64748b; margin-bottom:24px; }
.clinic-card { background:#fff; border-radius:14px; box-shadow:0 1px 6px rgba(0,0,0,0.07); padding:22px 24px; margin-bottom:14px; cursor:pointer; border:2px solid transparent; transition:all 0.15s; }
.clinic-card:hover { border-color:#3b82f6; box-shadow:0 4px 16px rgba(59,130,246,0.12); }
.clinic-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.clinic-card-name { font-size:16px; font-weight:800; margin-bottom:4px; }
.clinic-card-loc { font-size:13px; color:#64748b; }
.clinic-card-desc { font-size:13px; color:#475569; margin-top:8px; line-height:1.5; }
.clinic-badge { background:#f0fdf4; color:#16a34a; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
.empty { text-align:center; padding:80px 20px; color:#94a3b8; font-size:15px; }
.spinner { text-align:center; padding:60px; color:#64748b; font-size:14px; }
.skeleton { background:#fff; border-radius:14px; padding:22px 24px; margin-bottom:14px; }
.skel-line { background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; }
.skel-title { height:18px; width:40%; margin-bottom:10px; }
.skel-sub { height:13px; width:65%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* 예약 탭 */
.tabs { display:flex; gap:0; border-bottom:2px solid #e2e8f0; margin-bottom:24px; }
.tab { padding:10px 20px; font-size:14px; font-weight:700; color:#94a3b8; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; }

.booking-meta { font-size:13px; color:#64748b; }

.btn-cancel:hover { background:#fee2e2; }

/* 모달 */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center; }
.modal-bg.show { display:flex; }

/* 달력 */

.cal-day:hover:not(.disabled):not(.empty-day) { background:#eff6ff; color:#2563eb; }

/* 시간 슬롯 */

.time-btn { padding:10px 8px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; background:#fff; text-align:center; transition:all 0.12s; }

.btn-ok { background:#2563eb; color:#fff; }
.btn-ok:hover { background:#1d4ed8; }

.btn-cl:hover { background:#e2e8f0; }

  .clinic-card-loc{font-size:13px;}
  .clinic-card-desc{font-size:13.5px;}
  .clinic-badge{font-size:12.5px;padding:6px 12px;}
  /* 탭 */

  /* 모달 */
  .modal{padding:18px 16px;width:94%;}

  .modal-sub{font-size:13px;}
  .step-label{font-size:13px;padding:7px 13px;}
  /* 달력 — 손가락으로 편하게 */
  .cal-nav span{font-size:16px;}
  .cal-nav button{font-size:26px;padding:6px 12px;}
  .cal-dow{font-size:12px;padding:6px 0;}
  .cal-day{padding:0;height:44px;line-height:44px;font-size:15px;border-radius:10px;}
  .cal-grid{gap:5px;}
  /* 시간 슬롯 */
  .time-grid{grid-template-columns:repeat(2,1fr);gap:9px;}
  .time-btn{padding:14px 8px;font-size:15px;min-height:52px;}
  .time-count{font-size:11.5px;}
  /* 내 예약 */
  .booking-card{flex-wrap:wrap;gap:10px;padding:16px 18px;}
  .booking-name{font-size:16px;}
  .booking-meta{font-size:13px;}
  .btn-cancel{padding:11px 16px;font-size:13.5px;min-height:44px;}
  .modal-btns button{padding:15px;font-size:15.5px;min-height:50px;}
}
</style>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
let session = null;

function fmtDate(v) {
  if (!v) return '-';
  // ISO 형식이면 날짜만 추출
  const s = String(v);
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '년 ' + parseInt(m[2]) + '월 ' + parseInt(m[3]) + '일';
  return s;
}
function fmtTime(v) {
  if (!v) return '-';
  const s = String(v);
  // HH:MM 형식이면 그대로
  if (/^\d{2}:\d{2}$/.test(s)) return s;
  // ISO 형식이면 시간 추출 후 KST 변환
  const m = s.match(/T(\d{2}):(\d{2})/);
  if (m) {
    let h = parseInt(m[1]) + 9; // UTC→KST
    if (h >= 24) h -= 24;
    return String(h).padStart(2,'0') + ':' + m[2];
  }
  return s;
}
let clinics = [];
let currentClinic = null;
let calYear, calMonth;
let selectedDate = null;
let selectedTime = null;
let availableSlots = {}; // { date: [times] }
let slotCounts = {}; // { date_time: count }

// 요일별 스케줄 → 날짜별 슬롯 자동 생성 (8주치)
function generateWeeklySlots(schedule) {
  const slots = {};
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(today);
  end.setDate(end.getDate() + 8 * 7);

  for (let d = new Date(today); d <= end; d.setDate(d.getDate() + 1)) {
    const dow = d.getDay();
    const dayConf = schedule.days[String(dow)];
    if (!dayConf) continue;
    const dateStr = d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
    const times = [];
    const [sh, sm] = dayConf.start.split(':').map(Number);
    const [eh, em] = dayConf.end.split(':').map(Number);
    let cur = sh * 60 + sm;
    const endMin = eh * 60 + em;
    const interval = schedule.interval || 60;
    while (cur < endMin) {
      times.push(String(Math.floor(cur/60)).padStart(2,'0') + ':' + String(cur%60).padStart(2,'0'));
      cur += interval;
    }
    if (times.length) slots[dateStr] = times;
  }
  return slots;
}

window.addEventListener('DOMContentLoaded', function() {
  session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (session) {
    // 폰 학생은 만료 없음, 컴퓨터 학생은 30분, 교사는 60분
    var isMobile = window.mkIsMobile && window.mkIsMobile();
    var limit = 0;
    if (session.role === 'teacher') limit = 60*60*1000;
    else if (!isMobile) limit = 30*60*1000;
    if (limit) {
      var last = parseInt(localStorage.getItem('mkmath_last_active') || '0');
      if (last && Date.now() - last > limit) {
        localStorage.removeItem('mkmath_session');
        localStorage.removeItem('mkmath_last_active');
        session = null;
      } else {
        localStorage.setItem('mkmath_last_active', Date.now());
      }
    }
  }
  if (!session) {
    document.getElementById('page-denied').style.display = 'block';
    return;
  }
  document.getElementById('page-main').style.display = 'block';
  document.getElementById('topbar-user').textContent = session.name || session.id;
  if(session.role==='student'){var snav=document.getElementById('student-nav');if(snav){snav.style.display='flex';var mc=document.getElementById('snav-myclass');if(mc&&session.classId)mc.href='class.html?id='+session.classId;}}
  loadClinics();
});

function logout() {
  localStorage.removeItem('mkmath_session');
  location.href = 'homework.html';
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('tab-mine').style.display = tab === 'mine' ? 'block' : 'none';
  if (tab === 'mine') loadMyBookings();
}

async function loadClinics() {
  const area = document.getElementById('clinic-list');
  try {
    const res = await fetch(SU + '?action=getClinics');
    const data = await res.json();
    clinics = (data.clinics || []).filter(c => c.status !== 'deleted');
    if (!clinics.length) {
      area.innerHTML = '<div class="empty">현재 진행 중인 클리닉이 없습니다.</div>';
      return;
    }
    area.innerHTML = clinics.map(c => {
      let slots = {}; try { slots = JSON.parse(c.slots || '{}'); } catch(e) {}
      const dateCount = Object.keys(slots).length;
      return `<div class="clinic-card" onclick="openBookModal('${c.id}')">
        <div class="clinic-card-header">
          <div>
            <div class="clinic-card-name">${c.name}</div>
            <div class="clinic-card-loc">📍 ${c.location || '장소 미정'} &nbsp;·&nbsp; ${dateCount}개 날짜 &nbsp;·&nbsp; 최대 ${c.maxPeople}명/시간</div>
          </div>
          <span class="clinic-badge">신청가능</span>
        </div>
        ${c.desc ? `<div class="clinic-card-desc">${c.desc}</div>` : ''}
      </div>`;
    }).join('');
  } catch(e) {
    area.innerHTML = '<div class="empty">불러오기 실패. 다시 시도해주세요.</div>';
  }
}

async function loadMyBookings() {
  const area = document.getElementById('my-bookings');
  area.innerHTML = '<div class="spinner">불러오는 중...</div>';
  try {
    const res = await fetch(SU + '?action=getBookings&studentId=' + encodeURIComponent(session.id));
    const data = await res.json();
    // 취소된 항목 제외
    const bookings = (data.bookings || []).filter(b => b.status !== '취소' && b.status !== 'cancelled');
    if (!bookings.length) {
      area.innerHTML = '<div class="empty">예약한 클리닉이 없습니다.</div>';
      return;
    }
    area.innerHTML = bookings.map(b => `
      <div class="booking-card">
        <div class="booking-info">
          <div class="booking-name">${b.clinicName || '클리닉'}</div>
          <div class="booking-meta">📅 ${fmtDate(b.date)} &nbsp; ⏰ ${fmtTime(b.time)} &nbsp; <span style="color:#16a34a;font-weight:700;">예약완료</span></div>
        </div>
        <button class="btn-cancel" onclick="cancelBooking('${b.id}')">취소</button>
      </div>
    `).join('');
  } catch(e) {
    area.innerHTML = '<div class="empty">불러오기 실패.</div>';
  }
}

async function cancelBooking(bookingId) {
  if (!confirm('예약을 취소하시겠습니까?')) return;
  try {
    await fetch(SU + '?action=cancelBooking&bookId=' + encodeURIComponent(bookingId));
    loadMyBookings();
  } catch(e) {
    alert('취소 실패. 다시 시도해주세요.');
  }
}

// --- 예약 모달 ---
async function openBookModal(clinicId) {
  currentClinic = clinics.find(c => c.id === clinicId);
  if (!currentClinic) return;
  availableSlots = {};
  try {
    const parsed = JSON.parse(currentClinic.slots || '{}');
    if (parsed.weekly) {
      availableSlots = generateWeeklySlots(parsed);
    } else {
      availableSlots = parsed;
    }
  } catch(e) {}
  slotCounts = {};
  selectedDate = null;
  selectedTime = null;

  document.getElementById('bm-title').textContent = currentClinic.name;
  document.getElementById('bm-sub').textContent = '📍 ' + (currentClinic.location || '') + (currentClinic.desc ? ' · ' + currentClinic.desc : '');
  document.getElementById('step-time').style.display = 'none';
  document.getElementById('btn-confirm').style.display = 'none';

  // 달력 초기 월 = 가장 빠른 날짜
  const dates = Object.keys(availableSlots).sort();
  if (dates.length) {
    const first = new Date(dates[0]);
    calYear = first.getFullYear();
    calMonth = first.getMonth();
  } else {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
  }

  renderCal();
  document.getElementById('book-modal').classList.add('show');

  // 예약 인원 백그라운드 로드
  fetch(SU + '?action=getSlotCount&clinicId=' + encodeURIComponent(clinicId))
    .then(r => r.json())
    .then(data => { slotCounts = data.counts || {}; if (selectedDate) renderTimes(); })
    .catch(() => {});
}

function closeBookModal() {
  document.getElementById('book-modal').classList.remove('show');
}

function calMove(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCal();
}

function renderCal() {
  const label = calYear + '년 ' + (calMonth + 1) + '월';
  document.getElementById('cal-label').textContent = label;

  const first = new Date(calYear, calMonth, 1).getDay();
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="cal-day empty-day"></div>';
  for (let d = 1; d <= days; d++) {
    const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const dt = new Date(calYear, calMonth, d);
    const isAvail = !!availableSlots[dateStr];
    const isPast = dt < today;
    let cls = 'cal-day';
    if (!isAvail || isPast) cls += ' disabled';
    if (dateStr === selectedDate) cls += ' selected';
    const click = (!isAvail || isPast) ? '' : `onclick="selectDate('${dateStr}')"`;
    html += `<div class="${cls}" ${click}>${d}</div>`;
  }
  const grid = document.getElementById('cal-days');
  // 요일 헤더(첫 7개 자식) 유지하고 날짜만 교체
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);
  grid.insertAdjacentHTML('beforeend', html);
}

function selectDate(dateStr) {
  selectedDate = dateStr;
  selectedTime = null;
  document.getElementById('btn-confirm').style.display = 'none';
  renderCal();
  renderTimes();
  document.getElementById('step-time').style.display = 'block';
  const [y,m,d] = dateStr.split('-');
  document.getElementById('sel-date-label').textContent = y+'년 '+parseInt(m)+'월 '+parseInt(d)+'일';
}

function renderTimes() {
  const times = availableSlots[selectedDate] || [];
  const max = parseInt(currentClinic.maxPeople) || 10;
  document.getElementById('time-grid').innerHTML = times.map(t => {
    const key = selectedDate + '_' + t;
    const count = slotCounts[key] || 0;
    const isFull = count >= max;
    const isSel = t === selectedTime;
    let cls = 'time-btn' + (isFull ? ' full' : '') + (isSel ? ' selected' : '');
    const click = isFull ? '' : `onclick="selectTime('${t}')"`;
    return `<div class="${cls}" ${click}>${t}<span class="time-count">${isFull ? '마감' : count+'/'+max+'명'}</span></div>`;
  }).join('');
}

function selectTime(t) {
  selectedTime = t;
  renderTimes();
  document.getElementById('btn-confirm').style.display = 'block';
}

async function confirmBooking() {
  if (!selectedDate || !selectedTime) return;
  const btn = document.getElementById('btn-confirm');
  btn.disabled = true; btn.textContent = '예약 중...';
  try {
    const params = new URLSearchParams({
      action: 'bookClinic',
      clinicId: currentClinic.id,
      clinicName: currentClinic.name,
      studentId: session.id,
      studentName: session.name || session.id,
      date: selectedDate,
      time: selectedTime
    });
    const res = await fetch(SU + '?' + params.toString());
    const data = await res.json();
    if (data.success) {
      closeBookModal();
      alert('예약이 완료되었습니다!\n' + selectedDate + ' ' + selectedTime);
      switchTab('mine', document.querySelectorAll('.tab')[1]);
    } else {
      alert(data.message || '예약 실패. 다시 시도해주세요.');
    }
  } catch(e) {
    alert('오류가 발생했습니다.');
  }
  btn.disabled = false; btn.textContent = '예약 확정';
}
</script>
