<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청첩장 모임 일정 정하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#f6f4f1; --card:#fff; --ink:#1f2328; --sub:#6b7280; --line:#e7e2dc;
    --accent:#c2185b; --accent-soft:#fce4ec;
    --east:#2563eb; --east-soft:#dbeafe; --west:#ea580c; --west-soft:#ffedd5;
    --any:#64748b; --any-soft:#e2e8f0; --ok:#15803d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden}
  body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px;display:flex;flex-direction:column;gap:18px}
  header h1{margin:0;font-size:26px;letter-spacing:-.5px}
  header p{margin:6px 0 0;color:var(--sub);white-space:pre-line}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .hint{margin:0 0 14px;color:var(--sub);font-size:13px}
  label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  input[type=text],input[type=date],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:60px}
  .dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .dchip{min-height:52px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;color:var(--ink)}
  .dchip b{font-size:16px}
  .dchip small{color:var(--sub);font-size:12px}
  .dchip.on{border-color:var(--accent);background:var(--accent-soft)}
  .dchip.on small{color:var(--accent)}
  .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .abtn{min-height:56px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  .abtn small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
  .abtn.on.east{border-color:var(--east);background:var(--east-soft);color:var(--east)}
  .abtn.on.west{border-color:var(--west);background:var(--west-soft);color:var(--west)}
  .abtn.on.any{border-color:var(--any);background:var(--any-soft)}
  .primary{width:100%;margin-top:18px;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .primary:disabled{opacity:.5;cursor:default}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:38px;color:var(--ink)}
  .msg{margin-top:10px;font-size:14px;min-height:20px}
  .msg.ok{color:var(--ok)} .msg.err{color:#b91c1c}
  .best{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:15px}
  .best b{color:var(--accent)}
  .rows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center}
  .row .d{font-weight:600;font-size:14px}
  .row .d small{display:block;color:var(--sub);font-weight:400;font-size:12px}
  .bar{height:22px;background:#f1eeea;border-radius:6px;overflow:hidden;display:flex}
  .bar span{display:block;height:100%}
  .bar .e{background:var(--east)} .bar .w{background:var(--west)} .bar .a{background:var(--any)}
  .row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .row.top .d{color:var(--accent)}
  .who{grid-column:2 / 4;font-size:12px;color:var(--sub);margin-top:-6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .area-total{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .area-total div{border-radius:10px;padding:10px;text-align:center}
  .area-total b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--sub);font-weight:600}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .tag.east{background:var(--east-soft);color:var(--east)} .tag.west{background:var(--west-soft);color:var(--west)} .tag.any{background:var(--any-soft);color:var(--any)}
  .scroll{overflow-x:auto}
  .admin{border:2px dashed var(--accent)}
  .admin-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .admin-dates span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 6px 6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px}
  .admin-dates button{border:0;background:transparent;color:var(--accent);font-size:16px;cursor:pointer;min-width:28px;min-height:28px}
  .inline{display:flex;gap:8px}
  .inline input{flex:1;min-width:0}
  .empty{color:var(--sub);text-align:center;padding:20px 0}
  .del{border:0;background:none;color:#b91c1c;cursor:pointer;font-size:13px;padding:4px}
  @media (max-width:768px){
    .wrap{padding-top:20px}
    header h1{font-size:22px}
    .card{padding:16px}
    .dates{grid-template-columns:repeat(2,1fr)}
    .row{grid-template-columns:78px 1fr 36px;gap:8px}
    .abtn{font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">청첩장 모임 일정 정하기</h1>
    <p id="desc">되는 날짜를 모두 고르고, 모이기 편한 쪽(동쪽/서쪽)을 골라주세요.</p>
  </header>

  <!-- 주최자(선생님) 전용 -->
  <section class="card admin" id="admin-card" hidden>
    <h2>⚙ 주최자 설정</h2>
    <p class="hint">선생님 계정으로 로그인돼 있어서 보이는 칸이에요. 강사들에게는 안 보여요.</p>
    <label class="f" for="cfg-title">모임 이름</label>
    <input type="text" id="cfg-title" maxlength="40" placeholder="예: 민관 청첩장 모임">
    <label class="f" for="cfg-desc">안내 문구</label>
    <textarea id="cfg-desc" maxlength="300" placeholder="예: 저녁 7시, 식사는 제가 삽니다!"></textarea>
    <label class="f" for="cfg-date">후보 날짜 추가</label>
    <div class="inline">
      <input type="date" id="cfg-date">
      <button class="ghost" id="cfg-add" type="button">+ 추가</button>
    </div>
    <div class="admin-dates" id="cfg-dates"></div>
    <button class="primary" id="cfg-save" type="button">설정 저장</button>
    <div class="msg" id="cfg-msg"></div>
  </section>

  <!-- 응답 -->
  <section class="card" id="form-card">
    <h2>내 응답</h2>
    <p class="hint" id="form-hint">한 번 낸 뒤에도 이 기기에서 다시 들어오면 고칠 수 있어요.</p>
    <label class="f" for="f-name">이름</label>
    <input type="text" id="f-name" maxlength="20" placeholder="이름을 적어주세요">
    <label class="f">되는 날짜 (여러 개 선택)</label>
    <div class="dates" id="f-dates"><div class="empty">날짜를 불러오는 중…</div></div>
    <label class="f">모이기 편한 곳</label>
    <div class="areas">
      <button type="button" class="abtn east" data-area="east">동쪽<small>강동·송파 쪽</small></button>
      <button type="button" class="abtn west" data-area="west">서쪽<small>마포·강서 쪽</small></button>
      <button type="button" class="abtn any" data-area="any">상관없음<small>어디든 OK</small></button>
    </div>
    <label class="f" for="f-memo">하고 싶은 말 (선택)</label>
    <input type="text" id="f-memo" maxlength="80" placeholder="예: 8시 이후만 가능해요">
    <button class="primary" id="f-submit" type="button">응답 보내기</button>
    <div class="msg" id="f-msg"></div>
  </section>

  <!-- 결과 -->
  <section class="card">
    <h2>지금까지 결과</h2>
    <p class="hint" id="res-count">응답을 불러오는 중…</p>
    <div class="best" id="best" hidden></div>
    <div class="rows" id="rows"></div>
    <div class="legend">
      <span><i style="background:var(--east)"></i>동쪽 선호</span>
      <span><i style="background:var(--west)"></i>서쪽 선호</span>
      <span><i style="background:var(--any)"></i>상관없음</span>
    </div>
    <label class="f">장소 선호 (전체)</label>
    <div class="area-total" id="area-total"></div>
    <label class="f">응답한 사람</label>
    <div class="scroll"><table><thead><tr><th>이름</th><th>장소</th><th>되는 날</th><th>메모</th><th id="th-del" hidden></th></tr></thead><tbody id="people"></tbody></table></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCJR-nKFY9qNxMma-dj_7x3FB1BwEDzkRY",
  authDomain:"mkmath-54f5d.firebaseapp.com",
  projectId:"mkmath-54f5d",
  storageBucket:"mkmath-54f5d.firebasestorage.app",
  messagingSenderId:"238083527582",
  appId:"1:238083527582:web:bdcc88f52ccaae85563c8f"
});
var db = firebase.firestore();
var CFG = db.collection('meetup_config').doc('main');
var RES = db.collection('meetup_responses');
var AREA = {east:'동쪽', west:'서쪽', any:'상관없음'};
var WD = ['일','월','화','수','목','금','토'];

var config = {title:'', desc:'', dates:[]};
var responses = [];
var isTeacher = false;
var myId = null;
var picked = {dates:{}, area:''};
var adminDates = [];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(d){ var p=d.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]); return {md:(+p[1])+'/'+(+p[2]), wd:WD[dt.getDay()]}; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

myId = store('mkmeetup_id');
if(!myId){ myId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); store('mkmeetup_id', myId); }

/* ---------- 응답 폼 ---------- */
function renderForm(){
  var box = $('f-dates');
  var ds = (config.dates||[]).slice().sort();
  if(!ds.length){ box.innerHTML = '<div class="empty" style="grid-column:1/-1">아직 후보 날짜가 정해지지 않았어요.</div>'; return; }
  box.innerHTML = ds.map(function(d){
    var f = fmt(d);
    return '<button type="button" class="dchip'+(picked.dates[d]?' on':'')+'" data-d="'+d+'"><b>'+f.md+' ('+f.wd+')</b><small>'+(picked.dates[d]?'✓ 가능':'눌러서 선택')+'</small></button>';
  }).join('');
  document.querySelectorAll('.abtn').forEach(function(b){ b.classList.toggle('on', b.dataset.area===picked.area); });
}
$('f-dates').addEventListener('click', function(e){
  var b = e.target.closest('.dchip'); if(!b) return;
  var d = b.dataset.d; if(picked.dates[d]) delete picked.dates[d]; else picked.dates[d]=true;
  renderForm();
});
document.querySelectorAll('.abtn').forEach(function(b){
  b.addEventListener('click', function(){ picked.area = b.dataset.area; renderForm(); });
});
$('f-submit').addEventListener('click', function(){
  var name = $('f-name').value.trim();
  var dates = Object.keys(picked.dates).filter(function(d){ return (config.dates||[]).indexOf(d)>=0; }).sort();
  var msg = $('f-msg'); msg.className='msg';
  if(!name){ msg.className='msg err'; msg.textContent='이름을 적어주세요.'; return; }
  if(!picked.area){ msg.className='msg err'; msg.textContent='동쪽/서쪽/상관없음 중 하나를 골라주세요.'; return; }
  $('f-submit').disabled = true;
  RES.doc(myId).set({
    name:name, dates:dates, area:picked.area,
    memo:$('f-memo').value.trim().slice(0,80),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    msg.className='msg ok';
    msg.textContent = dates.length ? '✅ 저장됐어요! ('+dates.length+'일 가능)' : '✅ 저장됐어요. (가능한 날짜 없음으로 저장)';
    $('f-submit').textContent = '응답 고치기';
  }).catch(function(err){
    msg.className='msg err'; msg.textContent='저장이 안 됐어요. 잠시 후 다시 눌러주세요. ('+(err.code||err.message)+')';
  }).finally(function(){ $('f-submit').disabled = false; });
});

/* ---------- 결과 ---------- */
function renderResults(){
  var ds = (config.dates||[]).slice().sort();
  $('res-count').textContent = responses.length ? responses.length+'명이 응답했어요.' : '아직 응답한 사람이 없어요.';
  var max = Math.max(1, responses.length);
  var stats = ds.map(function(d){
    var ppl = responses.filter(function(r){ return (r.dates||[]).indexOf(d)>=0; });
    var c = {east:0,west:0,any:0}; ppl.forEach(function(r){ if(c[r.area]!=null) c[r.area]++; });
    return {d:d, ppl:ppl, c:c, n:ppl.length};
  });
  var topN = stats.reduce(function(m,s){ return Math.max(m,s.n); },0);
  $('rows').innerHTML = stats.length ? stats.map(function(s){
    var f = fmt(s.d);
    var w = function(k){ return (s.c[k]/max*100)+'%'; };
    return '<div class="row'+(topN>0&&s.n===topN?' top':'')+'"><div class="d">'+f.md+'<small>'+f.wd+'요일</small></div>'
      +'<div class="bar"><span class="e" style="width:'+w('east')+'"></span><span class="w" style="width:'+w('west')+'"></span><span class="a" style="width:'+w('any')+'"></span></div>'
      +'<div class="n">'+s.n+'</div>'
      +(s.ppl.length?'<div class="who">'+s.ppl.map(function(r){return esc(r.name);}).join(', ')+'</div>':'')
      +'</div>';
  }).join('') : '<div class="empty">후보 날짜가 없어요.</div>';

  var best = $('best');
  if(topN>0){
    var tops = stats.filter(function(s){ return s.n===topN; });
    var parts = tops.map(function(s){
      var f=fmt(s.d), e=s.c.east, w=s.c.west, side = e>w?'동쪽':(w>e?'서쪽':'동·서 반반');
      return '<b>'+f.md+'('+f.wd+')</b> '+s.n+'명 — 동쪽 '+e+' · 서쪽 '+w+' · 상관없음 '+s.c.any+' → 장소는 <b>'+side+'</b> 추천';
    });
    best.innerHTML = '🏆 가장 많이 되는 날<br>'+parts.join('<br>');
    best.hidden = false;
  } else best.hidden = true;

  var tot = {east:0,west:0,any:0}; responses.forEach(function(r){ if(tot[r.area]!=null) tot[r.area]++; });
  $('area-total').innerHTML =
    '<div style="background:var(--east-soft);color:var(--east)"><b>'+tot.east+'</b>동쪽</div>'+
    '<div style="background:var(--west-soft);color:var(--west)"><b>'+tot.west+'</b>서쪽</div>'+
    '<div style="background:var(--any-soft);color:var(--any)"><b>'+tot.any+'</b>상관없음</div>';

  $('th-del').hidden = !isTeacher;
  $('people').innerHTML = responses.length ? responses.map(function(r){
    var dl = (r.dates||[]).filter(function(d){return ds.indexOf(d)>=0;}).sort().map(function(d){ var f=fmt(d); return f.md+'('+f.wd+')'; }).join(', ') || '없음';
    return '<tr><td><b>'+esc(r.name)+'</b>'+(r.id===myId?' <small style="color:var(--accent)">(나)</small>':'')+'</td>'
      +'<td><span class="tag '+esc(r.area)+'">'+(AREA[r.area]||'-')+'</span></td><td>'+dl+'</td><td>'+esc(r.memo)+'</td>'
      +(isTeacher?'<td><button class="del" data-del="'+esc(r.id)+'">삭제</button></td>':'')+'</tr>';
  }).join('') : '<tr><td colspan="5" class="empty">아직 응답이 없어요.</td></tr>';
}
$('people').addEventListener('click', function(e){
  var b = e.target.closest('[data-del]'); if(!b) return;
  if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='정말 삭제?'; return; }
  RES.doc(b.dataset.del).delete();
});

/* ---------- 주최자 설정 ---------- */
function renderAdmin(){
  $('cfg-dates').innerHTML = adminDates.length ? adminDates.slice().sort().map(function(d){
    var f=fmt(d); return '<span>'+f.md+' ('+f.wd+')<button type="button" data-rm="'+d+'" aria-label="삭제">×</button></span>';
  }).join('') : '<span style="background:none;color:var(--sub);padding:0">아직 추가한 날짜가 없어요.</span>';
}
$('cfg-add').addEventListener('click', function(){
  var v = $('cfg-date').value; if(!v) return;
  if(adminDates.indexOf(v)<0) adminDates.push(v);
  $('cfg-date').value=''; renderAdmin();
});
$('cfg-dates').addEventListener('click', function(e){
  var b = e.target.closest('[data-rm]'); if(!b) return;
  adminDates = adminDates.filter(function(d){ return d!==b.dataset.rm; }); renderAdmin();
});
$('cfg-save').addEventListener('click', function(){
  var m=$('cfg-msg'); m.className='msg';
  CFG.set({ title:$('cfg-title').value.trim(), desc:$('cfg-desc').value.trim(), dates:adminDates.slice().sort(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
  .then(function(){ m.className='msg ok'; m.textContent='✅ 저장됐어요. 강사들 화면에도 바로 반영돼요.'; })
  .catch(function(err){ m.className='msg err'; m.textContent='저장 실패: '+(err.code||err.message); });
});

/* ---------- 실시간 구독 ---------- */
var adminLoaded = false;
CFG.onSnapshot(function(snap){
  config = snap.exists ? snap.data() : {title:'',desc:'',dates:[]};
  $('title').textContent = config.title || '청첩장 모임 일정 정하기';
  document.title = config.title || '청첩장 모임 일정 정하기';
  $('desc').textContent = config.desc || '되는 날짜를 모두 고르고, 모이기 편한 쪽(동쪽/서쪽)을 골라주세요.';
  if(!adminLoaded){ adminLoaded=true; $('cfg-title').value=config.title||''; $('cfg-desc').value=config.desc||''; adminDates=(config.dates||[]).slice(); renderAdmin(); }
  renderForm(); renderResults();
}, function(err){ $('f-dates').innerHTML='<div class="empty" style="grid-column:1/-1">불러오지 못했어요. ('+(err.code||'')+')</div>'; });

var mineLoaded = false;
RES.onSnapshot(function(qs){
  responses = qs.docs.map(function(d){ var o=d.data(); o.id=d.id; return o; })
    .sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ko'); });
  if(!mineLoaded){
    mineLoaded = true;
    var me = responses.filter(function(r){return r.id===myId;})[0];
    if(me){
      $('f-name').value = me.name||''; $('f-memo').value = me.memo||'';
      picked.area = me.area||''; picked.dates={}; (me.dates||[]).forEach(function(d){picked.dates[d]=true;});
      $('f-submit').textContent='응답 고치기';
    }
  }
  renderForm(); renderResults();
}, function(err){ $('res-count').textContent='결과를 불러오지 못했어요. ('+(err.code||'')+')'; });

firebase.auth().onAuthStateChanged(function(u){
  isTeacher = !!(u && u.email==='mingwan0309@mkmath.local');
  $('admin-card').hidden = !isTeacher;
  renderResults();
});
</script>
</body>
</html>
