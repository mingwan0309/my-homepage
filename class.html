<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반 정보 — 김민관 수학</title>
<style>
  :root { --primary:#3b6cf7; --bg:#f8fafc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--bg); min-height:100vh; }

  /* TOPBAR */
  .topbar { background:#1e293b; color:#fff; padding:0 24px; height:52px; display:flex; align-items:center; justify-content:space-between; }
  .topbar-logo { font-size:17px; font-weight:800; cursor:pointer; }
  .topbar-logo span { color:#3b6cf7; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .topbar-user { font-size:13px; color:#94a3b8; }
  .topbar-btn { background:#3b6cf7; color:#fff; border:none; padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600; }

  /* MAIN */
  .container { max-width:900px; margin:0 auto; padding:32px 20px; }

  .class-header { background:#fff; border-radius:16px; padding:28px 32px; margin-bottom:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); display:flex; align-items:center; gap:24px; }
  .class-badge { width:64px; height:64px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; color:#fff; flex-shrink:0; }
  .class-info h1 { font-size:22px; font-weight:800; color:#1e293b; margin-bottom:6px; }
  .class-meta { display:flex; gap:16px; flex-wrap:wrap; }
  .class-meta-item { display:flex; align-items:center; gap:6px; font-size:14px; color:#64748b; }
  .class-meta-item strong { color:#334155; font-weight:600; }
  .status-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; }
  .status-active { background:#dcfce7; color:#16a34a; }
  .status-past { background:#f1f5f9; color:#94a3b8; }

  .section-title { font-size:16px; font-weight:700; color:#1e293b; margin-bottom:14px; }

  .students-card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
  .student-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:16px; }
  .student-item { background:#f8fafc; border-radius:12px; padding:14px 16px; }
  .student-name { font-size:15px; font-weight:700; color:#1e293b; margin-bottom:4px; }
  .student-sub { font-size:13px; color:#64748b; }

  .empty-msg { text-align:center; padding:48px; color:#94a3b8; font-size:15px; }

  .back-btn { display:inline-flex; align-items:center; gap:6px; color:#3b6cf7; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:20px; text-decoration:none; }
  .back-btn:hover { text-decoration:underline; }

  .denied { text-align:center; padding:80px 20px; color:#64748b; font-size:16px; }
  .denied h2 { font-size:22px; color:#1e293b; margin-bottom:12px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo" onclick="location.href='index.html'">김민관 <span>수학</span></span>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="topbar-btn" id="topbar-logout" onclick="logout()" style="display:none;">로그아웃</button>
  </div>
</div>

<div class="container">
  <a class="back-btn" onclick="history.back()">← 돌아가기</a>

  <div id="denied-view" class="denied" style="display:none;">
    <h2>접근 권한이 없습니다</h2>
    <p>이 반에 소속된 학생 또는 선생님만 볼 수 있습니다.</p>
  </div>

  <div id="main-view" style="display:none;">
    <div class="class-header">
      <div class="class-badge" id="cls-badge"></div>
      <div class="class-info">
        <h1 id="cls-name"></h1>
        <div class="class-meta">
          <div class="class-meta-item">🕐 <strong id="cls-time"></strong></div>
          <div class="class-meta-item">📅 <span id="cls-period"></span></div>
          <div class="class-meta-item"><span class="status-badge" id="cls-status"></span></div>
        </div>
      </div>
    </div>

    <div class="students-card">
      <div class="section-title">📋 수강생 목록 (<span id="cls-count">0</span>명)</div>
      <div class="student-list" id="student-list">
        <div class="empty-msg">불러오는 중...</div>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';

const session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
const params = new URLSearchParams(location.search);
const classId = params.get('id');

function logout() {
  localStorage.removeItem('mkmath_session');
  location.href = 'index.html';
}

function badgeColor(name) {
  const colors = ['#3b6cf7','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#06b6d4'];
  var h = 0; for (var i = 0; i < name.length; i++) h += name.charCodeAt(i);
  return colors[h % colors.length];
}

function init() {
  if (!session) { location.href = 'homework.html'; return; }
  document.getElementById('topbar-user').textContent = (session.role === 'teacher' ? '👨‍🏫 ' : '🎓 ') + session.name;
  document.getElementById('topbar-logout').style.display = 'block';

  if (!classId) { document.getElementById('denied-view').style.display = 'block'; return; }
  loadClass();
}

async function loadClass() {
  try {
    const res = await fetch(SCRIPT_URL + '?action=getClassStudents&classId=' + encodeURIComponent(classId));
    const data = await res.json();

    if (!data.classInfo) {
      document.getElementById('denied-view').style.display = 'block';
      return;
    }

    // 학생이면 본인 반인지 확인
    if (session.role === 'student' && session.classId !== classId) {
      document.getElementById('denied-view').style.display = 'block';
      return;
    }

    document.getElementById('main-view').style.display = 'block';

    const cls = data.classInfo;
    const color = badgeColor(cls.name);
    document.getElementById('cls-badge').textContent = cls.name.substring(0, 2);
    document.getElementById('cls-badge').style.background = color;
    document.getElementById('cls-name').textContent = cls.name;
    document.getElementById('cls-time').textContent = cls.time || '미정';
    const period = [cls.start, cls.end].filter(Boolean).join(' ~ ') || '기간 미정';
    document.getElementById('cls-period').textContent = period;
    const statusEl = document.getElementById('cls-status');
    statusEl.textContent = cls.status === 'past' ? '종료' : '진행 중';
    statusEl.className = 'status-badge ' + (cls.status === 'past' ? 'status-past' : 'status-active');

    const students = data.students || [];
    document.getElementById('cls-count').textContent = students.length;
    const list = document.getElementById('student-list');

    if (!students.length) {
      list.innerHTML = '<div class="empty-msg">등록된 수강생이 없습니다</div>';
      return;
    }

    list.innerHTML = students.map(function(s) {
      return '<div class="student-item"><div class="student-name">🎓 ' + (s.name || s.id) + '</div>' +
             (s.school ? '<div class="student-sub">' + s.school + '</div>' : '') + '</div>';
    }).join('');

  } catch(e) {
    document.getElementById('denied-view').style.display = 'block';
    document.getElementById('denied-view').innerHTML = '<h2>불러오기 실패</h2><p>잠시 후 다시 시도해주세요</p>';
  }
}

init();
</script>
</body>
</html>
