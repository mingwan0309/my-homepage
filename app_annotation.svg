  <rect x="16" y="216" width="306" height="55" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="16" cy="216" r="9" fill="#ef4444"/>
  <text x="16" y="220" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">4</text>
  <text x="28" y="232" font-size="9.5" font-weight="800" fill="#1e293b">📋 다음 시간까지의 과제</text>
