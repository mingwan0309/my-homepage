  <text x="28" y="83" font-size="9" font-weight="800" fill="#1e293b">명덕여고</text>
  <rect x="28" y="88" width="282" height="13" rx="6" fill="#f8fafc" stroke="#f4f6f9"/>
  <text x="34" y="97" font-size="7.5" fill="#334155" font-weight="600">24차시 · 2026-06-08</text>
  <rect x="288" y="90" width="18" height="9" rx="4.5" fill="#dcfce7"/>
  <text x="297" y="97" text-anchor="middle" font-size="6" fill="#16a34a" font-weight="700">출석</text>
  <rect x="28" y="104" width="282" height="13" rx="6" fill="#f8fafc" stroke="#f4f6f9"/>
  <text x="34" y="113" font-size="7.5" fill="#334155" font-weight="600">23차시 · 2026-06-05</text>
  <rect x="288" y="106" width="18" height="9" rx="4.5" fill="#dcfce7"/>
  <text x="297" y="113" text-anchor="middle" font-size="6" fill="#16a34a" font-weight="700">출석</text>
  <rect x="28" y="120" width="282" height="13" rx="6" fill="#f8fafc" stroke="#f4f6f9"/>
  <text x="34" y="129" font-size="7.5" fill="#334155" font-weight="600">22차시 · 2026-06-01</text>
  <rect x="288" y="122" width="18" height="9" rx="4.5" fill="#dcfce7"/>
  <text x="297" y="129" text-anchor="middle" font-size="6" fill="#16a34a" font-weight="700">출석</text>

  <!-- 2. 큰 버튼 2개 -->
  <rect x="16" y="140" width="306" height="34" rx="12" fill="none" stroke="#ef4444" stroke-width="2.5"/>
