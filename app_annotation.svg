<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 335" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect width="420" height="335" fill="#f8fafc"/>
  <!-- phone bg -->
  <rect x="6" y="6" width="326" height="323" rx="16" fill="#f1f5f9"/>

