  <text x="34" y="249" font-size="8" font-weight="800" fill="#1d4ed8">[9회차] 워크북 p.24~30</text>
  <text x="34" y="259" font-size="7.5" fill="#334155">다음 시간까지 꼭 풀어오세요!</text>

  <!-- 범례 -->
  <g font-size="8.5" fill="#334155">
    <text x="340" y="70">① 출결 확인</text>
    <text x="340" y="88">② 클리닉 예약 / 질의응답</text>
    <text x="340" y="106">③ 선생님과 1:1 채팅</text>
    <text x="340" y="124">④ 다음 과제 확인</text>
