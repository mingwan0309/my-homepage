<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>민관이교실</title>
<script src="firebase-api.js?v=67"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;}

/* 상단 HUD */
.hud-top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;pointer-events:none;z-index:5;}
.hud-top > *{pointer-events:auto;}
.hbtn{min-height:44px;padding:0 14px;border-radius:12px;border:none;background:rgba(15,23,42,.72);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(6px);text-decoration:none;}
.hbtn.icon{width:44px;padding:0;justify-content:center;font-size:18px;}
.study-box{margin-left:auto;background:rgba(15,23,42,.72);border-radius:12px;padding:6px 12px;text-align:right;backdrop-filter:blur(6px);min-height:44px;display:flex;flex-direction:column;justify-content:center;}
.study-box .l{font-size:11px;color:#cbd5e1;font-weight:600;}
.study-box .t{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}

/* 눈치 게이지 */
.gauge{position:fixed;top:calc(66px + env(safe-area-inset-top));left:12px;width:180px;background:rgba(15,23,42,.72);border-radius:12px;padding:8px 10px;z-index:5;backdrop-filter:blur(6px);pointer-events:none;}
.gauge .l{font-size:12px;font-weight:700;color:#e2e8f0;margin-bottom:5px;display:flex;justify-content:space-between;}
.gauge .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;}
.gauge .fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:width .2s;}

/* 말풍선 */
#bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);max-width:260px;background:#fff;color:#0f172a;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:800;line-height:1.4;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:6;pointer-events:none;opacity:0;transition:opacity .25s;}
#bubble.show{opacity:1;}
#bubble:after{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:10px solid transparent;border-bottom:0;border-top-color:#fff;}
#bubble.warn{background:#fee2e2;color:#991b1b;}
#bubble.warn:after{border-top-color:#fee2e2;}
#bubble .who{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;color:#64748b;margin-bottom:3px;}
#bubble .bf{width:22px;height:22px;border-radius:50%;background:url('classroom_face.png') 50% 40%/130% no-repeat #e2e8f0;display:inline-block;}
#bubble.edge:after{display:none;}

/* 조준점 / 안내 */
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(0,0,0,.25);z-index:4;pointer-events:none;}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.72);border-radius:12px;padding:8px 14px;font-size:13px;color:#e2e8f0;z-index:5;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px);}
#sit-btn{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:52px;padding:0 26px;border-radius:26px;border:none;background:#3b6cf7;color:#fff;font-size:16px;font-weight:800;box-shadow:0 8px 24px rgba(59,108,247,.5);z-index:6;display:none;cursor:pointer;}
#sit-btn.stand{background:#334155;box-shadow:0 8px 24px rgba(0,0,0,.4);}

/* 앉았을 때 큰 타이머 */
#seat-timer{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;display:none;}
#seat-timer .l{font-size:13px;color:#e2e8f0;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);}
#seat-timer .t{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6);}

/* 조이스틱 (폰) */
#joy{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);z-index:5;display:none;touch-action:none;}
#joy-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55);}

/* 입장 화면 */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:radial-gradient(circle at 50% 30%,#1e3a8a 0%,#0f172a 70%);padding:20px;}
.intro-card{width:100%;max-width:420px;text-align:center;}
.intro-face{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;background:url('메인화면사진.jpg') 50% 18%/190% no-repeat;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.intro-card h1{font-size:30px;font-weight:900;margin-bottom:8px;}
.intro-card p{font-size:15px;color:#cbd5e1;line-height:1.6;margin-bottom:6px;}
.intro-keys{margin:16px 0 20px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:13px;color:#e2e8f0;line-height:1.8;text-align:left;}
.intro-keys b{color:#fff;}
.name-row{margin:0 0 12px;text-align:left;}
.name-row label{display:block;font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:6px;}
#name-input{width:100%;min-height:50px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-weight:700;padding:0 14px;outline:none;}
#name-input:focus{border-color:#60a5fa;}
#name-input::placeholder{color:#94a3b8;font-weight:500;}
#name-err{font-size:12px;color:#fca5a5;margin-top:5px;min-height:14px;}

/* 공부 누적 TOP 10 */
#rank{position:fixed;right:12px;top:calc(66px + env(safe-area-inset-top));width:200px;background:rgba(15,23,42,.78);border-radius:12px;z-index:5;backdrop-filter:blur(6px);overflow:hidden;}
#rank-head{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:40px;padding:0 10px;border:none;background:transparent;color:#fff;font-size:13px;font-weight:800;cursor:pointer;}
#rank-head .tg{font-size:11px;color:#cbd5e1;}
#rank-list{padding:0 8px 8px;}
.rk{display:flex;align-items:center;gap:6px;padding:4px 4px;border-radius:7px;font-size:13px;}
.rk .n{width:20px;text-align:center;font-weight:800;color:#cbd5e1;flex-shrink:0;}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.rk .tm{font-variant-numeric:tabular-nums;color:#e2e8f0;font-weight:700;flex-shrink:0;}
.rk.me{background:rgba(59,108,247,.45);}
.rk.r1 .n{color:#facc15;} .rk.r2 .n{color:#e5e7eb;} .rk.r3 .n{color:#f59e0b;}
.rk-empty{font-size:12px;color:#94a3b8;padding:6px 4px;}
.rk-mine{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12);}
#rank.fold #rank-list{display:none;}
#enter-btn{width:100%;min-height:54px;border:none;border-radius:14px;background:#3b6cf7;color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(59,108,247,.45);}
#loading{font-size:13px;color:#94a3b8;margin-top:10px;}

/* 일시정지(포인터 잠금 해제) */
#paused{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);cursor:pointer;}
#paused div{background:rgba(15,23,42,.85);padding:14px 22px;border-radius:14px;font-size:15px;font-weight:700;}

@media (max-width:768px){
  .gauge{width:150px;}
  .study-box .t{font-size:15px;}
  #hint{font-size:12px;white-space:normal;width:calc(100% - 32px);text-align:center;bottom:calc(150px + env(safe-area-inset-bottom));}
  #sit-btn{left:auto;right:20px;transform:none;bottom:calc(40px + env(safe-area-inset-bottom));}
  #bubble{font-size:14px;max-width:220px;}
  .intro-card h1{font-size:26px;}
  #seat-timer .t{font-size:34px;}
  #rank{width:158px;}
  .rk{font-size:12px;padding:3px 2px;}
  #seat-timer{top:calc(126px + env(safe-area-inset-top));left:12px;transform:none;text-align:left;}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud-top">
  <a class="hbtn" href="mypage.html">← 나가기</a>
  <button class="hbtn icon" id="snd-btn" title="소리 켜기/끄기">🔊</button>
  <div class="study-box"><div class="l">오늘 공부한 시간</div><div class="t" id="today-t">00:00:00</div></div>
</div>
<div class="gauge"><div class="l"><span>👀 선생님 눈치</span><span id="gauge-pct">0%</span></div><div class="bar"><div class="fill" id="gauge-fill"></div></div></div>
<div id="rank"><button id="rank-head">🏆 공부 누적 TOP 10 <span class="tg" id="rank-tg">접기</span></button><div id="rank-list"><div class="rk-empty">불러오는 중...</div></div></div>
<div id="bubble"></div>
<div id="cross"></div>
<div id="hint"></div>
<button id="sit-btn">🪑 내 자리에 앉기</button>
<div id="seat-timer"><div class="l">📖 지금 집중한 시간</div><div class="t" id="seat-t">00:00</div></div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="paused"><div>화면을 누르면 다시 움직여요</div></div>

<div id="intro">
  <div class="intro-card">
    <div class="intro-face"></div>
    <h1>🏫 민관이교실</h1>
    <p>민관쌤이 교실 앞에서 감독하고 있어요.<br>교실을 둘러봐도 되지만, <b>너무 돌아다니면 혼나요!</b></p>
    <p>파랗게 빛나는 <b>내 자리</b>에 앉으면 공부 시간이 기록돼요.</p>
    <div class="intro-keys" id="intro-keys"></div>
    <div class="name-row">
      <label for="name-input">✏️ 이름을 적어주세요 (순위표에 나와요)</label>
      <input id="name-input" maxlength="12" placeholder="예) 김민관" autocomplete="off">
      <div id="name-err"></div>
    </div>
    <button id="enter-btn" disabled>불러오는 중...</button>
    <div id="loading"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
var IS_COARSE = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
var MOBILE = IS_TOUCH && IS_COARSE;

// ── 학생 이름 (말풍선용) ──
var session = null;
try { session = JSON.parse(localStorage.getItem('mkmath_session') || 'null'); } catch(e) {}
var myName = '';
try { myName = localStorage.getItem('mk_class_name') || ''; } catch(e) {}
if (!myName && session && session.name && session.role === 'student') myName = String(session.name).trim();
function callName(){
  var n = String(myName || '').trim();
  if (!n) return '';
  if (n.length === 3) n = n.slice(1);           // 김민관 → 민관
  var last = n.charCodeAt(n.length - 1);
  if (last >= 0xAC00 && last <= 0xD7A3) return n + (((last - 0xAC00) % 28) ? '아' : '야');
  return n;
}
var CALL = callName();
function withName(s){ return CALL ? s.replace('{N}', CALL + ', ') : s.replace('{N}', ''); }

document.getElementById('intro-keys').innerHTML = MOBILE
  ? '🕹 <b>왼쪽 아래 동그라미</b>를 밀어서 걸어요<br>👆 <b>화면을 끌어서</b> 둘러봐요<br>🪑 내 자리 근처에서 <b>앉기 버튼</b>을 눌러요'
  : '⌨️ <b>W A S D</b> (또는 방향키)로 걸어요 · <b>Shift</b> 빨리 걷기<br>🖱 <b>마우스</b>로 둘러봐요 (ESC로 마우스 풀기)<br>🪑 내 자리 근처에서 <b>E</b> 키로 앉기 / 일어서기';

// ── 소리 (음성) ──
var soundOn = true;
try { soundOn = localStorage.getItem('mk_class_sound') !== 'off'; } catch(e) {}
var sndBtn = document.getElementById('snd-btn');
function renderSnd(){ sndBtn.textContent = soundOn ? '🔊' : '🔇'; }
renderSnd();
sndBtn.onclick = function(e){
  e.stopPropagation();
  soundOn = !soundOn;
  try { localStorage.setItem('mk_class_sound', soundOn ? 'on' : 'off'); } catch(err) {}
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  renderSnd();
};
var koVoice = null;
function pickVoice(){
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices() || [];
  var ko = vs.filter(function(v){ return /ko/i.test(v.lang); });
  // 남자 목소리를 우선
  koVoice = ko.filter(function(v){ return /male|남|InJoon|Hyunsu|Bong/i.test(v.name) && !/female/i.test(v.name); })[0] || ko[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!soundOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/[^가-힣a-zA-Z0-9 ,.!?~]/g, ''));
    u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice;
    u.rate = 1.05; u.pitch = 0.85;
    speechSynthesis.speak(u);
  } catch(e) {}
}

// ── 공부 시간 기록 (이 기기에만 저장) ──
function todayKey(){ var d = new Date(); return 'mk_class_study_' + d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
var todaySec = 0;
try { todaySec = parseInt(localStorage.getItem(todayKey()) || '0', 10) || 0; } catch(e) {}
function fmt(sec, withHour){
  sec = Math.floor(sec);
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return withHour || h ? p(h) + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}

// ═══════════════ 3D 장면 ═══════════════
var canvas = document.getElementById('cv');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !MOBILE });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MOBILE ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe7f2);
scene.fog = new THREE.Fog(0xdfe7f2, 18, 40);
var camera = new THREE.PerspectiveCamera(70, 1, 0.05, 80);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffffff, 0xb59b7a, 0.85));
var sun = new THREE.DirectionalLight(0xfff4e0, 0.55); sun.position.set(-6, 8, 2); scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

// 교실 크기
var RX = 7, RZ_FRONT = -10, RZ_BACK = 10, RH = 3.4;

function canvasTex(w, h, draw){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return t;
}
function lam(color, extra){ var o = { color: color }; for (var k in extra) o[k] = extra[k]; return new THREE.MeshLambertMaterial(o); }
function box(w, h, d, mat, x, y, z, parent){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); (parent || scene).add(m); return m;
}

// 바닥 (나무 마루)
var floorTex = canvasTex(512, 512, function(g, w, h){
  var rows = 8;
  for (var i = 0; i < rows; i++) {
    var off = (i % 2) * 128;
    for (var j = -1; j < 3; j++) {
      var tone = 150 + Math.floor(Math.random() * 30);
      g.fillStyle = 'rgb(' + tone + ',' + Math.floor(tone * 0.72) + ',' + Math.floor(tone * 0.45) + ')';
      g.fillRect(j * 256 + off, i * (h / rows), 256, h / rows);
      g.strokeStyle = 'rgba(60,35,15,.35)'; g.lineWidth = 2;
      g.strokeRect(j * 256 + off, i * (h / rows), 256, h / rows);
    }
  }
  for (var k = 0; k < 220; k++) { g.fillStyle = 'rgba(90,55,25,' + (Math.random() * .08) + ')'; g.fillRect(Math.random() * w, Math.random() * h, 40 + Math.random() * 80, 1); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(5, 7);
var floor = new THREE.Mesh(new THREE.PlaneGeometry(RX * 2, RZ_BACK - RZ_FRONT), lam(0xffffff, { map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.position.z = (RZ_FRONT + RZ_BACK) / 2; scene.add(floor);

// 천장
var ceil = new THREE.Mesh(new THREE.PlaneGeometry(RX * 2, RZ_BACK - RZ_FRONT), lam(0xf4f4f0));
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, RH, 0); scene.add(ceil);
var lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
[-5, 0, 5].forEach(function(z){ [-3.2, 0, 3.2].forEach(function(x){ box(1.6, 0.04, 0.35, lightMat, x, RH - 0.03, z); }); });

// 벽
var wallMat = lam(0xf3efe6), wainMat = lam(0xb98d5f);
box(RX * 2, RH, 0.1, wallMat, 0, RH / 2, RZ_FRONT - 0.05);   // 앞
box(RX * 2, RH, 0.1, wallMat, 0, RH / 2, RZ_BACK + 0.05);    // 뒤
box(0.1, RH, RZ_BACK - RZ_FRONT, wallMat, -RX - 0.05, RH / 2, 0); // 왼쪽(창문)
box(0.1, RH, RZ_BACK - RZ_FRONT, wallMat, RX + 0.05, RH / 2, 0);  // 오른쪽(복도)
// 굽도리(나무 판)
box(RX * 2, 0.9, 0.04, wainMat, 0, 0.45, RZ_BACK - 0.02);
box(0.04, 0.9, RZ_BACK - RZ_FRONT, wainMat, RX - 0.02, 0.45, 0);
box(0.04, 0.9, RZ_BACK - RZ_FRONT, wainMat, -RX + 0.02, 0.45, 0);

// 창문 (왼쪽 벽)
var skyTex = canvasTex(256, 256, function(g, w, h){
  var gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#7ec3ff'); gr.addColorStop(1, '#e0f2ff');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.9)';
  [[60, 70, 30], [90, 60, 38], [125, 72, 28], [180, 140, 24], [205, 132, 30]].forEach(function(c){ g.beginPath(); g.arc(c[0], c[1], c[2], 0, Math.PI * 2); g.fill(); });
  g.fillStyle = '#5fae5a'; g.beginPath(); g.moveTo(0, h); g.quadraticCurveTo(70, 170, 140, 210); g.quadraticCurveTo(200, 180, 256, 200); g.lineTo(256, h); g.fill();
});
var skyMat = new THREE.MeshBasicMaterial({ map: skyTex }), frameMat = lam(0xffffff);
[-6.5, -2.2, 2.2, 6.5].forEach(function(z){
  var win = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.6), skyMat);
  win.rotation.y = Math.PI / 2; win.position.set(-RX + 0.01, 1.95, z); scene.add(win);
  box(0.06, 0.08, 3.3, frameMat, -RX + 0.03, 1.15, z); box(0.06, 0.08, 3.3, frameMat, -RX + 0.03, 2.75, z);
  box(0.06, 1.68, 0.08, frameMat, -RX + 0.03, 1.95, z - 1.62); box(0.06, 1.68, 0.08, frameMat, -RX + 0.03, 1.95, z + 1.62);
  box(0.06, 1.68, 0.06, frameMat, -RX + 0.03, 1.95, z);
});

// 칠판

var clockTex = new THREE.CanvasTexture(clockCanvas); clockTex.encoding = THREE.sRGBEncoding;
function drawClock(){
  var g = clockCanvas.getContext('2d'), d = new Date();
  g.clearRect(0, 0, 256, 256);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(128, 128, 120, 0, Math.PI * 2); g.fill();
  g.lineWidth = 10; g.strokeStyle = '#1e293b'; g.stroke();
  g.fillStyle = '#1e293b';
  for (var i = 0; i < 12; i++) { var a = i / 12 * Math.PI * 2; g.fillRect(128 + Math.sin(a) * 98 - 3, 128 - Math.cos(a) * 98 - 3, 6, 6); }
  function hand(a, len, wid, col){ g.strokeStyle = col; g.lineWidth = wid; g.lineCap = 'round'; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + Math.sin(a) * len, 128 - Math.cos(a) * len); g.stroke(); }
  var h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
  hand((h + m / 60) / 12 * Math.PI * 2, 55, 9, '#1e293b');
  hand((m + s / 60) / 60 * Math.PI * 2, 85, 6, '#1e293b');
  hand(s / 60 * Math.PI * 2, 92, 2, '#ef4444');
  clockTex.needsUpdate = true;
}

var noLock = MOBILE || !canvas.requestPointerLock, dragging = false;
function requestLock(){
  if (noLock) return;
  try {
    var r = canvas.requestPointerLock();
    if (r && r.catch) r.catch(function(){ noLock = true; pausedEl.style.display = 'none'; });
  } catch(e) { noLock = true; }
}
document.addEventListener('pointerlockchange', function(){
  locked = document.pointerLockElement === canvas;
  pausedEl.style.display = (!noLock && started && !locked) ? 'flex' : 'none';
});
document.addEventListener('pointerlockerror', function(){ noLock = true; pausedEl.style.display = 'none'; });
pausedEl.addEventListener('click', requestLock);
canvas.addEventListener('mousedown', function(){ if (!locked) dragging = true; });
window.addEventListener('mouseup', function(){ dragging = false; });
document.addEventListener('mousemove', function(e){
  if (locked) look(e.movementX * 0.0022, e.movementY * 0.0022);
  else if (dragging && !MOBILE) look(e.movementX * 0.005, e.movementY * 0.005);
});
function look(dx, dy){
  player.yaw -= dx;
  player.pitch -= dy;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
}

var joyId = null, joyV = { x: 0, y: 0 }, lookId = null, lookLast = null;
if (MOBILE) {
  joy.style.display = 'block';
  joy.addEventListener('touchstart', function(e){ e.preventDefault(); var t = e.changedTouches[0]; joyId = t.identifier; joyMove(t); }, { passive: false });
  canvas.addEventListener('touchstart', function(e){
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (lookId === null) { lookId = t.identifier; lookLast = { x: t.clientX, y: t.clientY }; }
    }
  }, { passive: true });
  window.addEventListener('touchmove', function(e){
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) joyMove(t);
      else if (t.identifier === lookId) {
        look((t.clientX - lookLast.x) * 0.0055, (t.clientY - lookLast.y) * 0.0055);
        lookLast = { x: t.clientX, y: t.clientY };
      }
    }
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  var endT = function(e){
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) { joyId = null; joyV.x = joyV.y = 0; knob.style.transform = ''; }
      if (t.identifier === lookId) { lookId = null; }
    }
  };
  window.addEventListener('touchend', endT); window.addEventListener('touchcancel', endT);
}
function joyMove(t){
  var r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var dx = t.clientX - cx, dy = t.clientY - cy, max = r.width / 2 - 10, d = Math.hypot(dx, dy);
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  joyV.x = dx / max; joyV.y = dy / max;
}

// ── 앉기 / 일어서기 ──
var sitBtn = document.getElementById('sit-btn'), hintEl = document.getElementById('hint');
var seatTimerEl = document.getElementById('seat-timer');
sitBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleSit(); });
function nearSeat(){ return Math.hypot(player.x - seat.x, player.z - seat.z) < 1.5; }
var sitAnim = 0;   // 0~1 카메라 높이 보간
function toggleSit(){
  if (player.seated) {
    player.seated = false;
    player.z = seat.z + 0.75;
    if (seatSec >= 60) say('벌써 일어나? ' + Math.floor(seatSec / 60) + '분 했네, 잘했어!', false);
    else say('어디 가? 금방 다시 앉자~', true);
    seatSec = 0;
  } else if (nearSeat()) {
    player.seated = true;
    player.x = seat.x; player.z = seat.z; player.yaw = 0; player.pitch = -0.12;
    wander = 0; warnCount = 0; idleTalkT = 50;
    if (T.mode === 'scold') { T.mode = 'pause'; T.wait = 1.2; }
    say(pick(LINES.sit), false);
  }
  updateSeatUI();
}
function updateSeatUI(){
  seatTimerEl.style.display = player.seated ? 'block' : 'none';
  ring.visible = arrow.visible = !player.seated;
  if (player.seated) { sitBtn.style.display = 'block'; sitBtn.className = 'stand'; sitBtn.textContent = '🚶 일어서기'; }
  else if (nearSeat()) { sitBtn.style.display = 'block'; sitBtn.className = ''; sitBtn.textContent = '🪑 내 자리에 앉기' + (MOBILE ? '' : ' (E)'); }
  else sitBtn.style.display = 'none';
  var h;
  if (player.seated) h = MOBILE ? '공부 중… 화면을 끌어서 둘러볼 수 있어요' : '공부 중… E 키를 누르면 일어서요';
  else h = MOBILE ? '🕹 왼쪽 아래로 걷고, 화면을 끌어서 둘러봐요 · 파란 자리가 내 자리!' : 'W A S D 로 걷기 · 마우스로 둘러보기 · 파란 자리가 내 자리!';
  if (hintEl.textContent !== h) hintEl.textContent = h;
}

// ── 충돌 ──
var PR = 0.28;
function collide(nx, nz){
  nx = Math.max(-RX + PR, Math.min(RX - PR, nx));
  nz = Math.max(RZ_FRONT + 0.5 + PR, Math.min(RZ_BACK - PR, nz));
  for (var i = 0; i < colliders.length; i++) {
    var c = colliders[i];
    if (nx > c.x1 - PR && nx < c.x2 + PR && nz > c.z1 - PR && nz < c.z2 + PR) {
      var pl = nx - (c.x1 - PR), pr = (c.x2 + PR) - nx, pf = nz - (c.z1 - PR), pb = (c.z2 + PR) - nz;
      var m = Math.min(pl, pr, pf, pb);
      if (m === pl) nx = c.x1 - PR; else if (m === pr) nx = c.x2 + PR; else if (m === pf) nz = c.z1 - PR; else nz = c.z2 + PR;
    }
  }
  // 선생님과 부딪힘
  var tx = teacher.position.x, tz = teacher.position.z, d = Math.hypot(nx - tx, nz - tz), rr = PR + 0.35;
  if (d < rr && d > 0.0001) { nx = tx + (nx - tx) / d * rr; nz = tz + (nz - tz) / d * rr; }
  return [nx, nz];
}

// ── 매 프레임 ──
var gaugeFill = document.getElementById('gauge-fill'), gaugePct = document.getElementById('gauge-pct');
var todayEl = document.getElementById('today-t'), seatEl = document.getElementById('seat-t');
var tmpV = new THREE.Vector3();
var prev = performance.now(), clockAcc = 0, nearCool = 0, bobT = 0;

function update(dt){
  // 플레이어 이동
  var moving = false;
  if (started && !player.seated) {
    var f = 0, s = 0;
    if (keys.KeyW || keys.ArrowUp) f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyA || keys.ArrowLeft) s -= 1;
    if (keys.KeyD || keys.ArrowRight) s += 1;
    if (joyId !== null) { f -= joyV.y; s += joyV.x; }
    var len = Math.hypot(f, s);
    if (len > 0.08) {
      if (len > 1) { f /= len; s /= len; }
      var sp = (keys.ShiftLeft || keys.ShiftRight) ? 3.6 : 2.2;
      var sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
      var dx = (-sinY * f + cosY * s) * sp * dt, dz = (-cosY * f - sinY * s) * sp * dt;
      var r = collide(player.x + dx, player.z + dz);
      var moved = Math.hypot(r[0] - player.x, r[1] - player.z);
      player.x = r[0]; player.z = r[1];
      if (moved > 0.0005) { moving = true; wander += moved; bobT += moved * 4.2; }
    }
  }
  // 눈치 게이지 (가만히 있으면 천천히 내려감)
  if (!moving && !player.seated) wander = Math.max(0, wander - dt * 0.35);
  var pct = Math.min(100, Math.round(wander / WARN_AT * 100));
  gaugeFill.style.width = pct + '%'; gaugePct.textContent = pct + '%';

  if (started && !player.seated && wander >= WARN_AT && T.mode !== 'scold') {
    T.mode = 'scold'; T.scoldT = 5;
    say(LINES.warn[Math.min(warnCount, LINES.warn.length - 1)], true, 4.5);
    warnCount++;
    wander = WARN_AT * 0.45;   // 다시 조금만 걸어도 또 혼남
  }

  // 선생님 가까이 가면 한마디
  nearCool -= dt;
  var distT = Math.hypot(player.x - teacher.position.x, player.z - teacher.position.z);
  if (started && !player.seated && distT < 1.4 && nearCool <= 0 && T.mode !== 'scold' && bubbleT <= 0) { say(pick(LINES.near), false); nearCool = 14; }

  // 앉아서 공부 시간
  if (player.seated) {
    seatSec += dt; todaySec += dt; pendingSec += dt;
    idleTalkT -= dt;
    if (idleTalkT <= 0) { say(pick(LINES.cheer), false); idleTalkT = 150 + Math.random() * 90; }
    if (todaySec - lastSaved > 5) { lastSaved = todaySec; try { localStorage.setItem(todayKey(), String(Math.floor(todaySec))); } catch(e) {} }
  }
  seatEl.textContent = fmt(seatSec);
  todayEl.textContent = fmt(todaySec, true);

  updateTeacher(dt, moving);
  updateSeatUI();

  // 카메라
  sitAnim += ((player.seated ? 1 : 0) - sitAnim) * Math.min(1, dt * 6);
  var eye = 1.6 - sitAnim * 0.42 + (moving ? Math.sin(bobT) * 0.03 : 0);
  camera.position.set(player.x, eye, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  // 내 자리 표시 깜빡임
  var tt = performance.now() / 1000;
  ring.material.opacity = 0.35 + Math.sin(tt * 3) * 0.2 + (T.mode === 'scold' ? 0.3 : 0);
  arrow.position.y = 1.5 + Math.sin(tt * 2.5) * 0.08; arrow.rotation.y = tt;
  arrowMat.color.setHex(T.mode === 'scold' ? 0xff4d4d : 0x3b9cff);

  // 말풍선
  if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0) bubble.className = ''; }
  nameSp.visible = bubbleT <= 0;   // 말풍선이 뜨면 이름표는 숨김(겹침 방지)
  placeBubble();

  clockAcc += dt; if (clockAcc > 1) { clockAcc = 0; drawClock(); }
}

function angDiff(a, b){ var d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

function updateTeacher(dt){
  var p = teacher.position, walking = false;
  var toPlayerYaw = Math.atan2(player.x - p.x, player.z - p.z);
  var bodyYawTarget = T.yaw;

  if (T.mode === 'scold') {
    // 멈춰 서서 학생 쪽을 보고 내 자리를 가리킴
    T.scoldT -= dt;
    bodyYawTarget = toPlayerYaw;
    var seatYaw = Math.atan2(seat.x - p.x, seat.z - p.z);
    var pointSide = angDiff(seatYaw, T.yaw) > 0 ? armL : armR;
    var other = pointSide === armL ? armR : armL;
    pointSide.rotation.x += (-1.45 - pointSide.rotation.x) * Math.min(1, dt * 8);
    other.rotation.x += (0 - other.rotation.x) * Math.min(1, dt * 8);
    if (T.scoldT <= 0) { T.mode = 'pause'; T.wait = 1; }
  } else {
    if (T.wait > 0) {
      T.wait -= dt;
      bodyYawTarget = toPlayerYaw;
      if (T.wait <= 0) {
        if (T.mode === 'aisle') {
          T.aisleLeg++;
          if (T.aisleLeg === 1) { T.target.set(0, 0, 7.6); }
          else if (T.aisleLeg === 2) { T.target.set(0, 0, RZ_FRONT + 1.4); }
          else { T.mode = 'patrol'; pickPatrol(); }
        } else {
          T.mode = 'patrol';
          T.nextAisle -= 1;
          if (T.nextAisle <= 0 && !player.seated) { T.nextAisle = 6; }
          if (T.nextAisle <= 0 || Math.random() < 0.18) {
            // 가끔 가운데 통로로 순찰
            T.mode = 'aisle'; T.aisleLeg = 0; T.target.set(0, 0, RZ_FRONT + 2.0); T.nextAisle = 6 + Math.floor(Math.random() * 4);
          } else pickPatrol();
        }
      }
    } else {
      var dx = T.target.x - p.x, dz = T.target.z - p.z, d = Math.hypot(dx, dz);
      if (d < 0.08) { T.wait = T.mode === 'aisle' ? 1.6 : 1.5 + Math.random() * 3; }
      else {
        // 길에 플레이어가 있으면 기다림
        var nx = p.x + dx / d * T.speed * dt, nz = p.z + dz / d * T.speed * dt;
        if (Math.hypot(nx - player.x, nz - player.z) > 0.75) { p.x = nx; p.z = nz; walking = true; }
        bodyYawTarget = Math.atan2(dx, dz);
      }
    }
  }
  p.y += (onStage(p.z) - p.y) * Math.min(1, dt * 8);
  T.yaw += angDiff(bodyYawTarget, T.yaw) * Math.min(1, dt * 5);
  teacher.rotation.y = T.yaw;

  // 머리는 항상 학생을 감시 (목이 돌아가는 범위 안에서)
  var headYaw = Math.max(-1.2, Math.min(1.2, angDiff(toPlayerYaw, T.yaw)));
  head.rotation.y += (headYaw - head.rotation.y) * Math.min(1, dt * 6);
  tmpV.set(0, 0, 0); head.getWorldPosition(tmpV);
  var pitch = Math.atan2(tmpV.y - camera.position.y, Math.hypot(player.x - tmpV.x, player.z - tmpV.z));
  head.rotation.x += (Math.max(-0.4, Math.min(0.4, pitch)) - head.rotation.x) * Math.min(1, dt * 6);

  // 걷기 애니메이션
  if (walking) T.walkPhase += dt * 7; else T.walkPhase *= 0.85;
  var sw = Math.sin(T.walkPhase) * (walking ? 0.5 : 0);
  legL.rotation.x = sw; legR.rotation.x = -sw;
  if (T.mode !== 'scold') {
    armL.rotation.x += (-sw * 0.7 - armL.rotation.x) * Math.min(1, dt * 8);
    armR.rotation.x += (sw * 0.7 - armR.rotation.x) * Math.min(1, dt * 8);
  }
  torso.position.y = 0.92 + (walking ? Math.abs(Math.cos(T.walkPhase)) * 0.025 : Math.sin(performance.now() / 700) * 0.006);
  shadow.position.x = p.x; shadow.position.z = p.z; shadow.position.y = p.y + 0.013;
}

// 말풍선 위치: 선생님 머리 위로 (화면 밖이면 화면 가장자리)
function placeBubble(){
  if (!bubble.className) return;
  tmpV.set(0, 0, 0); head.getWorldPosition(tmpV); tmpV.y += 0.36;
  var v = tmpV.clone().project(camera);
  var W = window.innerWidth, H = window.innerHeight;
  var behind = v.z > 1;
  var x = (v.x * 0.5 + 0.5) * W, y = (-v.y * 0.5 + 0.5) * H;
  if (behind) { x = W - x; y = H * 0.3; }
  var bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  var edge = behind || x < bw / 2 + 10 || x > W - bw / 2 - 10 || y < bh + 80 || y > H - 20;
  x = Math.max(bw / 2 + 10, Math.min(W - bw / 2 - 10, x));
  var minY = bh + 120;
  if (W <= 768 && !rankFold) minY = Math.max(minY, rankEl.getBoundingClientRect().bottom + bh + 14);   // 폰: 순위표와 안 겹치게
  y = Math.max(minY, Math.min(H - 170, y));
  bubble.style.left = x + 'px'; bubble.style.top = y + 'px';
  bubble.classList.toggle('edge', edge);
}

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 80 : 70;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

function loop(now){
  var dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ═══════════════ 공부 누적 순위 (Firestore classroom_study) ═══════════════
// 문서 하나 = 이름 하나 { name, totalSec, updatedAt(서버시각) }.
// 규칙이 "지난 저장 이후 실제로 흐른 시간만큼만" 늘릴 수 있게 막아둠 → 30초마다 쌓인 만큼만 저장.
var rankEl = document.getElementById('rank'), rankList = document.getElementById('rank-list');
var rankTop = [], rankMine = null, rankErr = '';
var pendingSec = 0, flushing = false;
function nameKey(n){ return 'n_' + String(n).replace(/[\/.#\[\]\s]/g, '_'); }
function getDb(){
  return new Promise(function(res){
    (function wait(){
      if (window.firebase && firebase.apps && firebase.apps.length && firebase.firestore) res(firebase.firestore());
      else setTimeout(wait, 200);
    })();
  });
}
function fmtRank(sec){
  sec = Math.floor(sec || 0);
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? h + '시간 ' + m + '분' : (m ? m + '분' : sec + '초');
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function rkRow(rank, name, sec, me){
  return '<div class="rk' + (me ? ' me' : '') + (rank <= 3 ? ' r' + rank : '') + '"><span class="n">' + (rank <= 3 ? ['🥇', '🥈', '🥉'][rank - 1] : rank) +
    '</span><span class="nm">' + esc(name) + '</span><span class="tm">' + fmtRank(sec) + '</span></div>';
}
function renderRank(){
  if (rankErr) { rankList.innerHTML = '<div class="rk-empty">' + esc(rankErr) + '</div>'; return; }
  var html = '', inTop = false;
  rankTop.forEach(function(r, i){
    var me = myName && r.name === myName; if (me) inTop = true;
    html += rkRow(i + 1, r.name, r.totalSec + (me ? pendingSec : 0), me);
  });
  if (!rankTop.length) html = '<div class="rk-empty">아직 기록이 없어요.<br>자리에 앉아서 1등 해보세요!</div>';
  if (myName && started && !inTop) {
    var mySec = (rankMine ? rankMine.totalSec : 0) + pendingSec;
    html += '<div class="rk-mine">' + rkRow(rankMine && rankMine.rank ? rankMine.rank : '-', myName + ' (나)', mySec, true) + '</div>';
  }
  rankList.innerHTML = html;
}
var rankFold = MOBILE && window.innerHeight < 700;
function renderFold(){ rankEl.classList.toggle('fold', rankFold); document.getElementById('rank-tg').textContent = rankFold ? '펼치기' : '접기'; }
renderFold();
document.getElementById('rank-head').addEventListener('click', function(e){ e.stopPropagation(); rankFold = !rankFold; renderFold(); });

getDb().then(function(db){
  db.collection('classroom_study').orderBy('totalSec', 'desc').limit(10).onSnapshot(function(snap){
    rankErr = '';
    rankTop = []; snap.forEach(function(d){ var v = d.data(); rankTop.push({ name: v.name, totalSec: v.totalSec || 0 }); });
    renderRank();
    refreshMine();
  }, function(err){
    console.warn('[민관이교실] 순위 불러오기 실패', err);
    rankErr = '순위를 불러오지 못했어요';
    renderRank();
  });
});
// 내가 10등 밖일 때 내 기록·등수
function refreshMine(){
  if (!myName) return;
  getDb().then(function(db){
    return db.collection('classroom_study').doc(nameKey(myName)).get().then(function(doc){
      if (!doc.exists) { rankMine = null; renderRank(); return; }
      var v = doc.data(); rankMine = { totalSec: v.totalSec || 0, rank: null };
      var q = db.collection('classroom_study').where('totalSec', '>', rankMine.totalSec);
      if (!q.count) { renderRank(); return; }
      return q.count().get().then(function(c){ rankMine.rank = c.data().count + 1; renderRank(); });
    });
  }).catch(function(e){ console.warn('[민관이교실] 내 기록 불러오기 실패', e); });
}
function flushStudy(){
  var add = Math.min(Math.floor(pendingSec), 60);   // 한 번에 최대 60초(규칙과 맞춤)
  if (!myName || add < 1 || flushing) return;
  flushing = true;
  getDb().then(function(db){
    var FV = firebase.firestore.FieldValue;
    return db.collection('classroom_study').doc(nameKey(myName)).set({
      name: myName, totalSec: FV.increment(add), updatedAt: FV.serverTimestamp()
    }, { merge: true }).then(function(){ pendingSec -= add; });
  }).catch(function(e){
    console.warn('[민관이교실] 공부 시간 저장 실패', e);
  }).then(function(){ flushing = false; refreshMine(); });
}
setInterval(function(){ if (pendingSec >= 30) flushStudy(); }, 5000);
setInterval(renderRank, 5000);

// 저장 (나갈 때)
function saveNow(){ try { localStorage.setItem(todayKey(), String(Math.floor(todaySec))); } catch(e) {} flushStudy(); }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', function(){ if (document.hidden) { saveNow(); keys = {}; } });

// ── 입장 ──
var faceReady = false;
var enterBtn = document.getElementById('enter-btn');
function checkReady(){ if (faceReady) { enterBtn.disabled = false; enterBtn.textContent = '교실 들어가기'; } }
setTimeout(function(){ faceReady = true; checkReady(); }, 5000);
var nameInput = document.getElementById('name-input'), nameErr = document.getElementById('name-err');
nameInput.value = myName;
nameInput.addEventListener('keydown', function(e){ e.stopPropagation(); if (e.key === 'Enter') enterBtn.click(); });
nameInput.addEventListener('keyup', function(e){ e.stopPropagation(); });
enterBtn.addEventListener('click', function(){
  var nm = nameInput.value.replace(/\s+/g, ' ').trim().slice(0, 12);
  if (!nm) { nameErr.textContent = '이름을 먼저 적어주세요!'; nameInput.focus(); return; }
  myName = nm; CALL = callName();
  try { localStorage.setItem('mk_class_name', nm); } catch(e) {}
  drawNameTag();
  nameInput.blur();
  document.getElementById('intro').style.display = 'none';
  started = true;
  renderRank();
  if (window.speechSynthesis) { pickVoice(); }
  requestLock();
  setTimeout(function(){ say(pick(LINES.welcome), false, 4); }, 600);
});
// 처음엔 교실 뒤에서 선생님을 바라봄
player.yaw = Math.atan2(player.x - 0, player.z - (RZ_FRONT + 1.4)) ;
updateSeatUI();

// 점검용
window.__classroom = { player: player, teacher: T, tg: teacher, say: say, setWander: function(v){ wander = v; } };
})();
</script>
