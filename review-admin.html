<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후기 관리 | 김민관 수학</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: '맑은 고딕', sans-serif; background: #f8fafc; color: #1e293b; }
  .container { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
  .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  h1 { font-size: 24px; font-weight: 900; }
  .btn-back { background: #f1f5f9; color: #1e293b; border: 1.5px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; text-decoration: none; }
  .review-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 20px 24px; margin-bottom: 12px; }
  .review-card .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .review-card .name { font-size: 15px; font-weight: 800; }
  .review-card .id { font-size: 12px; color: #94a3b8; font-weight: 400; margin-left: 6px; }
  .review-card .date { font-size: 12px; color: #94a3b8; }
  .review-card .text { font-size: 14px; line-height: 1.8; color: #1e293b; margin-bottom: 14px; }
  .btn-delete { padding: 6px 14px; border: 1.5px solid #fecaca; border-radius: 6px; background: #fff; color: #dc2626; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-delete:hover { background: #fef2f2; }
  .empty { text-align: center; padding: 60px 0; color: #94a3b8; font-size: 15px; }
  .spinner { text-align: center; padding: 60px 0; color: #64748b; font-size: 14px; }
  .access-denied { text-align: center; padding: 80px 20px; }
  .access-denied h2 { font-size: 20px; font-weight: 800; margin-bottom: 12px; color: #dc2626; }
  .access-denied p { font-size: 14px; color: #64748b; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="container">

  <!-- 접근 거부 -->
  <div id="page-denied" style="display:none;">
    <div class="access-denied">
      <h2>접근 권한이 없습니다</h2>
      <p>선생님 계정으로 로그인 후 이용해주세요.</p>
      <a href="homework.html" class="btn-back">로그인하러 가기</a>
    </div>
  </div>

  <!-- 후기 관리 -->
  <div id="page-main" style="display:none;">
    <div class="nav-bar">
      <h1>⭐ 후기 관리</h1>
      <a href="admin.html" class="btn-back" style="background:#2563eb; color:#fff; border-color:#2563eb;">← 관리 페이지</a>
    </div>
    <div id="reviews-area"><div class="spinner">불러오는 중...</div></div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';

window.addEventListener('DOMContentLoaded', function() {
  const session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (!session || session.role !== 'teacher') {
    document.getElementById('page-denied').style.display = 'block';
  } else {
    document.getElementById('page-main').style.display = 'block';
    loadReviews();
  }
});

async function loadReviews() {
  const area = document.getElementById('reviews-area');
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getReviews`);
    const data = await res.json();
    if (!data.reviews || data.reviews.length === 0) {
      area.innerHTML = '<div class="empty">아직 제출된 후기가 없습니다.</div>';
      return;
    }
    area.innerHTML = data.reviews.map((r, i) => `
      <div class="review-card">
        <div class="meta">
          <div><span class="name">${r.name}</span><span class="id">(${r.id})</span></div>
          <span class="date">${r.date}</span>
        </div>
        <div class="text">${r.text}</div>
        <button class="btn-delete" onclick="deleteReview(${i})">삭제</button>
      </div>
    `).join('');
  } catch(e) {
    area.innerHTML = '<div class="empty">불러오기 실패. 다시 시도해주세요.</div>';
  }
}

async function deleteReview(index) {
  if (!confirm('이 후기를 삭제하시겠습니까?')) return;
  try {
    await fetch(`${SCRIPT_URL}?action=deleteReview&index=${index}`);
    loadReviews();
  } catch(e) {
    alert('삭제 실패. 다시 시도해주세요.');
  }
}
</script>
</body>
</html>
