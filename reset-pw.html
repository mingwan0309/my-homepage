<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>비밀번호 변경</title></head>
<body style="font-family:sans-serif;padding:40px;max-width:400px;margin:0 auto;">
<h2>선생님 계정 비밀번호 변경</h2>
<div id="msg" style="margin-bottom:16px;color:#e11;"></div>
<input id="newpw" type="password" placeholder="새 비밀번호 입력" style="width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;font-size:15px;border:1px solid #ccc;border-radius:8px;">
<button onclick="changePw()" style="width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">변경하기</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCJR-nKFY9qNxMma-dj_7x3FB1BwEDzkRY",
  authDomain: "mkmath-54f5d.firebaseapp.com",
  projectId: "mkmath-54f5d",
  appId: "1:238083527582:web:bdcc88f52ccaae85563c8f"
});

async function changePw() {
  const newpw = document.getElementById('newpw').value;
  const msg = document.getElementById('msg');
  if (!newpw) { msg.textContent = '비밀번호를 입력해주세요.'; return; }
  try {
    const auth = firebase.auth();
    await auth.createUserWithEmailAndPassword('mingwan0309@mkmath.local', newpw);
    msg.style.color = '#16a34a';
    msg.textContent = '✅ 계정 생성 완료! 이 페이지를 닫으세요.';
  } catch(e) {
    msg.style.color = '#e11';
    msg.textContent = '실패: ' + e.message;
  }
}
</script>
</body>
</html>
