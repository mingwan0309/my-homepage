<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>*{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;}</style>
<script>['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});</script>
<title>부교재 해설 강의 | 김민관 수학</title>
<script src="firebase-api.js?v=39"></script>
<script src="chat-widget.js" defer></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; background:#f8fafc; color:#1e293b; min-height:100vh; }
.topbar { background:#1e293b; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
.topbar-logo { font-size:15px; font-weight:900; cursor:pointer; }
.topbar-logo span { color:#60a5fa; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.topbar-user { font-size:13px; color:#94a3b8; }
.btn-home { background:#334155; color:#fff; border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
.btn-logout-t { background:none; border:none; color:#64748b; font-size:12px; cursor:pointer; }
.btn-logout-t:hover { color:#ef4444; }
#student-nav { display:none; background:#fff; border-bottom:1px solid #e2e8f0; padding:0 20px; gap:4px; align-items:center; position:sticky; top:0; z-index:99; overflow-x:auto; -webkit-overflow-scrolling:touch; }
#student-nav a { text-decoration:none; padding:12px 14px; font-size:13px; font-weight:600; color:#475569; white-space:nowrap; flex-shrink:0; }
#student-nav a.home-btn { background:#3b6cf7; color:#fff; border-radius:7px; padding:6px 12px; margin-right:8px; }
#student-nav a.active { color:#3b6cf7; border-bottom:2px solid #3b6cf7; }
.container { max-width:1040px; margin:0 auto; padding:32px 24px; }
.page-title { font-size:24px; font-weight:900; margin-bottom:6px; }
.page-sub { font-size:13px; color:#64748b; margin-bottom:24px; }

.grade-tabs { display:flex; gap:8px; margin-bottom:24px; }
.grade-tab { padding:10px 26px; border-radius:20px; border:1.5px solid #e2e8f0; background:#fff; color:#475569; font-weight:700; cursor:pointer; font-size:14px; }
.grade-tab.active { background:#2563eb; border-color:#2563eb; color:#fff; }

.subject-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.subject-tab { padding:8px 20px; border-radius:20px; border:1.5px solid #e2e8f0; background:#fff; color:#475569; font-weight:700; cursor:pointer; font-size:13px; }
.subject-tab.active { background:#16a34a; border-color:#16a34a; color:#fff; }

.book-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
.book-card { background:#fff; border:1.5px solid #e2e8f0; border-radius:14px; padding:26px 18px; text-align:center; cursor:pointer; transition:.15s; }
.book-card:hover { border-color:#2563eb; box-shadow:0 4px 16px rgba(37,99,235,0.1); }
.book-card.active { border-color:#2563eb; background:#eff6ff; }
.book-card-icon { font-size:30px; margin-bottom:10px; }
.book-card-name { font-size:14px; font-weight:800; }
.book-card-count { font-size:11px; color:#94a3b8; margin-top:4px; }

.card { background:#fff; border-radius:14px; box-shadow:0 1px 6px rgba(0,0,0,0.06); padding:20px; }
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.card-title { font-size:16px; font-weight:900; }
.btn-add { background:#2563eb; color:#fff; border:none; padding:9px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }

.video-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; gap:14px; }
.video-empty-icon { font-size:40px; color:#cbd5e1; }
.video-empty-text { color:#94a3b8; font-size:14px; }
.video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.video-card { background:#fff; border-radius:10px; overflow:hidden; border:1px solid #e2e8f0; cursor:pointer; transition:.15s; }
.video-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.10); transform:translateY(-2px); }
.video-thumb { width:100%; aspect-ratio:16/9; background:#1e293b; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.video-thumb img { width:100%; height:100%; object-fit:cover; }
.video-play-icon { position:absolute; width:44px; height:44px; background:rgba(0,0,0,0.6); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
.video-info { padding:10px 12px; }
.video-title { font-size:13px; font-weight:700; color:#1e293b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.video-meta { font-size:11px; color:#94a3b8; margin-top:4px; display:flex; justify-content:space-between; align-items:center; }
.video-del-btn { background:none; border:none; color:#dc2626; cursor:pointer; font-size:11px; padding:0; }

.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:16px; padding:26px; width:90%; max-width:420px; }
.fg label { display:block; font-size:13px; font-weight:700; color:#475569; margin-bottom:6px; }
.fg input { width:100%; padding:10px 13px; border:1.5px solid #e2e8f0; border-radius:9px; font-size:14px; outline:none; margin-bottom:14px; box-sizing:border-box; }
.modal-btns { display:flex; gap:10px; margin-top:6px; }
.modal-btns button { flex:1; padding:11px; border:none; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-ok { background:#2563eb; color:#fff; }
.btn-cl { background:#f1f5f9; color:#64748b; }

@media (max-width:768px){
  html,body{overflow-x:hidden;}
  .topbar{padding:11px 14px;}
  .topbar-user{display:none;}
  .btn-home{padding:10px 14px;font-size:13px;}
  .btn-logout-t{font-size:13px;padding:10px 8px;color:#cbd5e1;}
  /* 학생 네비바 — 손가락 크기 + 잘 보이게 */
  #student-nav a{padding:14px 14px !important;font-size:14px !important;}
  #student-nav a.home-btn{padding:10px 14px !important;font-size:13px !important;}
  .container{padding:18px 13px 40px;}
  .page-title{font-size:21px;}
  .page-sub{font-size:13.5px;margin-bottom:20px;}
  /* 학년/과목 탭 — 손가락 크기 */
  .grade-tabs{gap:8px;flex-wrap:wrap;}
  .grade-tab{padding:13px 24px;font-size:15px;min-height:48px;}
  .subject-tabs{gap:8px;}
  .subject-tab{padding:12px 18px;font-size:14px;min-height:46px;}
  /* 교재 카드 */
  .book-grid{grid-template-columns:repeat(2,1fr);gap:11px;}
  .book-card{padding:20px 10px;}
  .book-card-icon{font-size:28px;margin-bottom:8px;}
  .book-card-name{font-size:14.5px;}
  .book-card-count{font-size:12px;}
  .card-header{flex-wrap:wrap;gap:8px;}
  .card-title{font-size:17px;}
  .btn-add{padding:12px 18px;font-size:14px;min-height:46px;}
  /* 영상 카드 — 크게 보이게 */
  .video-grid{grid-template-columns:1fr;gap:14px;}
  .video-title{font-size:15px;white-space:normal;}
  .video-meta{font-size:12.5px;}
  .video-info{padding:13px 14px;}
  .video-empty-text{font-size:14px;}
  /* 영상 모달 */
  #yt-modal-wrap{width:100% !important;max-width:100% !important;border-radius:0 !important;}
  .modal{padding:20px 18px;}
  .fg input{font-size:16px;padding:13px;}
  .modal-btns button{padding:14px;font-size:15px;min-height:48px;}
}
@media (max-width:400px){
  .book-grid{grid-template-columns:1fr;}
}

#page-denied { display:none; text-align:center; padding:80px 20px; }
/* 정식 전체화면 API가 안 먹는 기기(아이폰 인앱 브라우저 등)용 CSS 가짜 전체화면 */
.yt-fake-fullscreen{position:fixed!important;left:0!important;right:0!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;width:100vw!important;height:calc(100vw*9/16)!important;max-height:100vh!important;max-width:none!important;border-radius:0!important;aspect-ratio:auto!important;z-index:99999!important;}
</style>

<!-- YouTube 플레이어 모달 -->
<div class="modal-bg" id="yt-player-modal" onclick="closeYtModal()">
  <div style="display:flex;flex-direction:column;align-items:center;width:90%;max-width:860px;" onclick="event.stopPropagation()">
  <div style="pointer-events:none;color:#cbd5e1;font-size:11.5px;margin-bottom:6px;text-align:center;">📱 화면을 옆으로 돌리면 더 크게 볼 수 있어요</div>
  <div id="yt-player-wrap" style="position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;">
    <iframe id="yt-player-iframe" src="" frameborder="0" allow="autoplay;encrypted-media" style="width:100%;height:100%;"></iframe>
    <!-- 유튜브 화면 전체를 덮는 클릭 차단막: 어디를 눌러도 유튜브로 안 넘어가고 재생/일시정지만 됨 -->
    <div id="yt-click-shield" onclick="toggleYtPlay()" style="position:absolute;inset:0;cursor:pointer;"></div>

         실제로 손가락이 닿는 영역(#yt-seek-hit)을 훨씬 넓게 만들고 손잡이(동그라미)를 붙여서 드래그로 끌 수 있게 함(2026-09-11) -->
    <div id="yt-seek-hit" onpointerdown="seekYtPointerDown(event)" onpointermove="seekYtPointerMove(event)" onpointerup="seekYtPointerUp(event)" onpointercancel="seekYtPointerUp(event)" style="position:absolute;bottom:2px;left:12px;right:12px;height:20px;z-index:5;cursor:pointer;touch-action:none;">
      <div id="yt-seek-bar" style="position:absolute;bottom:7px;left:0;right:0;height:5px;background:rgba(255,255,255,0.3);border-radius:3px;">
        <div id="yt-seek-fill" style="position:relative;height:100%;width:0%;background:#ff3b3b;border-radius:3px;pointer-events:none;">
          <div style="position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 3px rgba(255,255,255,.35);"></div>
        </div>
      </div>
    </div>
    <div style="position:absolute;bottom:0;right:0;width:100%;height:52px;background:linear-gradient(transparent,#000);pointer-events:none;"></div>
    <div style="position:absolute;bottom:0;right:0;width:220px;height:52px;background:#000;pointer-events:none;"></div>
    <div style="position:absolute;bottom:0;left:0;width:100%;height:52px;background:linear-gradient(transparent,#000);pointer-events:none;"></div>
    <div style="position:absolute;bottom:0;left:0;width:170px;height:52px;background:#000;pointer-events:none;"></div>
    <button onclick="skipYt(-10,event)" style="position:absolute;bottom:18px;left:12px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:4px;height:28px;padding:0 8px;font-size:12px;font-weight:700;cursor:pointer;z-index:5;">⏪10</button>
    <button onclick="skipYt(10,event)" style="position:absolute;bottom:18px;left:66px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:4px;height:28px;padding:0 8px;font-size:12px;font-weight:700;cursor:pointer;z-index:5;">10⏩</button>
    <button id="yt-speed-btn" onclick="cycleYtSpeed(event)" style="position:absolute;bottom:18px;right:46px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:4px;height:28px;padding:0 8px;font-size:12px;font-weight:700;cursor:pointer;z-index:5;">1.0x</button>
    <button onclick="toggleYtFullscreen(event)" style="position:absolute;bottom:18px;right:8px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:4px;width:32px;height:28px;font-size:14px;cursor:pointer;z-index:6;">⛶</button>
    <button onclick="closeYtModal()" style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;line-height:1;z-index:5;">✕</button>
  </div>
  </div>
</div>

<script>
var session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
var SUBJECTS = { '고1': ['공통수학1', '공통수학2'], '고2': ['대수', '미적분'] };
var BOOKS = ['올림포스', '올림포스 유형편', '올림포스 전국연합'];
var currentGrade = '고1';
var currentSubject = SUBJECTS['고1'][0];
var currentBook = '올림포스';
var allVideos = [];

window.addEventListener('DOMContentLoaded', async function(){
  if (!session) { document.getElementById('page-denied').style.display='block'; return; }
  document.getElementById('page-main').style.display='block';
  document.getElementById('student-nav').style.display='flex';
  document.getElementById('topbar-user').textContent = (session.name||session.id) + '님';
  var mc = document.getElementById('snav-myclass');
  if (session.role==='student' && session.classId) mc.href = 'class.html?id='+encodeURIComponent(session.classId);
  else mc.style.display='none';
  renderSubjectTabs();
  renderBookGrid();
  await loadVideos();
});

function logout(){ localStorage.removeItem('mkmath_session'); location.href='index.html'; }

function selectGrade(grade, el){
  currentGrade = grade;
  currentSubject = SUBJECTS[grade][0];
  document.querySelectorAll('.grade-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  renderSubjectTabs();
  renderBookGrid();
  renderVideoArea();
}

function renderSubjectTabs(){
  document.getElementById('subject-tabs').innerHTML = SUBJECTS[currentGrade].map(function(s){
    var active = s===currentSubject ? ' active' : '';
    return '<button class="subject-tab'+active+'" onclick="selectSubject(\''+s+'\',this)">'+s+'</button>';
  }).join('');
}

function selectSubject(subject, el){
  currentSubject = subject;
  document.querySelectorAll('.subject-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  renderBookGrid();
  renderVideoArea();
}

function renderBookGrid(){
  var icons = {'올림포스':'📘','올림포스 유형편':'📗','올림포스 전국연합':'📙'};
  document.getElementById('book-grid').innerHTML = BOOKS.map(function(b){
    var cnt = allVideos.filter(function(v){return v.grade===currentGrade && v.subject===currentSubject && v.book===b;}).length;
    var active = b===currentBook ? ' active' : '';
    return '<div class="book-card'+active+'" onclick="selectBook(\''+b+'\')">'
      +'<div class="book-card-icon">'+icons[b]+'</div>'
      +'<div class="book-card-name">'+b+'</div>'
      +'<div class="book-card-count">영상 '+cnt+'개</div></div>';
  }).join('');
}

function selectBook(book){
  currentBook = book;
  renderBookGrid();
  renderVideoArea();
}

async function loadVideos(){
  try{
    var db = await window.mkdbReady;
    var snap = await db.collection('textbook_videos').get();
    allVideos = [];
    snap.forEach(function(doc){ allVideos.push(doc.data()); });
    renderBookGrid();
    renderVideoArea();
  }catch(e){
    document.getElementById('video-area').innerHTML = '<div class="video-empty"><div class="video-empty-text">불러오기 실패</div></div>';
  }
}

function renderVideoArea(){
  document.getElementById('book-title').textContent = currentGrade + ' · ' + currentSubject + ' · ' + currentBook;
  document.getElementById('btn-add-video').style.display = session.role==='teacher' ? '' : 'none';
  var list = allVideos.filter(function(v){return v.grade===currentGrade && v.subject===currentSubject && v.book===currentBook;});
  var area = document.getElementById('video-area');
  if (!list.length){
    area.innerHTML = '<div class="video-empty"><div class="video-empty-icon">📹</div><div class="video-empty-text">등록된 영상이 없습니다.</div>'
      + (session.role==='teacher' ? '<button class="btn-add" onclick="openAddModal()">영상 추가하기</button>' : '') + '</div>';
    return;
  }
  area.innerHTML = '<div class="video-grid">' + list.map(function(v){
    var vid = ytId(v.url);
    var thumb = vid ? '<img src="https://img.youtube.com/vi/'+vid+'/mqdefault.jpg">' : '';
    var delBtn = session.role==='teacher' ? '<button class="video-del-btn" onclick="event.stopPropagation();delVideo(\''+v.id+'\')">삭제</button>' : '<span></span>';
    return '<div class="video-card" onclick="openVideo(\''+v.url+'\')">'
      +'<div class="video-thumb">'+thumb+'<div class="video-play-icon">▶</div></div>'
      +'<div class="video-info"><div class="video-title">'+escHtml(v.name)+'</div>'
      +'<div class="video-meta"><span>'+escHtml(v.memo||'')+'</span>'+delBtn+'</div></div></div>';
  }).join('') + '</div>';
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ytId(url){
  if(!url) return '';
  var m = url.match(/[?&]v=([^&]+)/) || url.match(/youtu\.be\/([^?&]+)/) || url.match(/embed\/([^?&]+)/)
    || url.match(/shorts\/([^?&]+)/) || url.match(/\/live\/([^?&]+)/);
  return m ? m[1] : '';
}

function openAddModal(){ document.getElementById('add-modal').classList.add('show'); }
function closeAddModal(){
  document.getElementById('add-modal').classList.remove('show');
  document.getElementById('v-name').value=''; document.getElementById('v-url').value=''; document.getElementById('v-memo').value='';
}

async function saveVideo(){
  var name = document.getElementById('v-name').value.trim();
  var url = document.getElementById('v-url').value.trim();
  var memo = document.getElementById('v-memo').value.trim();
  if (!name || !url) { alert('이름과 링크를 입력해주세요.'); return; }
  var db = await window.mkdbReady;
  var id = window.mkGenId('tbv');
  await db.collection('textbook_videos').doc(id).set({
    id: id, grade: currentGrade, subject: currentSubject, book: currentBook, name: name, url: url, memo: memo, createdAt: window.mkNowStr()
  });
  closeAddModal();
  await loadVideos();
}

async function delVideo(id){
  if (!confirm('이 영상을 삭제할까요?')) return;
  var db = await window.mkdbReady;
  await db.collection('textbook_videos').doc(String(id)).delete();
  await loadVideos();
}

// YouTube 재생 (로고 가림 + 커스텀 풀스크린)
// YouTube IFrame API (자체 재생/일시정지/구간이동용)
var ytApiPromise=null;
function loadYtApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise=new Promise(function(resolve){
    if(window.YT&&window.YT.Player){resolve();return;}
    window.onYouTubeIframeAPIReady=function(){resolve();};
    var s=document.createElement('script');
    s.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytApiPromise;
}
var ytPlayer=null, ytProgressTimer=null, ytReady=false;
var YT_SPEEDS=[0.8,0.9,1.0,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,2.0];
var ytSpeedIdx=2;

// 영상 볼 때만 화면 확대(핀치줌)를 허용 — 사이트 전체는 실수로 확대돼서 레이아웃 깨지는 걸 막으려고 확대를 꺼두지만,
// 강의 영상은 작은 글씨(문제 화면 등)를 확대해서 봐야 할 때가 있어서 영상 보는 동안만 예외로 켜줌
function setViewportZoomable(z){
  var vp=document.querySelector('meta[name="viewport"]');
  if(!vp) return;
  vp.setAttribute('content', z
    ? 'width=device-width, initial-scale=1.0, viewport-fit=cover'
    : 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover');
}
function openVideo(url){
  setViewportZoomable(true);
  if(window.mkSetChatBubbleVisible) window.mkSetChatBubbleVisible(false);
  var vid = ytId(url);
  if (vid){
    ytReady=false; ytSpeedIdx=2;
    document.getElementById('yt-speed-btn').textContent='1.0x';
    document.getElementById('yt-seek-fill').style.width='0%';
    document.getElementById('yt-player-iframe').src = 'https://www.youtube.com/embed/'+vid+'?autoplay=1&modestbranding=1&rel=0&controls=0&cc_load_policy=0&cc_lang_pref=none&enablejsapi=1&origin='+encodeURIComponent(location.origin);
    document.getElementById('yt-player-modal').classList.add('show');
    loadYtApi().then(function(){
      ytPlayer=new YT.Player('yt-player-iframe',{ events:{
        onReady:function(e){ ytReady=true; try{ e.target.unloadModule('captions'); e.target.unloadModule('cc'); }catch(err){} },
        onStateChange:function(e){ try{ e.target.unloadModule('captions'); e.target.unloadModule('cc'); }catch(err){} }
      } });
      ytProgressTimer=setInterval(function(){
        try{
          if(!ytPlayer||!ytPlayer.getDuration) return;
          var dur=ytPlayer.getDuration(), cur=ytPlayer.getCurrentTime();
          if(dur>0) document.getElementById('yt-seek-fill').style.width=Math.min(100,Math.round(cur/dur*100))+'%';
        }catch(e){}
      }, 1000);
    });
  } else {
    window.open(url, '_blank');
  }
}
function closeYtModal(){
  setViewportZoomable(false);
  if(window.mkSetChatBubbleVisible) window.mkSetChatBubbleVisible(true);
  var ytWrap0=document.getElementById('yt-player-wrap');
  if(ytWrap0) ytWrap0.classList.remove('yt-fake-fullscreen');
  if (document.fullscreenElement) document.exitFullscreen();
  else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  if(ytProgressTimer){clearInterval(ytProgressTimer);ytProgressTimer=null;}
  ytPlayer=null; ytReady=false;
  document.getElementById('yt-player-iframe').src = '';
  document.getElementById('yt-player-modal').classList.remove('show');
}
function toggleYtPlay(){
  if(!ytPlayer||!ytReady) return;
  try{
    var state=ytPlayer.getPlayerState();
    if(state===1) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  }catch(e){}
}
var ytSeekDragging=false;
function seekYtApply(clientX, commit){
  if(!ytPlayer||!ytReady) return;
  try{
    var bar=document.getElementById('yt-seek-bar');
    var rect=bar.getBoundingClientRect();
    var frac=Math.min(1,Math.max(0,(clientX-rect.left)/rect.width));
    document.getElementById('yt-seek-fill').style.width=(frac*100)+'%';
    if(commit){ var dur=ytPlayer.getDuration(); if(dur>0) ytPlayer.seekTo(dur*frac,true); }
  }catch(e){}
}
function seekYtPointerDown(e){
  e.stopPropagation();
  ytSeekDragging=true;
  try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
  seekYtApply(e.clientX, true);
}
function seekYtPointerMove(e){
  if(!ytSeekDragging) return;
  e.stopPropagation();
  seekYtApply(e.clientX, false);
}
function seekYtPointerUp(e){
  if(!ytSeekDragging) return;
  e.stopPropagation();
  ytSeekDragging=false;
  seekYtApply(e.clientX, true);
}
function cycleYtSpeed(e){
  e.stopPropagation();
  if(!ytPlayer||!ytReady) return;
  ytSpeedIdx=(ytSpeedIdx+1)%YT_SPEEDS.length;
  var rate=YT_SPEEDS[ytSpeedIdx];
  try{ ytPlayer.setPlaybackRate(rate); }catch(err){}
  document.getElementById('yt-speed-btn').textContent=rate.toFixed(1)+'x';
}
// 전체화면 버튼 — 아이폰 사파리(특히 카카오톡/인스타 인앱 브라우저)는 iframe을 감싼 div에
// requestFullscreen()을 아예 지원 안 하거나 조용히 실패하는 경우가 많아서 버튼이 "안 눌리는" 것처럼 보였음(2026-09-12).
// 정식 전체화면 API가 실패하면 CSS로 화면 전체를 덮는 가짜 전체화면으로 확실하게 대체함.
function toggleYtFullscreen(e){
  if(e) e.stopPropagation();
  var wrap = document.getElementById('yt-player-wrap');
  if(document.fullscreenElement || document.webkitFullscreenElement){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  if(wrap.classList.contains('yt-fake-fullscreen')){
    wrap.classList.remove('yt-fake-fullscreen');
    return;
  }
  var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.webkitEnterFullscreen;
  if(req){
    try{
      var p = req.call(wrap);
      if(p && typeof p.catch==='function') p.catch(function(){ wrap.classList.add('yt-fake-fullscreen'); });
    }catch(err){ wrap.classList.add('yt-fake-fullscreen'); }
  } else {
    wrap.classList.add('yt-fake-fullscreen');
  }
}
function skipYt(sec,e){
  if(e) e.stopPropagation();
  if(!ytPlayer||!ytReady) return;
  try{
    var dur=ytPlayer.getDuration(), cur=ytPlayer.getCurrentTime();
    var t=Math.max(0, cur+sec);
    if(dur>0) t=Math.min(dur, t);
    ytPlayer.seekTo(t,true);
    if(dur>0) document.getElementById('yt-seek-fill').style.width=(Math.min(100,Math.round(t/dur*100)))+'%';
  }catch(err){}
}
