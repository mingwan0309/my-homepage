<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>미니게임 — 김민관 수학</title>
<script src="firebase-api.js?v=50"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;}
body{background:#0f172a;color:#fff;min-height:100vh;}
a{text-decoration:none;}

#page-denied{display:none;text-align:center;padding:100px 20px;color:#1e293b;background:#f1f5f9;min-height:100vh;}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#1e293b;position:sticky;top:0;z-index:20;}
.topbar a{color:#cbd5e1;font-size:20px;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;}
.topbar h1{font-size:16px;font-weight:800;}

.container{max-width:480px;margin:0 auto;padding:16px 16px 40px;}

.lb-card{background:#1e293b;border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.lb-title{font-size:13px;font-weight:800;color:#fbbf24;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.lb-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
.lb-rank{width:22px;text-align:center;font-weight:800;color:#94a3b8;flex-shrink:0;}
.lb-rank.gold{color:#facc15;}
.lb-name{flex:1;font-weight:700;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-weight:800;color:#60a5fa;}
.lb-empty{color:#64748b;font-size:12.5px;padding:6px 0;}

.btn-play{width:100%;min-height:52px;border:none;border-radius:12px;background:linear-gradient(135deg,#3b6cf7,#1d4ed8);color:#fff;font-size:16px;font-weight:800;cursor:pointer;}
.btn-play:disabled{background:#334155;color:#64748b;cursor:default;}

.gs-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #263449;cursor:pointer;min-height:56px;}
.gs-row:last-child{border-bottom:none;}
.gs-row.disabled{opacity:.55;cursor:default;}
.gs-icon{font-size:28px;flex-shrink:0;}
.gs-body{flex:1;min-width:0;}
.gs-title{font-size:14.5px;font-weight:800;color:#f1f5f9;}
.gs-sub{font-size:12px;color:#94a3b8;margin-top:2px;}
.gs-arrow{font-size:14px;color:#64748b;flex-shrink:0;}

#game-wrap{display:none;position:fixed;inset:0;z-index:60;background:#0f172a;padding:16px;overflow-y:auto;}
#game-wrap-inner{max-width:480px;margin:0 auto;}
#game-canvas{width:100%;display:block;border-radius:14px;background:#1e2a45;touch-action:none;}
.game-hud{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;font-size:14px;font-weight:800;color:#e2e8f0;}
.touch-hint{text-align:center;font-size:12px;color:#64748b;margin-top:8px;}

#intro-overlay{display:none;position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.97);align-items:center;justify-content:center;padding:24px;}
#intro-card{background:#1e293b;border-radius:18px;padding:26px 22px;width:100%;max-width:340px;text-align:center;}
.intro-title{font-size:18px;font-weight:900;color:#fff;margin-bottom:18px;}
.intro-row{display:flex;align-items:center;gap:14px;text-align:left;background:#151f32;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.intro-emoji{font-size:30px;flex-shrink:0;}
.intro-text{font-size:13px;color:#cbd5e1;line-height:1.5;}
.intro-text b{color:#fff;font-size:14px;}
.intro-hint{font-size:12px;color:#64748b;margin:14px 0 18px;}
#intro-start-btn{width:100%;}

#result-box{display:none;background:#1e293b;border-radius:14px;padding:22px;text-align:center;margin-top:14px;}
#result-box .r-title{font-size:14px;color:#94a3b8;margin-bottom:6px;}
#result-box .r-score{font-size:38px;font-weight:900;color:#fbbf24;margin-bottom:14px;}
#result-box .r-msg{font-size:13px;color:#94a3b8;margin-bottom:16px;}
.btn-row{display:flex;gap:8px;}
.btn-row button{flex:1;min-height:48px;border-radius:10px;border:none;font-size:14px;font-weight:800;cursor:pointer;}
.btn-secondary{background:#334155;color:#e2e8f0;}
.btn-primary2{background:#3b6cf7;color:#fff;}

@media (max-width:480px){
  .container{padding:14px 12px 40px;}
}
</style>
</head>
<body>

<div id="page-denied">
  <h2>접근 권한이 없습니다</h2>
  <p style="margin-top:10px;color:#64748b;">학생 계정으로 로그인 후 이용해주세요.</p>
</div>

<div id="page-main" style="display:none;">
  <div class="topbar">
    <a href="mypage.html">←</a>
    <h1>🎮 미니게임</h1>
    <span id="dday-badge" style="margin-left:auto;background:rgba(248,113,113,.15);color:#f87171;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;"></span>
  </div>

  <div class="container">
    <div class="lb-card">
      <div class="lb-title">🏆 이번 주 순위 (총점)</div>
      <div id="lb-list"><div class="lb-empty">불러오는 중...</div></div>
    </div>

    <div class="lb-card">
      <div class="lb-title">💩 똥피하기 주간 누적 순위</div>
      <div id="lb-default-list"><div class="lb-empty">불러오는 중...</div></div>
    </div>

    <div class="card" id="game-select-card" style="background:#1e293b;border-radius:14px;padding:14px 16px;margin-bottom:14px;">
      <div class="lb-title" style="color:#e2e8f0;">🎮 게임 선택</div>
      <div id="game-select-list"><div class="lb-empty">불러오는 중...</div></div>
    </div>

    <div id="game-wrap">
      <div id="game-wrap-inner">
        <div class="game-hud"><span>점수 <b id="hud-score">0</b></span><span id="hud-timer"></span></div>
        <canvas id="game-canvas" width="360" height="480"></canvas>
        <div class="touch-hint" id="canvas-touch-hint">화면을 좌우로 드래그하거나 ←/→ 키로 피하세요</div>
        <div id="typing-game-area" style="display:none;">
          <div id="typing-sentence" style="background:#1e2a45;border-radius:14px;padding:24px 18px;text-align:center;font-size:17px;font-weight:700;line-height:1.6;min-height:90px;display:flex;align-items:center;justify-content:center;"></div>
          <input id="typing-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="문장을 그대로 입력하세요" style="width:100%;box-sizing:border-box;margin-top:14px;padding:14px 16px;border-radius:12px;border:none;font-size:16px;">
          <button type="button" id="typing-submit-btn" onclick="checkTypingAnswer()" style="width:100%;box-sizing:border-box;margin-top:10px;min-height:48px;border:none;border-radius:12px;background:#6366f1;color:#fff;font-size:16px;font-weight:800;cursor:pointer;">✅ 제출</button>
          <div id="typing-feedback" style="text-align:center;margin-top:10px;font-size:13.5px;font-weight:700;height:18px;"></div>
        </div>
      </div>
    </div>

    <div id="result-box">
      <div class="r-title">이번 판 점수</div>
      <div class="r-score" id="r-score">0</div>
      <div class="r-msg" id="r-msg">제출하는 중...</div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="location.href='mypage.html'">마이페이지로</button>
        <button class="btn-primary2" onclick="backToStatus()">확인</button>
      </div>
    </div>
  </div>
</div>

<!-- 시작 전 안내 화면 -->
<div id="intro-overlay">
  <div id="intro-card">
    <div class="intro-title" id="intro-title">게임 방법</div>
    <div id="intro-rows"></div>
    <div class="intro-hint" id="intro-hint">화면을 좌우로 드래그하거나 ←/→ 키로 이동해요</div>
    <button class="btn-play" id="intro-start-btn" onclick="closeIntroAndStart()">시작하기</button>
  </div>
</div>

<script>
var session=null;
var SU='https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';

// 게임 목록 — 학생이 직접 골라서 플레이. 게임마다 하루 2번(테스트 계정은 무제한)씩 따로 도전 가능.
// 새 게임을 추가하려면 이 배열에 키를 늘리고, 아래 GAME_META에 안내문구/그리기 방식을 추가하면 됨.
var GAME_ROTATION = ['default','typing']; // '숫자 잡기'(numbercatch)는 나중에 다시 다듬어서 추가할 예정 — 코드는 GAME_META에 그대로 남겨둠

// 게임별 설정 — 제목/안내문구/장애물·보너스를 어떻게 그릴지를 여기서 갈라서 처리
var GAME_META = {
  default: {
    title: '똥 피하기', icon: '💩',
    introRows: [
      ['💩','피하세요!','부딪히면 바로 게임 종료']
      // 보너스 글자 안내 행은 관리 페이지에서 설정한 목록으로 매번 다시 만들어서 붙임(renderIntroContent 참고)
    ]
  },
  numbercatch: {
    title: '숫자 잡기', icon: '🔢',
    introRows: [
      ['🔴','홀수는 피하세요!','부딪히면 바로 게임 종료'],
      ['🟢','짝수를 잡으세요!','숫자만큼 점수를 얻어요']
    ]
  },
  typing: {
    title: '문장 빨리 쓰기', icon: '✍️',
    introRows: [
      ['📖','문장이 나와요','화면의 문장을 그대로 똑같이 입력하세요'],
      ['✍️','빠르고 정확하게!','띄어쓰기·문장부호까지 완전히 같아야 정답']
    ]
  }
};
var activeGameKey = 'default';
// 게임은 이제 학생이 직접 골라서 하는 방식이라 자동 교체는 없고, 디데이는 '이번 주 순위표 마감(월요일 리셋)'까지 남은 날짜를 보여줌
function renderDdayBadge(){
  var isoDay = new Date().getDay(); isoDay = isoDay===0 ? 7 : isoDay; // 월=1 ... 일=7
  var daysLeft = 7 - isoDay; // 일요일=0(오늘 마감), 월요일=6 ...
  var el=document.getElementById('dday-badge');
  if(!el) return;
  el.textContent = daysLeft<=0 ? '오늘 순위 마감!' : '순위마감 D-'+daysLeft;
}

document.addEventListener('DOMContentLoaded', async function(){
  renderDdayBadge();
  session = JSON.parse(localStorage.getItem('mkmath_session')||'null');
  if(!session || session.role!=='student'){
    document.getElementById('page-denied').style.display='block';
    return;
  }
  document.getElementById('page-main').style.display='block';
  // 점수가 저장되지 않는 두 가지 흔한 경우를 미리 안내 (2026-09-18 — 점수가 서버에 한 건도 안 남는 학생이 있어서 추가)
  // ① 학부모 계정으로 들어온 경우: 보안 규칙상 학생 본인 로그인만 점수 저장 가능
  if(session.authId && session.authId!==session.id){
    showGameNotice('⚠️ 지금 로그인한 계정('+escHtml(session.authId)+')이 학생 본인 아이디('+escHtml(session.id)+')와 달라서(학부모 계정 등) 게임 점수가 기록되지 않아요. 학생 본인 아이디로 다시 로그인한 뒤 도전해주세요.');
  }
  // ② 화면엔 로그인돼 있는 것처럼 보이지만 실제 인증이 풀린 경우(앱 데이터 정리 등): 저장이 전부 거부됨
  try{
    await new Promise(function(res){ var t=setTimeout(res,4000); var un=firebase.auth().onAuthStateChanged(function(){ clearTimeout(t); un(); res(); }); });
    if(!firebase.auth().currentUser){
      showGameNotice('⚠️ 로그인이 풀려 있어서 점수가 기록되지 않아요. <a href="index.html" style="color:#fbbf24;font-weight:800;">여기를 눌러 다시 로그인</a>한 뒤 도전해주세요.');
    }
  }catch(e){}
  await loadStatus();
  loadBonusConfig();
});
function showGameNotice(html){
  var el=document.getElementById('game-notice');
  if(!el){
    el=document.createElement('div'); el.id='game-notice';
    el.style.cssText='margin:0 0 14px;padding:12px 14px;border-radius:10px;background:#7f1d1d;color:#fecaca;font-size:13px;line-height:1.6;font-weight:600;';
    var main=document.getElementById('page-main'); main.insertBefore(el, main.firstChild);
  }
  el.innerHTML=html;
}
// 똥피하기 보너스 글자 설정 — 관리 페이지에서 등록해둔 목록을 불러옴(비어있으면 기본값)
var bonusConfig=[{char:'복',points:5},{char:'워',points:7}];
async function loadBonusConfig(){
  try{
    var r=await fetch(SU+'?action=getGameSettings').then(function(r){return r.json();});
    if(r.bonusItems && r.bonusItems.length) bonusConfig=r.bonusItems;
  }catch(e){}
}

var gameStatusCache=null;
async function loadStatus(){
  try{
    var r=await fetch(SU+'?action=getGameStatus&studentId='+encodeURIComponent(session.id)).then(function(r){return r.json();});
    gameStatusCache=r;
    renderLeaderboard(r.leaderboard||[]);
    renderDefaultWeekly(r.defaultWeekly||[]);
    renderStatus(r);
  }catch(e){
    document.getElementById('lb-list').innerHTML='<div class="lb-empty">불러오기 실패</div>';
    document.getElementById('lb-default-list').innerHTML='<div class="lb-empty">불러오기 실패</div>';
    document.getElementById('game-select-list').innerHTML='<div class="lb-empty">불러오기 실패. 새로고침 해주세요.</div>';
  }
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderLeaderboard(list){
  var el=document.getElementById('lb-list');
  if(!list.length){ el.innerHTML='<div class="lb-empty">아직 이번 주 기록이 없어요. 첫 도전자가 되어보세요!</div>'; return; }
  el.innerHTML=list.map(function(l,i){
    var rank=l.rank||(i+1);
    var isMe=l.studentId===session.id;
    return (l.outsideTop?'<div class="lb-empty" style="padding:4px 0;">···</div>':'')
      +'<div class="lb-row">'
      +'<span class="lb-rank'+(rank===1?' gold':'')+'">'+(rank===1?'👑':rank)+'</span>'
      +'<span class="lb-name" style="'+(isMe?'color:#4ade80;':'')+'">'+escHtml(l.studentName)+(isMe?' (나)':'')+'</span>'
      +'<span class="lb-score">'+l.score+'점</span>'
      +'</div>';
  }).join('');
}
// 똥피하기 전용 순위표 — 이번 주에 낸 모든 점수를 다 더한 "누적점수"로 순위를 매김(다른 게임이랑 합산 안 됨, 최고점도 같이 보여줌)
function renderDefaultWeekly(list){
  var el=document.getElementById('lb-default-list');
  if(!list.length){ el.innerHTML='<div class="lb-empty">아직 이번 주 기록이 없어요. 첫 도전자가 되어보세요!</div>'; return; }
  el.innerHTML=list.map(function(l,i){
    var rank=l.rank||(i+1);
    var isMe=l.studentId===session.id;
    return (l.outsideTop?'<div class="lb-empty" style="padding:4px 0;">···</div>':'')
      +'<div class="lb-row">'
      +'<span class="lb-rank'+(rank===1?' gold':'')+'">'+(rank===1?'👑':rank)+'</span>'
      +'<span class="lb-name" style="'+(isMe?'color:#4ade80;':'')+'">'+escHtml(l.studentName)+(isMe?' (나)':'')+'</span>'
      +'<span class="lb-score">누적 '+l.total+'점<span style="color:#64748b;font-weight:600;font-size:11px;"> · 최고 '+l.best+'점</span></span>'
      +'</div>';
  }).join('');
}
function renderStatus(r){
  var perGame = r.perGame || {};
  var max = r.maxAttempts;
  var html = GAME_ROTATION.map(function(gk){
    var meta = GAME_META[gk] || GAME_META.default;
    var st = perGame[gk] || { attemptsToday:0 };
    var left = (max===-1) ? -1 : Math.max(0, max-(st.attemptsToday||0));
    var playedOut = left===0;
    var sub;
    if (max===-1) sub = '무제한 도전 가능';
    else if (playedOut) sub = '오늘 다 도전했어요'+(st.todayScore!=null?' · 오늘 최고 '+st.todayScore+'점':'');
    else sub = '오늘 '+max+'번 중 '+left+'번 남음'+(st.todayScore!=null?' · 오늘 최고 '+st.todayScore+'점':'');
    return '<div class="gs-row'+(playedOut?' disabled':'')+'" onclick="'+(playedOut?'':'pickGame(\''+gk+'\')')+'">'
      +'<span class="gs-icon">'+meta.icon+'</span>'
      +'<div class="gs-body"><div class="gs-title">'+meta.title+'</div><div class="gs-sub">'+sub+'</div></div>'
      +'<span class="gs-arrow">'+(playedOut?'✔':'▶')+'</span>'
      +'</div>';
  }).join('');
  document.getElementById('game-select-list').innerHTML = html;
}
function pickGame(gameKey){
  activeGameKey = gameKey;
  showIntro();
}
function backToStatus(){
  document.getElementById('result-box').style.display='none';
  loadStatus();
}

/* ===== 게임 로직 ===== */
var canvas, ctx, rafId=null;
var player={x:180,w:34,h:34};
var obstacles=[], bonuses=[], floaters=[];
var startTime=0, lastSpawn=0, spawnInterval=900, fallSpeed=2.2, running=false;
var lastBonusSpawn=0, nextBonusDelay=3000, bonusScore=0;
var dragging=false;

function renderIntroContent(){
  var meta = GAME_META[activeGameKey] || GAME_META.default;
  var rows = meta.introRows.slice();
  if(activeGameKey==='default' && bonusConfig.length){
    // 보너스 글자는 관리 페이지 설정에 따라 매번 바뀔 수 있어서, 안내 문구도 그때그때 새로 만들어서 붙임
    rows = rows.concat(bonusConfig.map(function(it){
      return [it.char, '먹으면 '+it.points+'점', '반짝이는 글씨를 잡아서 점수를 모으세요'];
    }));
  }
  var rowsHtml = rows.map(function(r){
    return '<div class="intro-row"><span class="intro-emoji">'+r[0]+'</span><div class="intro-text"><b>'+r[1]+'</b><br>'+r[2]+'</div></div>';
  }).join('');
  document.getElementById('intro-title').textContent = meta.title;
  document.getElementById('intro-rows').innerHTML = rowsHtml;
  document.getElementById('intro-hint').textContent = activeGameKey==='typing'
    ? '화면의 문장을 그대로 입력하고 ✅ 제출 버튼을 누르세요'
    : '화면을 좌우로 드래그하거나 ←/→ 키로 이동해요';
}
function showIntro(){
  renderIntroContent();
  document.getElementById('intro-overlay').style.display='flex';
}
function closeIntroAndStart(){
  document.getElementById('intro-overlay').style.display='none';
  startGame();
}
function startGame(){
  if(activeGameKey==='typing'){ startTypingGame(); return; }
  document.getElementById('result-box').style.display='none';
  document.getElementById('game-wrap').style.display='block';
  document.getElementById('typing-game-area').style.display='none';
  document.getElementById('canvas-touch-hint').style.display='';
  canvas=document.getElementById('game-canvas');
  canvas.style.display='';
  ctx=canvas.getContext('2d');
  fitCanvas();
  player.x=canvas.width/2;
  obstacles=[]; bonuses=[]; floaters=[];
  bonusScore=0;
  startTime=performance.now();
  lastSpawn=startTime;
  lastBonusSpawn=startTime;
  nextBonusDelay=2500+Math.random()*2000;
  spawnInterval=900;
  fallSpeed=2.2;
  running=true;
  bindControls();
  rafId=requestAnimationFrame(loop);
}

/* ===== 문장 빨리 쓰기 (제한시간 내 화면 문장 그대로 타이핑) ===== */
var typingSentenceBank=[], typingGameScore=0, typingGameTimerInt=null, typingGameEndAt=0, typingGameCur=null;
var TYPING_GAME_SECONDS=60;
async function loadTypingSentenceBank(){
  if(typingSentenceBank.length) return typingSentenceBank;
  try{
    var r=await fetch(SU+'?action=getTypingSentences').then(function(r){return r.json();});
    typingSentenceBank=(r.sentences||[]).filter(function(s){ return s.text; });
  }catch(e){ typingSentenceBank=[]; }
  return typingSentenceBank;
}
async function startTypingGame(){
  var bank=await loadTypingSentenceBank();
  if(!bank.length){
    alert('아직 등록된 문제가 없어요. 선생님께 말씀드려보세요!');
    document.getElementById('intro-overlay').style.display='none';
    return;
  }
  document.getElementById('result-box').style.display='none';
  document.getElementById('game-wrap').style.display='block';
  document.getElementById('canvas-touch-hint').style.display='none';
  document.getElementById('game-canvas').style.display='none';
  document.getElementById('typing-game-area').style.display='block';
  typingGameScore=0;
  document.getElementById('hud-score').textContent='0';
  var input=document.getElementById('typing-input');
  input.disabled=false;
  typingChecking=false;
  typingGameEndAt=Date.now()+TYPING_GAME_SECONDS*1000;
  bindTypingControls();
  nextTypingSentence();
  if(typingGameTimerInt) clearInterval(typingGameTimerInt);
  typingGameTimerInt=setInterval(typingGameTick, 200);
}
function pickRandomTypingSentence(){
  if(!typingSentenceBank.length) return null;
  var i=Math.floor(Math.random()*typingSentenceBank.length);
  if(typingSentenceBank.length>1 && typingGameCur && typingSentenceBank[i].id===typingGameCur.id){
    i=(i+1)%typingSentenceBank.length;
  }
  return typingSentenceBank[i];
}
function nextTypingSentence(){
  typingGameCur=pickRandomTypingSentence();
  document.getElementById('typing-sentence').textContent=typingGameCur?typingGameCur.text:'';
  var input=document.getElementById('typing-input');
  input.value='';
  document.getElementById('typing-feedback').textContent='';
  input.focus();
}
function bindTypingControls(){
  var input=document.getElementById('typing-input');
  // 폰 한글 키보드는 조합 중 Enter가 key='Process'/keyCode 229로 오기도 해서 keyCode 13도 같이 봄
  input.onkeydown=function(e){ if(e.key==='Enter' || e.keyCode===13){ e.preventDefault(); checkTypingAnswer(); } };
}
var typingChecking=false; // 제출 후 다음 문장 뜨기 전까지 중복 제출(점수 이중 가산) 방지
function checkTypingAnswer(){
  var input=document.getElementById('typing-input');
  if(input.disabled || typingChecking) return;
  var val=input.value.trim();
  if(!val || !typingGameCur) return;
  typingChecking=true;
  var ok = val===typingGameCur.text.trim();
  var fb=document.getElementById('typing-feedback');
  if(ok){
    typingGameScore+=15;
    document.getElementById('hud-score').textContent=typingGameScore;
    fb.style.color='#4ade80'; fb.textContent='✅ 정답!';
  } else {
    fb.style.color='#f87171'; fb.textContent='❌ 띄어쓰기·문장부호까지 똑같이 입력해보세요';
  }
  setTimeout(function(){ typingChecking=false; if(typingGameTimerInt) nextTypingSentence(); }, ok?300:1000);
}
function typingGameTick(){
  var left=Math.max(0, typingGameEndAt-Date.now());
  var s=Math.ceil(left/1000);
  document.getElementById('hud-timer').textContent='⏱ '+s+'초';
  if(left<=0){
    clearInterval(typingGameTimerInt); typingGameTimerInt=null;
    document.getElementById('typing-input').disabled=true;
    endGame(typingGameScore);
  }
}
function fitCanvas(){
  var cssW=canvas.clientWidth;
  canvas.width=cssW;
  canvas.height=Math.round(cssW*4/3);
}
function bindControls(){
  canvas.onpointerdown=function(e){ dragging=true; movePlayerToEvent(e); };
  canvas.onpointermove=function(e){ if(dragging) movePlayerToEvent(e); };
  canvas.onpointerup=function(){ dragging=false; };
  canvas.onpointerleave=function(){ dragging=false; };
  document.onkeydown=function(e){
    if(!running) return;
    if(e.key==='ArrowLeft') player.x=Math.max(player.w/2, player.x-24);
    if(e.key==='ArrowRight') player.x=Math.min(canvas.width-player.w/2, player.x+24);
  };
}
function movePlayerToEvent(e){
  var rect=canvas.getBoundingClientRect();
  var x=(e.clientX-rect.left)*(canvas.width/rect.width);
  player.x=Math.max(player.w/2, Math.min(canvas.width-player.w/2, x));
}
function loop(now){
  if(!running) return;
  var elapsed=now-startTime;
  var score=Math.floor(elapsed/100)+bonusScore;
  document.getElementById('hud-score').textContent=score;

  // 난이도 상승 (시간이 지날수록 계속 더 빨라짐)
  spawnInterval=Math.max(220, 900-elapsed/70);
  fallSpeed=Math.min(11, 2.2+elapsed/4500);

  if(now-lastSpawn>spawnInterval){
    lastSpawn=now;
    var oItem={x:Math.random()*(canvas.width-28)+14, y:-20, r:14+Math.random()*8};
    if(activeGameKey==='numbercatch'){ oItem.num=[1,3,5,7,9][Math.floor(Math.random()*5)]; }
    obstacles.push(oItem);
  }
  obstacles.forEach(function(o){ o.y+=fallSpeed*2; });
  obstacles=obstacles.filter(function(o){ return o.y<canvas.height+30; });

  // 보너스 점수 아이템 — 아주 빠르게 떨어짐, 먹으면 점수 획득(기본 게임은 +5~+10, 숫자 잡기는 숫자만큼)
  if(now-lastBonusSpawn>nextBonusDelay){
    lastBonusSpawn=now;
    nextBonusDelay=3500+Math.random()*3000;
    if(activeGameKey==='numbercatch'){
      var n=[2,4,6,8][Math.floor(Math.random()*4)];
      bonuses.push({x:Math.random()*(canvas.width-28)+14, y:-20, r:15, value:n, num:n});
    } else {
      var pick = bonusConfig[Math.floor(Math.random()*bonusConfig.length)];
      bonuses.push({x:Math.random()*(canvas.width-28)+14, y:-20, r:15, value:pick.points, word:pick.char});
    }
  }
  bonuses.forEach(function(b){ b.y+=9; });
  bonuses=bonuses.filter(function(b){ return b.y<canvas.height+30; });

  floaters.forEach(function(f){ f.y-=1.2; f.life-=1; });
  floaters=floaters.filter(function(f){ return f.life>0; });

  // 충돌 체크(장애물)
  var py=canvas.height-46;
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    var dx=o.x-player.x, dy=o.y-py;
    if(Math.sqrt(dx*dx+dy*dy) < o.r*0.7+player.w*0.4){
      endGame(score);
      return;
    }
  }
  // 보너스 획득 체크
  for(var j=bonuses.length-1;j>=0;j--){
    var b=bonuses[j];
    var bdx=b.x-player.x, bdy=b.y-py;
    if(Math.sqrt(bdx*bdx+bdy*bdy) < b.r+player.w*0.4){
      bonusScore+=b.value;
      floaters.push({x:b.x,y:b.y,text:'+'+b.value,life:36});
      bonuses.splice(j,1);
    }
  }

  draw(py);
  rafId=requestAnimationFrame(loop);
}
function draw(py){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#1e2a45';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(activeGameKey==='numbercatch'){
    obstacles.forEach(function(o){
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fillStyle='#ef4444'; ctx.fill();
      ctx.font='bold '+(o.r*1.1)+'px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(String(o.num), o.x, o.y);
    });
    bonuses.forEach(function(b){
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fillStyle='#22c55e'; ctx.fill();
      ctx.font='bold '+(b.r*1.1)+'px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(String(b.num), b.x, b.y);
    });
  } else {
    obstacles.forEach(function(o){
      ctx.font=(o.r*1.8)+'px sans-serif';
      ctx.fillText('💩', o.x, o.y);
    });
    bonuses.forEach(function(b){
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fillStyle='#facc15'; ctx.fill();
      ctx.font='bold '+(b.r*1.1)+'px "Pretendard","Malgun Gothic",sans-serif'; ctx.fillStyle='#1e2a45'; ctx.fillText(b.word, b.x, b.y);
    });
  }
  floaters.forEach(function(f){
    ctx.font='bold 15px sans-serif';
    ctx.fillStyle='rgba(250,204,21,'+Math.min(1,f.life/36)+')';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.font='32px sans-serif';
  ctx.fillText('🙂', player.x, py);
}
function endGame(score){
  running=false;
  if(rafId) cancelAnimationFrame(rafId);
  document.getElementById('game-wrap').style.display='none';
  document.getElementById('result-box').style.display='block';
  document.getElementById('r-score').textContent=score;
  document.getElementById('r-msg').textContent='제출하는 중...';
  submitScore(score);
}
async function submitScore(score){
  try{
    var res=await fetch(SU,{method:'POST',body:JSON.stringify({action:'submitGameScore',studentId:session.id,studentName:session.name||'',score:score,gameKey:activeGameKey})});
    var d=await res.json();
    var msgEl=document.getElementById('r-msg');
    if(d&&d.success!==false){
      msgEl.textContent='점수가 기록됐어요!';
      loadStatus(); // 순위표·남은 횟수 바로 갱신
    } else {
      var m=(d&&d.msg)||'';
      if(/permission|insufficient/i.test(m)){
        // Firestore 규칙에서 거부됨(로그인 계정과 학생 아이디 형식이 안 맞는 경우 등) — 선생님이 원인을 찾을 수 있게 아이디를 같이 보여줌
        msgEl.textContent='점수 저장이 거부됐어요. 선생님께 이 화면을 보여주세요. (아이디: '+(session.id||'')+' / 로그인: '+(session.authId||'')+')';
      } else {
        msgEl.textContent=m||'이미 오늘 도전한 기록이 있어요.';
      }
    }
  }catch(e){
    document.getElementById('r-msg').textContent='제출 중 오류가 발생했어요('+(e&&e.message||'')+'). 인터넷 연결을 확인하고 다시 시도해주세요.';
  }
}
</script>
