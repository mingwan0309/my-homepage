<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>*{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 — 김민관 수학</title>
<script src="firebase-api.js?v=14"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'맑은 고딕','Apple SD Gothic Neo',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;}
a{text-decoration:none;}

/* ── 상단 네비 ── */
#student-nav{display:none;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;gap:4px;align-items:center;position:sticky;top:0;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;}
#student-nav a{color:#475569;font-size:13px;font-weight:600;text-decoration:none;padding:12px 14px;white-space:nowrap;flex-shrink:0;}
#student-nav a.home-btn{background:#3b6cf7;color:#fff;border-radius:7px;padding:6px 12px;font-size:12px;margin-right:8px;}
#student-nav a.active{color:#3b6cf7;border-bottom:2px solid #3b6cf7;}

/* ── 로그인 필요 ── */
#page-denied{display:none;text-align:center;padding:100px 20px;}

/* ── 메인 ── */
.container{max-width:760px;margin:0 auto;padding:28px 16px 60px;}

/* 프로필 헤더 */
.profile-header{background:linear-gradient(135deg,#1d4ed8,#3b6cf7);border-radius:20px;padding:28px 28px 24px;color:#fff;margin-bottom:24px;display:flex;align-items:center;gap:20px;}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.profile-name{font-size:22px;font-weight:800;margin-bottom:4px;}
.profile-sub{font-size:13px;opacity:.85;}
.profile-badge{display:inline-block;background:rgba(255,255,255,0.2);border-radius:20px;padding:3px 12px;font-size:12px;margin-top:6px;}

/* 바로가기 */
.quick-links{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.quick-btn{flex:1;min-width:140px;text-align:center;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:800;color:#334155;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:.15s;}
.quick-btn:hover{border-color:#3b6cf7;color:#3b6cf7;background:#f8faff;}

/* 탭 */
.tab-nav{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.tab-nav button{flex-shrink:0;padding:9px 18px;border:none;background:#fff;border-radius:10px;font-size:13px;font-weight:700;color:#64748b;cursor:pointer;transition:.15s;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.tab-nav button.active{background:#3b6cf7;color:#fff;}

/* 카드 */
.card{background:#fff;border-radius:16px;padding:22px 20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.card-title{font-size:15px;font-weight:800;color:#1e293b;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.card-title span{font-size:18px;}

/* 정보 그리드 */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-item{background:#f8fafc;border-radius:10px;padding:12px 14px;}
.info-label{font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:4px;text-transform:uppercase;}
.info-value{font-size:14px;font-weight:700;color:#1e293b;}

/* 출결 배지 */
.att-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;}
.att-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.att-출석{background:#dcfce7;color:#16a34a;}
.att-지각{background:#fef9c3;color:#ca8a04;}
.att-결석{background:#fee2e2;color:#dc2626;}
.att-미정{background:#f1f5f9;color:#64748b;}

/* 예약 카드 */
.booking-item{border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.booking-info{flex:1;}
.booking-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.booking-date{font-size:12px;color:#64748b;}
.booking-status{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.status-예약{background:#dbeafe;color:#1d4ed8;}
.status-취소{background:#f1f5f9;color:#94a3b8;text-decoration:line-through;}
.btn-cancel{border:1px solid #fca5a5;color:#dc2626;background:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-cancel:hover{background:#fee2e2;}

/* 퀴즈 기록 */
.quiz-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9;}
.quiz-item:last-child{border-bottom:none;}
.quiz-score-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.score-high{background:#dcfce7;color:#16a34a;}
.score-mid{background:#fef9c3;color:#ca8a04;}
.score-low{background:#fee2e2;color:#dc2626;}
.quiz-title{font-size:13px;font-weight:700;margin-bottom:2px;}
.quiz-date{font-size:11px;color:#94a3b8;}
.quiz-summary{background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-around;text-align:center;}
.quiz-summary-val{font-size:20px;font-weight:800;color:#3b6cf7;}
.quiz-summary-lbl{font-size:11px;color:#94a3b8;margin-top:2px;}

/* 영상 진도 */
.video-item{margin-bottom:14px;}
.video-name{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#3b6cf7,#60a5fa);transition:width .4s;}
.video-meta{font-size:11px;color:#94a3b8;margin-top:3px;}

/* 설정 */
.setting-section{margin-bottom:20px;}
.setting-label{font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;}
.setting-input{width:100%;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit;}
.setting-input:focus{border-color:#3b6cf7;}
.setting-hint{font-size:11px;color:#94a3b8;margin-top:4px;}
.btn-primary{background:#3b6cf7;color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:4px;}
.btn-primary:hover{background:#1d4ed8;}

.empty-msg{text-align:center;padding:32px 0;color:#94a3b8;font-size:13px;}
.spinner{text-align:center;padding:24px 0;color:#94a3b8;font-size:13px;}

/* 강의 자료실 (내 정보 통합) */
.mat-cat-block{margin-bottom:22px;}
.mat-cat-block:last-child{margin-bottom:0;}
.mat-cat-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#334155;margin-bottom:10px;padding-bottom:7px;border-bottom:1.5px solid #f1f5f9;}
.mat-cat-head .cnt{background:#eef2ff;color:#3b6cf7;font-size:11px;font-weight:800;border-radius:20px;padding:1px 9px;}
.mat-file-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #eef2f6;border-radius:11px;margin-bottom:8px;background:#fff;transition:.12s;}
.mat-file-row:hover{border-color:#c7d2fe;background:#f8faff;}
.mat-file-row .ic{font-size:20px;flex-shrink:0;}
.mat-file-row .body{flex:1;min-width:0;}
.mat-file-row .nm{font-size:13.5px;font-weight:700;color:#1e293b;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.mat-file-row .nm:hover{color:#3b6cf7;}
.mat-file-row .sub{font-size:11px;color:#94a3b8;margin-top:2px;}
.mat-file-row .open{flex-shrink:0;background:#3b6cf7;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:7px 14px;text-decoration:none;white-space:nowrap;border:none;cursor:pointer;font-family:inherit;}
.mat-file-row .open:disabled{opacity:.6;cursor:default;}
.mv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.mv-card{border:1px solid #eef2f6;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:.12s;}
.mv-card:hover{border-color:#c7d2fe;box-shadow:0 3px 12px rgba(59,108,247,.1);}
.mv-thumb{position:relative;aspect-ratio:16/9;background:#0f172a;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mv-thumb img{width:100%;height:100%;object-fit:cover;}
.mv-play{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:2px;}
.mv-info{padding:9px 11px;}
.mv-title{font-size:12.5px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mv-badge{display:inline-block;background:#eef2ff;color:#3b6cf7;font-size:10px;font-weight:800;border-radius:5px;padding:1px 7px;margin-top:5px;}
.mv-memo{font-size:11px;color:#94a3b8;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 유튜브 재생 모달 */
.yt-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;}
.yt-modal-bg.show{display:flex;}

@media (max-width:768px){
  .mv-grid{grid-template-columns:1fr;}
}
.msg-box{padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px;display:none;}
.msg-success{background:#dcfce7;color:#16a34a;}
.msg-error{background:#fee2e2;color:#dc2626;}
</style>
</head>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
let session = null;

document.addEventListener('DOMContentLoaded', async function(){
  session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (!session || session.role !== 'student') {
    document.getElementById('page-denied').style.display = 'block';
    return;
  }
  // 상단 네비바는 마이페이지에서 표시하지 않음 (탭/버튼으로 이동)

  // 프로필 헤더 (기본값 먼저)
  document.getElementById('ph-name').textContent = session.name || '—';
  document.getElementById('ph-sub').textContent = session.className ? session.className + ' 수강 중' : '반 미배정';
  document.getElementById('ph-badge').textContent = session.authId && session.authId !== session.id ? '학부모 로그인 중' : '학생 계정';

  document.getElementById('page-main').style.display = 'block';

  // 세션 id가 하이픈 없는 형식이거나 예전 형식이어도, 실제 존재하는 학생 문서를 찾아 교정한다(자가 치유)
  await normalizeSessionId();

loadInfo();
  loadAttendance();
  loadClassMaterials();
});

// 로그인 계정(auth)에 맞는 실제 학생 문서 id를 찾아 session.id 를 교정
function dashPhone(id){
  var d = String(id).replace(/[-\s]/g,'');
  if(/^\d{11}$/.test(d)) return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  if(/^\d{10}$/.test(d)) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return String(id);
}
async function normalizeSessionId(){
  try {
    var db = await window.mkdbReady;
    // 후보: 현재 id, 하이픈 추가, 하이픈 제거 (중복 제거)
    var cands = [];
    [session.id, dashPhone(session.id), String(session.id).replace(/[-\s]/g,'')].forEach(function(c){
      if (c && cands.indexOf(c) < 0) cands.push(c);
    });
    for (var i=0;i<cands.length;i++){
      try {
        var d = await db.collection('students').doc(cands[i]).get();
        if (d.exists) {
          if (cands[i] !== session.id) {
            session.id = cands[i];
            localStorage.setItem('mkmath_session', JSON.stringify(session));
          }
          return;
        }

// ── 자료 다운로드 (워터마크 단계 적용) ──
function base64ToBytes(b64){
  var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
  for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function extractDriveId(url){
  if(!url) return '';
  var m=url.match(/\/d\/([^\/]+)/)||url.match(/[?&]id=([^&]+)/);
  return m?m[1]:'';
}
function triggerDownload(blob, filename){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename||'file';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function wmPositions(level, W, H, w, h){
  var pos=[];
  if(level==='1'){
    [H-h-36, 30].forEach(function(yy){ for(var x=24;x<W-40;x+=200) pos.push({x:x,y:yy}); });
  } else if(level==='2'){
    for(var y=70;y<H-40;y+=210){ for(var x=10;x<W-40;x+=230) pos.push({x:x,y:y}); }
  } else {
    for(var y=-20;y<H+90;y+=150){ for(var x=-20;x<W+90;x+=175) pos.push({x:x,y:y}); }
  }
  return pos;
}
var _logoBytes=null;
async function getLogoBytes(){
  if(_logoBytes) return _logoBytes;
  var res=await fetch('logo.png');
  _logoBytes=await res.arrayBuffer();
  return _logoBytes;
}
async function applyWatermark(bytes, level, name){
  if(!level || level==='0' || !window.PDFLib) return bytes;
  if(!/\.pdf$/i.test(name||'')) return bytes;
  try{
    var op = level==='1'?0.16 : level==='2'?0.13 : 0.11;
    var pdfDoc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
    var png=await pdfDoc.embedPng(await getLogoBytes());
    var pages=pdfDoc.getPages();
    for(var p=0;p<pages.length;p++){
      var page=pages[p], sz=page.getSize();
      var w=130, h=w*png.height/png.width;
      wmPositions(level, sz.width, sz.height, w, h).forEach(function(pt){
        page.drawImage(png,{x:pt.x,y:pt.y,width:w,height:h,opacity:op,rotate:PDFLib.degrees(30)});
      });
    }
    return await pdfDoc.save();
  }catch(e){ return bytes; }
}
async function downloadMat(id){
  var m=matList.find(function(x){return x.id===id;});
  if(!m) return;
  var btn=document.getElementById('dlbtn-'+id);
  var fileId=extractDriveId(m.url);
  if(!fileId){ window.open(m.url,'_blank'); return; }
  if(btn){ btn.disabled=true; btn.textContent='받는 중...'; }
  try{
    var res=await fetch(SU,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getFileBase64',fileId:fileId})});
    var d=await res.json();
    if(!d.success){ window.open(m.url,'_blank'); return; }
    var bytes=base64ToBytes(d.base64);
    var out=await applyWatermark(bytes, m.wmLevel, d.name||m.name);
    triggerDownload(new Blob([out],{type:d.mimeType||'application/pdf'}), d.name||m.name);
    fetch(SU+'?action=incDownload&id='+encodeURIComponent(id));
    markViewed(id, 100);
  }catch(e){ window.open(m.url,'_blank'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='다운로드'; } }
}

var ytApiPromise=null;
function loadYtApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise=new Promise(function(resolve){
    if(window.YT&&window.YT.Player){resolve();return;}
    window.onYouTubeIframeAPIReady=function(){resolve();};
    var s=document.createElement('script');
    s.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytApiPromise;
}
var ytPlayer=null, ytProgressTimer=null, ytWatchingMatId=null, ytMaxPct=0, ytReady=false;
var YT_SPEEDS=[0.8,0.9,1.0,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,2.0];
var ytSpeedIdx=2;
function openVideo(url,id){
  var vid=ytId(url);
  if(vid){
    ytWatchingMatId=id; ytMaxPct=0; ytReady=false; ytSpeedIdx=2;
    document.getElementById('yt-speed-btn').textContent='1.0x';
    document.getElementById('yt-seek-fill').style.width='0%';
    document.getElementById('yt-player-iframe').src='https://www.youtube.com/embed/'+vid+'?autoplay=1&modestbranding=1&rel=0&controls=0&cc_load_policy=0&cc_lang_pref=none&enablejsapi=1&origin='+encodeURIComponent(location.origin);
    document.getElementById('yt-player-modal').classList.add('show');
    markViewed(id, 0);
    loadYtApi().then(function(){
      ytPlayer=new YT.Player('yt-player-iframe',{ events:{
        onReady:function(e){ ytReady=true; try{ e.target.unloadModule('captions'); e.target.unloadModule('cc'); }catch(err){} },
        onStateChange:function(e){ try{ e.target.unloadModule('captions'); e.target.unloadModule('cc'); }catch(err){} }
      } });
      ytProgressTimer=setInterval(function(){
        try{
          if(!ytPlayer||!ytPlayer.getDuration) return;
          var dur=ytPlayer.getDuration(), cur=ytPlayer.getCurrentTime();
          if(dur>0){
            var pct=Math.min(100, Math.round(cur/dur*100));
            document.getElementById('yt-seek-fill').style.width=pct+'%';
            if(pct>ytMaxPct){ ytMaxPct=pct; markViewed(ytWatchingMatId, pct); }
          }
        }catch(e){}
      }, 1000);
    });
  } else {
    window.open(url,'_blank');
  }
}
function closeYtModal(){
  if(document.fullscreenElement) document.exitFullscreen();
  if(ytProgressTimer){clearInterval(ytProgressTimer);ytProgressTimer=null;}
  if(ytPlayer&&ytWatchingMatId){
    try{
      var dur=ytPlayer.getDuration(), cur=ytPlayer.getCurrentTime();
      if(dur>0){
        var pct=Math.min(100, Math.round(cur/dur*100));
        if(pct>ytMaxPct) markViewed(ytWatchingMatId, pct);
      }
    }catch(e){}
  }
  ytPlayer=null; ytWatchingMatId=null; ytReady=false;
  document.getElementById('yt-player-iframe').src='';
  document.getElementById('yt-player-modal').classList.remove('show');
}
function toggleYtPlay(){
  if(!ytPlayer||!ytReady) return;
  try{
    var state=ytPlayer.getPlayerState();
    if(state===1) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  }catch(e){}
}
function seekYt(e){
  if(!ytPlayer||!ytReady) return;
  e.stopPropagation();
  try{
    var bar=document.getElementById('yt-seek-bar');
    var rect=bar.getBoundingClientRect();
    var frac=Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
    var dur=ytPlayer.getDuration();
    if(dur>0){ ytPlayer.seekTo(dur*frac,true); document.getElementById('yt-seek-fill').style.width=(frac*100)+'%'; }
  }catch(e){}
}
function cycleYtSpeed(e){
  e.stopPropagation();
  if(!ytPlayer||!ytReady) return;
  ytSpeedIdx=(ytSpeedIdx+1)%YT_SPEEDS.length;
  var rate=YT_SPEEDS[ytSpeedIdx];
  try{ ytPlayer.setPlaybackRate(rate); }catch(err){}
  document.getElementById('yt-speed-btn').textContent=rate.toFixed(1)+'x';
}
function toggleYtFullscreen(){
  var wrap=document.getElementById('yt-player-wrap');
  if(!document.fullscreenElement) wrap.requestFullscreen();
  else document.exitFullscreen();
}

    document.getElementById('qna-list').innerHTML = '<div class="empty-msg">불러오기 실패</div>';
  }
}

// ── 비밀번호 변경 ──
async function changePw() {
  var oldPw = document.getElementById('old-pw').value;
  var newPw = document.getElementById('new-pw').value;
  var msgEl = document.getElementById('pw-msg');
  msgEl.style.display = 'none';
  if (!oldPw || !newPw) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }
  if (newPw.length < 6) { showMsg(msgEl, '새 비밀번호는 6자 이상이어야 합니다', 'error'); return; }
  try {
    var authId = session.authId || session.id;
    var res = await fetch(SU + '?action=changePassword&id=' + encodeURIComponent(session.id)
      + '&authId=' + encodeURIComponent(authId)
      + '&oldPassword=' + encodeURIComponent(oldPw)
      + '&newPassword=' + encodeURIComponent(newPw));
    var data = await res.json();
    if (data.success) {
      showMsg(msgEl, '✅ 비밀번호가 변경되었습니다!', 'success');
      document.getElementById('old-pw').value = '';
      document.getElementById('new-pw').value = '';
    } else {
      showMsg(msgEl, data.msg || '현재 비밀번호가 틀렸습니다', 'error');
    }
  } catch(e) {
    showMsg(msgEl, '오류가 발생했습니다', 'error');
  }
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg-box msg-' + type;
  el.style.display = 'block';
}

function doLogout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem('mkmath_session');
  try { firebase.auth().signOut(); } catch(e) {}
  location.href = 'index.html';
}
</script>
