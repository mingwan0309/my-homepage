<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>로그인 | 김민관 수학</title>
<script src="firebase-api.js?v=18"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;}
  body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .wrap{width:100%;max-width:380px;}
  .logo{text-align:center;margin-bottom:22px;}
  .logo img{width:96px;}
  h1{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px;}
  .sub{color:#64748b;font-size:13.5px;text-align:center;margin-bottom:26px;}
  .card{background:#fff;border-radius:16px;padding:26px 24px;box-shadow:0 2px 14px rgba(0,0,0,.07);}
  label{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:6px;}
  input{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px;outline:none;margin-bottom:16px;font-family:inherit;}
  input:focus{border-color:#2563eb;}
  .remember{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b;margin-top:-4px;margin-bottom:16px;cursor:pointer;}
  .remember input{width:auto;margin:0;padding:0;min-height:auto;}
  .btn{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px;}
  .btn:hover{background:#1d4ed8;}
  .btn:disabled{background:#94a3b8;cursor:default;}
  .msg{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;display:none;}
  .msg.error{background:#fef2f2;color:#dc2626;display:block;}
  .home-link{display:block;text-align:center;margin-top:18px;color:#94a3b8;font-size:12.5px;}
  @media (max-width:480px){
    .card{padding:22px 18px;}
    h1{font-size:20px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png" alt="로고"></div>
  <h1>김민관 수학</h1>
  <p class="sub">아이디와 비밀번호를 입력해주세요</p>
  <div class="card">
    <div id="login-msg" class="msg"></div>
    <label>아이디</label>
    <input type="text" id="login-id" placeholder="아이디 입력" autocomplete="username">
    <label>비밀번호</label>
    <input type="password" id="login-pw" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <label class="remember"><input type="checkbox" id="remember-me"> 로그인 정보 저장</label>
    <button class="btn" id="login-btn" onclick="login()">로그인</button>
  </div>
  <a href="index.html" class="home-link">← 홈페이지로 돌아가기</a>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';

function showMsg(el, text, type){
  el.textContent = text;
  el.className = 'msg' + (type ? ' ' + type : '');
}

document.addEventListener('DOMContentLoaded', function(){
  var saved = JSON.parse(localStorage.getItem('saved_login') || 'null');
  if (saved) {
    document.getElementById('login-id').value = saved.id || '';
    document.getElementById('login-pw').value = saved.pw || '';
    document.getElementById('remember-me').checked = true;
  }

  var session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (session) { goByRole(session); }
});

function goByRole(data){
  var returnUrl = localStorage.getItem('mkmath_return');
  if (returnUrl) {
    localStorage.removeItem('mkmath_return');
    location.replace(returnUrl);
    return;
  }
  if (data.role === 'teacher' || data.role === 'assistant') {
    location.replace('admin.html');
  } else {
    location.replace('mypage.html');
  }
}

async function login(){
  var id = document.getElementById('login-id').value.trim();
  var pw = document.getElementById('login-pw').value;
  var remember = document.getElementById('remember-me').checked;
  var msgEl = document.getElementById('login-msg');
  if (!id || !pw) { showMsg(msgEl, '아이디와 비밀번호를 입력하세요', 'error'); return; }

  var btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    var res = await fetch(SCRIPT_URL + '?action=login&id=' + encodeURIComponent(id) + '&password=' + encodeURIComponent(pw));
    var data = await res.json();
    if (data.success) {
      if (remember) localStorage.setItem('saved_login', JSON.stringify({ id: id, pw: pw }));
      else localStorage.removeItem('saved_login');

      var sessionId = data.studentId || id;
      var session = { id: sessionId, authId: id, role: data.role, name: data.name, classId: data.classId || '', className: data.className || '', studentIds: data.studentIds || [] };
      localStorage.setItem('mkmath_session', JSON.stringify(session));
      if (data.role === 'assistant' && window.mkClockIn) window.mkClockIn({ id: sessionId, name: data.name });
      goByRole(session);
    } else {
      showMsg(msgEl, '아이디 또는 비밀번호가 틀렸습니다', 'error');
      btn.disabled = false; btn.textContent = '로그인';
    }
  } catch(e) {
    showMsg(msgEl, '연결 오류가 발생했습니다', 'error');
    btn.disabled = false; btn.textContent = '로그인';
  }
}
</script>
</body>
</html>
