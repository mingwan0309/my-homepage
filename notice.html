<!DOCTYPE html>
<!-- v2 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | 김민관 수학</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --text: #1e293b;
    --text-sub: #64748b;
    --border: #e2e8f0;
    --bg: #f8fafc;
  }
  body { font-family: 'Nanum Gothic', '맑은 고딕', sans-serif; color: var(--text); background: var(--bg); }

  /* TOPBAR */
  .topbar { background:#1e293b; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .topbar-logo { font-size:15px; font-weight:900; }
  .topbar-logo span { color:#60a5fa; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .btn-topbar-home { background:#334155; color:#fff; border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }

  /* PAGE HEADER */
  .page-header {
    margin-top: 0;
    background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    padding: 56px 56px 48px;
  }
  .page-header h1 { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .page-header p { font-size: 15px; color: rgba(255,255,255,0.6); }

  /* CONTENT */
  .content { max-width: 860px; margin: 0 auto; padding: 48px 24px 80px; }

  /* TABS */
  .tabs { display: flex; gap: 8px; margin-bottom: 32px; border-bottom: 2px solid var(--border); }
  .tab {
    padding: 12px 24px; font-size: 15px; font-weight: 700;
    color: var(--text-sub); cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
    background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: var(--primary); }

  /* NOTICE LIST */
  .notice-list { display: none; }
  .notice-list.active { display: block; }
  .notice-item {
    display: flex; align-items: center; gap: 16px;
    padding: 22px 0; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
    text-decoration: none; color: var(--text);
  }
  .notice-item:hover { background: #f1f5f9; margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 8px; }
  .notice-badge {
    font-size: 11px; font-weight: 800; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-notice { background: #dbeafe; color: var(--primary); }
  .badge-faq { background: #dcfce7; color: #16a34a; }
  .badge-new { background: #fee2e2; color: #dc2626; }
  .notice-title { font-size: 15px; font-weight: 700; flex: 1; }
  .notice-date { font-size: 13px; color: #94a3b8; white-space: nowrap; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px;
    width: 95%; max-width: 900px;
    max-height: 85vh; overflow-y: auto;
    padding: 40px; position: relative;
  }
  .modal-close {
    position: absolute; top: 20px; right: 24px;
    font-size: 24px; cursor: pointer; color: #94a3b8;
    background: none; border: none;
  }
  .modal-badge { margin-bottom: 14px; }
  .modal h2 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  .modal-date { font-size: 13px; color: #94a3b8; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .modal-body { font-size: 15px; line-height: 1.9; color: var(--text-sub); white-space: pre-line; }
  .schedule-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; table-layout: fixed; }
  .schedule-table th, .schedule-table td { border: 1px solid #e2e8f0; padding: 12px 14px; vertical-align: middle; line-height: 1.8; word-break: keep-all; }
  .schedule-table th { background: #eff6ff; color: var(--primary); font-weight: 800; text-align: center; white-space: nowrap; }
  .schedule-table td:first-child { font-weight: 800; text-align: center; background: #f8fafc; width: 130px; }
  .schedule-table td:nth-child(2) { text-align: center; width: 60px; }
  .schedule-table td:nth-child(3) { text-align: center; width: 70px; }
  .schedule-table td:nth-child(4) { text-align: center; width: 100px; white-space: nowrap; }
  .schedule-table td:nth-child(5) { width: auto; }
  .schedule-table td:nth-child(6) { text-align: center; width: 80px; }
  .schedule-table ul { padding-left: 16px; margin: 0; }
  .schedule-table li { margin-bottom: 4px; }
  .common-box { margin-top: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px 20px; font-size: 14px; line-height: 1.9; color: var(--text-sub); white-space: pre-line; }
  .modal-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
  .modal-tab {
    padding: 10px 28px; font-size: 15px; font-weight: 700;
    color: #94a3b8; cursor: pointer; background: none;
    border: none; border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .modal-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .modal-tab-content { display: none; }
  .modal-tab-content.active { display: block; }

  /* EMPTY */
  .empty { text-align: center; padding: 64px 0; color: #94a3b8; font-size: 15px; }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .nav-menu { display: none; }
    .page-header { padding: 40px 24px 32px; }
    .page-header h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">김민관 <span>수학</span></div>
  <div class="topbar-right">
    <a href="index.html" class="btn-topbar-home">🏠 홈</a>
  </div>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <h1>공지사항</h1>
  <p>김민관 수학의 최신 공지와 자주 묻는 질문을 확인하세요.</p>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="tabs">
    <button class="tab active" onclick="showTab('notice')">공지사항</button>
    <button class="tab" onclick="showTab('faq')">자주 묻는 질문</button>
  </div>

  <!-- 공지사항 -->
  <div class="notice-list active" id="tab-notice">
    <div class="empty">등록된 공지사항이 없습니다.</div>
  </div>

  <!-- FAQ -->
  <div class="notice-list" id="tab-faq"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-badge" id="modal-badge"></div>
    <h2 id="modal-title"></h2>
    <p class="modal-date" id="modal-date"></p>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="faq-data.js"></script>
<script>
  const contents = {
    n1: {

      title: '시간표 안내',

    },
    n2: {
      badge: '<span class="notice-badge badge-notice">공지</span>',
      title: '여름방학 특강 신청 안내',
      date: '2026-05-20',
      html: `
        <table class="schedule-table">
          <thead>
            <tr>
              <th>특강명</th>
              <th>강사</th>
              <th>요일</th>
              <th>시간</th>
              <th>내용</th>
              <th>기간</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>소수 개별 수학캠프<br>개별 진도반</td>
              <td style="text-align:center;">김민관</td>
              <td style="text-align:center;">월·수·금</td>
              <td style="text-align:center;">10:00~1:00</td>
              <td>
                <ul>
                  <li>대상 : 무학년제</li>
                  <li>교재 : 개별교재</li>
                  <li>회차 : 12회</li>
                </ul>
              </td>
              <td style="text-align:center; white-space:nowrap;">7/20(월)<br>~<br>8/14(금)</td>
            </tr>
            <tr>
              <td>대수</td>
              <td style="text-align:center;">김민관</td>
              <td style="text-align:center;">월·수·금</td>
              <td style="text-align:center;">1:00~3:30</td>
              <td>
                <ul>
                  <li>대상 : 무학년제 - 대수 완벽한 개념 학습 희망 학생</li>
                  <li>교재 : 자체교재</li>
                  <li>회차 : 12회</li>
                </ul>
              </td>
              <td style="text-align:center; white-space:nowrap;">7/20(월)<br>~<br>8/14(금)</td>
            </tr>
            <tr>
              <td>확통</td>
              <td style="text-align:center;">김민관</td>
              <td style="text-align:center;">목</td>
              <td style="text-align:center;">1:00~4:00</td>
              <td>
                <ul>
                  <li>대상 : 무학년제 - 확통 과목 개념 학습 희망 학생</li>
                  <li>교재 : 자체교재</li>
                  <li>회차 : 4회</li>
                </ul>
              </td>
              <td style="text-align:center; white-space:nowrap;">7/23(목)<br>~<br>8/13(목)</td>
            </tr>
            <tr>
              <td>기하</td>
              <td style="text-align:center;">김민관</td>
              <td style="text-align:center;">목</td>
              <td style="text-align:center;">4:00~7:00</td>
              <td>
                <ul>
                  <li>대상 : 무학년제 - 기하 과목 개념 학습 희망 학생</li>
                  <li>교재 : 자체교재</li>
                  <li>회차 : 4회</li>
                </ul>
              </td>
              <td style="text-align:center; white-space:nowrap;">7/23(목)<br>~<br>8/13(목)</td>
            </tr>
          </tbody>
        </table>
        <div class="common-box">📞 신청 문의 : 카카오톡으로 문의 / 카카오톡 채널</div>
      `
    },
    n3: {
      badge: '<span class="notice-badge badge-notice">공지</span>',
      title: '6월 클리닉 시간표 변경 안내',
      date: '2026-05-15',
      body: '6월 클리닉 시간표가 변경됩니다.\n\n자세한 내용은 카카오톡 채널 또는 전화(카카오톡으로 문의)로 문의해 주세요.'
    },
    n4: {
      badge: '<span class="notice-badge badge-notice">공지</span>',
      title: '2026 수능 대비 커리큘럼 공개',
      date: '2026-03-10',
      body: '2026 수능 대비 커리큘럼을 공개합니다.\n\n자세한 내용은 카카오톡 채널 또는 전화(카카오톡으로 문의)로 문의해 주세요.'
    },
    n5: {
      badge: '<span class="notice-badge badge-notice">공지</span>',
      title: '줌 독서실 운영 안내',
      date: '2026-02-01',
      body: '시험기간 줌 독서실을 운영합니다. 혼자 공부할 때 집중이 어렵다면 활용해 보세요.\n\n자세한 내용은 카카오톡 채널 또는 전화(카카오톡으로 문의)로 문의해 주세요.'
    },
    ...faqData,
  };

  function switchModalTab(btn, name) {
    document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.modal-tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const el = document.getElementById('modal-tab-' + name);
    if (el) el.classList.add('active');
  }

  // FAQ 목록 자동 렌더링
  (function renderFaq() {
    const container = document.getElementById('tab-faq');
    ['f1','f2','f3','f4'].forEach(function(id) {
      const d = faqData[id];
      if (!d) return;
      const div = document.createElement('div');
      div.className = 'notice-item';
      div.setAttribute('onclick', "openModal('" + id + "')");
      div.innerHTML = '<span class="notice-badge badge-faq">FAQ</span><span class="notice-title">' + d.title + '</span><span class="notice-date">FAQ</span>';
      container.appendChild(div);
    });
  })();

  // URL에 ?tab=faq 있으면 FAQ 탭 자동 활성화
  if (new URLSearchParams(window.location.search).get('tab') === 'faq') {
    document.querySelectorAll('.notice-list').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-faq').classList.add('active');
    document.querySelectorAll('.tab')[1].classList.add('active');
  }

  function showTab(tab) {
    document.querySelectorAll('.notice-list').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    event.target.classList.add('active');
  }

  function openModal(id) {
    const c = contents[id];
    document.getElementById('modal-badge').innerHTML = c.badge;
    document.getElementById('modal-title').textContent = c.title;
    document.getElementById('modal-date').textContent = c.date;
    const body = document.getElementById('modal-body');
    if (c.html) {
      body.style.whiteSpace = 'normal';
      body.innerHTML = c.html;
    } else {
      body.style.whiteSpace = 'pre-line';
      body.textContent = c.body;
    }
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('open');
    }
  }

  function closeModalDirect() {
    document.getElementById('modal-overlay').classList.remove('open');
  }
</script>
</body>
</html>
