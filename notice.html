<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --text: #1e293b;
    --text-sub: #64748b;
    --border: #e2e8f0;

  body { font-family: 'Nanum Gothic', '맑은 고딕', sans-serif; color: var(--text); background: var(--bg); }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: #fff; border-bottom: 1px solid var(--border);
    height: 62px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px; position: relative;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .nav-logo { font-size: 20px; font-weight: 900; color: #111; text-decoration: none; letter-spacing: -0.5px; }
  .nav-logo span { color: #111; }
  .nav-menu { display: flex; gap: 36px; list-style: none; position: absolute; left: 50%; transform: translateX(-50%); }
  .nav-menu a { text-decoration: none; font-size: 15px; font-weight: 600; color: #475569; transition: color 0.2s; }
  .nav-menu a:hover, .nav-menu a.active { color: var(--primary); }
  .nav-cta {
    background: var(--primary); color: #fff;
    padding: 9px 22px; border-radius: 8px;
    font-size: 14px; font-weight: 700; text-decoration: none;
  }

  /* PAGE HEADER */
  .page-header {
    margin-top: 62px;
    background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    padding: 56px 56px 48px;
  }
  .page-header h1 { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .page-header p { font-size: 15px; color: rgba(255,255,255,0.6); }

  /* CONTENT */
  .content { max-width: 860px; margin: 0 auto; padding: 48px 24px 80px; }

  /* TABS */
  .tabs { display: flex; gap: 8px; margin-bottom: 32px; border-bottom: 2px solid var(--border); }
  .tab {
    padding: 12px 24px; font-size: 15px; font-weight: 700;
    color: var(--text-sub); cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
    background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: var(--primary); }

  /* NOTICE LIST */
  .notice-list { display: none; }
  .notice-list.active { display: block; }
  .notice-item {
    display: flex; align-items: center; gap: 16px;
    padding: 22px 0; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
    text-decoration: none; color: var(--text);
  }
  .notice-item:hover { background: #f1f5f9; margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 8px; }
  .notice-badge {
    font-size: 11px; font-weight: 800; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-notice { background: #dbeafe; color: var(--primary); }
  .badge-faq { background: #dcfce7; color: #16a34a; }
  .badge-new { background: #fee2e2; color: #dc2626; }
  .notice-title { font-size: 15px; font-weight: 700; flex: 1; }
  .notice-date { font-size: 13px; color: #94a3b8; white-space: nowrap; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px;
    width: 95%; max-width: 900px;
    max-height: 85vh; overflow-y: auto;
    padding: 40px; position: relative;
  }
  .modal-close {
    position: absolute; top: 20px; right: 24px;
    font-size: 24px; cursor: pointer; color: #94a3b8;
    background: none; border: none;
  }
  .modal-badge { margin-bottom: 14px; }
  .modal h2 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  .modal-date { font-size: 13px; color: #94a3b8; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .modal-body { font-size: 15px; line-height: 1.9; color: var(--text-sub); white-space: pre-line; }
  .schedule-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; table-layout: fixed; }
  .schedule-table th, .schedule-table td { border: 1px solid #e2e8f0; padding: 12px 14px; vertical-align: middle; line-height: 1.8; word-break: keep-all; }
  .schedule-table th { background: #eff6ff; color: var(--primary); font-weight: 800; text-align: center; white-space: nowrap; }
  .schedule-table td:first-child { font-weight: 800; text-align: center; background: #f8fafc; width: 130px; }
  .schedule-table td:nth-child(2) { text-align: center; width: 60px; }
  .schedule-table td:nth-child(3) { text-align: center; width: 70px; }
  .schedule-table td:nth-child(4) { text-align: center; width: 100px; white-space: nowrap; }
  .schedule-table td:nth-child(5) { width: auto; }
  .schedule-table td:nth-child(6) { text-align: center; width: 80px; }
  .schedule-table ul { padding-left: 16px; margin: 0; }
  .schedule-table li { margin-bottom: 4px; }
  .common-box { margin-top: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px 20px; font-size: 14px; line-height: 1.9; color: var(--text-sub); white-space: pre-line; }
  .modal-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
  .modal-tab {
    padding: 10px 28px; font-size: 15px; font-weight: 700;
    color: #94a3b8; cursor: pointer; background: none;
    border: none; border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .modal-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .modal-tab-content { display: none; }
  .modal-tab-content.active { display: block; }

  /* EMPTY */
  .empty { text-align: center; padding: 64px 0; color: #94a3b8; font-size: 15px; }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .nav-menu { display: none; }
    .page-header { padding: 40px 24px 32px; }
    .page-header h1 { font-size: 26px; }
  }
</style>
</head>

  function switchModalTab(btn, name) {
    document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.modal-tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const el = document.getElementById('modal-tab-' + name);
    if (el) el.classList.add('active');
  }

  function showTab(tab) {
    document.querySelectorAll('.notice-list').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    event.target.classList.add('active');
  }

    const c = contents[id];
    document.getElementById('modal-badge').innerHTML = c.badge;
    document.getElementById('modal-title').textContent = c.title;
    document.getElementById('modal-date').textContent = c.date;
    const body = document.getElementById('modal-body');
    if (c.html) {
      body.style.whiteSpace = 'normal';
      body.innerHTML = c.html;
    } else {
      body.style.whiteSpace = 'pre-line';
      body.textContent = c.body;
    }
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('open');
    }
  }

  function closeModalDirect() {
    document.getElementById('modal-overlay').classList.remove('open');
  }
</script>
</body>
</html>
