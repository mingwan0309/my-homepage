<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 — 밍기적 수학연구소</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background:#f8fafc; color:#1e293b; }
  .topbar { background:#1e293b; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .topbar-logo { font-size:15px; font-weight:900; }
  .topbar-logo span { color:#60a5fa; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .btn-topbar-home { background:#334155; color:#fff; border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
  .page-header {
    background: #1e293b;
    color: #fff; padding: 24px 56px;
  }
  .page-header h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
  .page-header p { font-size: 15px; opacity: 0.85; }
  .content { max-width: 800px; margin: 48px auto; padding: 0 24px; }
  .empty { text-align:center; color:#94a3b8; font-size:15px; padding: 80px 0; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" style="cursor:pointer;"><img src="logo.png" alt="로고" style="height:32px;width:auto;display:block;"></a>
  <div class="topbar-right">
    <a href="index.html" class="btn-topbar-home">🏠 홈</a>
  </div>
</div>

<div class="page-header">
  <h1>📂 자료실</h1>
  <p>수업 자료를 확인하세요.</p>
</div>

<div class="content">
  <div class="empty">자료가 없습니다.</div>
</div>

</body>
</html>
