<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 — 밍기적 수학연구소</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background:#f8fafc; color:#1e293b; }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px; height: 64px; background: #fff;
    border-bottom: 1px solid #e2e8f0; position: sticky; top:0; z-index:100;
  }
  .nav-logo img { height: 36px; }
  .nav-back {
    background: #f1f5f9; color: #1e293b; border: 1.5px solid #e2e8f0;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .page-header {
    background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    color: #fff; padding: 48px 56px 40px;
  }
  .page-header h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
  .page-header p { font-size: 15px; opacity: 0.85; }
  .content { max-width: 800px; margin: 48px auto; padding: 0 24px; }
  .empty { text-align:center; color:#94a3b8; font-size:15px; padding: 80px 0; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><img src="logo.png" alt="로고"></a>
  <a href="index.html" class="nav-back">← 홈으로</a>
</nav>

<div class="page-header">
  <h1>📂 자료실</h1>
  <p>수업 자료를 확인하세요.</p>
</div>

<div class="content">
  <div class="empty">자료가 없습니다.</div>
</div>

</body>
</html>
