<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>*{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 | 김민관 수학</title>
<script src="firebase-api.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: '맑은 고딕', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { width: 90%; max-width: 440px; }
  .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 900; }
  .card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 16px; }
  input:focus { border-color: #2563eb; }
  .btn { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-top: 12px; }
  .msg.error { background: #fef2f2; color: #dc2626; }
  .msg.success { background: #f0fdf4; color: #16a34a; }
  .btn-back { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; text-decoration: none; }
  .denied { text-align: center; }
  .denied h2 { font-size: 20px; font-weight: 800; color: #dc2626; margin-bottom: 10px; }
  .denied p { font-size: 14px; color: #64748b; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">

  <div id="page-denied" style="display:none;" class="denied">
    <h2>접근 권한이 없습니다</h2>
    <p>선생님 계정으로 로그인 후 이용해주세요.</p>
    <a href="homework.html" style="background:#2563eb;color:#fff;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px;">로그인하러 가기</a>
  </div>

  <div id="page-main" style="display:none;">
    <div class="nav-bar">
      <h1>🔑 비밀번호 변경</h1>
      <a href="admin.html" class="btn-back">← 관리 페이지</a>
    </div>
    <div class="card">
      <label>현재 비밀번호</label>
      <input type="password" id="old-pw" placeholder="현재 비밀번호">
      <label>새 비밀번호</label>
      <input type="password" id="new-pw" placeholder="새 비밀번호">
      <button class="btn" onclick="changePassword()">변경</button>
      <div id="pw-msg"></div>
    </div>
  </div>

</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
let currentUser = null;

window.addEventListener('DOMContentLoaded', function() {
  const session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (!session || session.role !== 'teacher') {
    document.getElementById('page-denied').style.display = 'block';
  } else {
    currentUser = session;
    document.getElementById('page-main').style.display = 'block';
  }
});

async function changePassword() {
  const oldPw = document.getElementById('old-pw').value;
  const newPw = document.getElementById('new-pw').value;
  const msgEl = document.getElementById('pw-msg');
  if (!oldPw || !newPw) { showMsg(msgEl, '모두 입력해주세요', 'error'); return; }
  try {
    const authId = currentUser.authId || currentUser.id;
    const res = await fetch(`${SCRIPT_URL}?action=changePassword&id=${encodeURIComponent(currentUser.id)}&authId=${encodeURIComponent(authId)}&oldPassword=${encodeURIComponent(oldPw)}&newPassword=${encodeURIComponent(newPw)}`);
    const data = await res.json();
    showMsg(msgEl, data.success ? '변경되었습니다!' : '현재 비밀번호가 틀렸습니다', data.success ? 'success' : 'error');
    if (data.success) { document.getElementById('old-pw').value = ''; document.getElementById('new-pw').value = ''; }
  } catch(e) { showMsg(msgEl, '오류가 발생했습니다', 'error'); }
}

function showMsg(el, text, type) {
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}
</script>
</body>
</html>
