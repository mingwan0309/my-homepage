<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클리닉 설정 | 김민관 수학 관리자</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'맑은 고딕',sans-serif; background:#f1f5f9; color:#1e293b; min-height:100vh; }
.topbar { background:#1e293b; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
.topbar-logo { font-size:15px; font-weight:900; }
.topbar-logo span { color:#60a5fa; }
.btn-home { background:#334155; color:#fff; border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }

.container { max-width:700px; margin:0 auto; padding:32px 20px; }
.page-title { font-size:22px; font-weight:900; margin-bottom:6px; }
.page-sub { font-size:13px; color:#64748b; margin-bottom:28px; }

/* 클리닉 목록 */
.clinic-item { background:#fff; border-radius:14px; padding:20px 22px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
.clinic-item-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.clinic-item-name { font-size:16px; font-weight:800; }
.clinic-item-loc { font-size:12px; color:#64748b; margin-bottom:10px; }
.clinic-btns { display:flex; gap:8px; }
.btn-edit { background:#eff6ff; color:#2563eb; border:1.5px solid #bfdbfe; padding:7px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
.btn-del { background:#fef2f2; color:#dc2626; border:1.5px solid #fecaca; padding:7px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
.btn-new { background:#2563eb; color:#fff; border:none; padding:11px 20px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:20px; }
.btn-new:hover { background:#1d4ed8; }

.schedule-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.day-chip { padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.day-chip.on { background:#eff6ff; color:#2563eb; }
.day-chip.off { background:#f1f5f9; color:#94a3b8; }

/* 모달 */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:18px; padding:28px; width:92%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.15); }
.modal-title { font-size:18px; font-weight:900; margin-bottom:20px; }

.form-row { margin-bottom:16px; }
.form-label { font-size:12px; font-weight:700; color:#475569; margin-bottom:6px; display:block; }
.form-input { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; }
.form-input:focus { outline:none; border-color:#3b82f6; }

/* 요일 설정 */
.day-rows { border:1.5px solid #e2e8f0; border-radius:10px; overflow:hidden; }
.day-row { display:flex; align-items:center; padding:13px 16px; border-bottom:1px solid #f1f5f9; gap:12px; }
.day-row:last-child { border-bottom:none; }
.day-toggle { position:relative; width:38px; height:22px; flex-shrink:0; }
.day-toggle input { opacity:0; width:0; height:0; }
.toggle-track { position:absolute; inset:0; background:#e2e8f0; border-radius:11px; cursor:pointer; transition:0.2s; }
.day-toggle input:checked + .toggle-track { background:#2563eb; }
.toggle-thumb { position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:0.2s; }
.day-toggle input:checked + .toggle-track .toggle-thumb { transform:translateX(16px); }
.day-name { font-size:14px; font-weight:700; width:28px; flex-shrink:0; }
.time-inputs { display:flex; align-items:center; gap:8px; flex:1; }
.time-inputs.disabled { opacity:0.35; pointer-events:none; }
.time-sel { border:1.5px solid #e2e8f0; border-radius:7px; padding:7px 10px; font-size:13px; font-family:inherit; background:#fff; cursor:pointer; }
.time-sep { font-size:13px; color:#94a3b8; }

.modal-btns { display:flex; gap:10px; margin-top:24px; }
.modal-btns button { flex:1; padding:12px; border:none; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-ok { background:#2563eb; color:#fff; }
.btn-ok:hover { background:#1d4ed8; }
.btn-cl { background:#f1f5f9; color:#64748b; }

.spinner { text-align:center; padding:40px; color:#94a3b8; }
.empty { text-align:center; padding:40px; color:#94a3b8; font-size:14px; }

.interval-row { display:flex; align-items:center; gap:10px; }
.interval-sel { border:1.5px solid #e2e8f0; border-radius:8px; padding:9px 12px; font-size:14px; font-family:inherit; background:#fff; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" style="cursor:pointer;"><img src="logo.png" alt="로고" style="height:32px;width:auto;display:block;"></a><span style="color:#94a3b8;font-size:13px;margin-left:8px;">· 클리닉 설정</span>
  <a href="admin.html" class="btn-home">← 관리자 홈</a>
</div>

<div class="container">
  <div class="page-title">클리닉 설정</div>
  <div class="page-sub">요일별 가능 시간을 설정하면 학생 화면에 자동으로 날짜별 캘린더가 생성됩니다.</div>

  <button class="btn-new" onclick="openModal(null)">+ 새 클리닉 추가</button>

  <div id="clinic-list"><div class="spinner">불러오는 중...</div></div>
</div>

<!-- 설정 모달 -->
<div id="modal" class="modal-bg">
  <div class="modal">
    <div class="modal-title" id="modal-title">클리닉 설정</div>

    <div class="form-row">
      <label class="form-label">클리닉 이름</label>
      <input class="form-input" id="f-name" placeholder="예) 추가 클리닉">
    </div>
    <div class="form-row">
      <label class="form-label">장소</label>
      <input class="form-input" id="f-loc" placeholder="예) 강의실 1">
    </div>
    <div class="form-row">
      <label class="form-label">최대 인원 / 시간대</label>
      <input class="form-input" id="f-max" type="number" value="10" min="1">
    </div>
    <div class="form-row">
      <label class="form-label">시간 단위</label>
      <div class="interval-row">
        <select class="interval-sel" id="f-interval">
          <option value="30">30분</option>
          <option value="60" selected>1시간</option>
          <option value="90">1시간 30분</option>
          <option value="120">2시간</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">요일별 가능 시간</label>
      <div class="day-rows" id="day-rows"></div>
    </div>

    <div class="modal-btns">
      <button class="btn-cl" onclick="closeModal()">취소</button>
      <button class="btn-ok" onclick="saveClinic()">저장</button>
    </div>
  </div>
</div>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbxuC16lPtzh8jcU1dUC2TKUjF7AW33PizaOHEwpTk8Bl5W92B1MQwXHTzBBgBMDRQZS/exec';
const DAY_NAMES = ['일','월','화','수','목','금','토'];
let clinics = [];
let editingId = null;

// 시간 옵션 생성 (00:00 ~ 23:30)
function buildTimeOptions(selectedVal) {
  let html = '';
  for (let h = 0; h < 24; h++) {
    for (let m of [0, 30]) {
      const val = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      html += `<option value="${val}" ${val === selectedVal ? 'selected' : ''}>${val}</option>`;
    }
  }
  return html;
}

function buildDayRows(existingSchedule) {
  const defaults = {
    '0': {on: false, start:'13:00', end:'21:00'},
    '1': {on: true,  start:'14:00', end:'21:00'},
    '2': {on: false, start:'14:00', end:'21:00'},
    '3': {on: true,  start:'14:00', end:'21:00'},
    '4': {on: true,  start:'16:00', end:'22:00'},
    '5': {on: true,  start:'14:00', end:'21:00'},
    '6': {on: false, start:'10:00', end:'17:00'},
  };

  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = String(i);
    let on = defaults[d].on;
    let start = defaults[d].start;
    let end = defaults[d].end;

    if (existingSchedule && existingSchedule.days) {
      const ds = existingSchedule.days[d];
      if (ds === null || ds === undefined) { on = false; }
      else { on = true; start = ds.start; end = ds.end; }
    }

    html += `
      <div class="day-row" id="dr-${i}">
        <label class="day-toggle">
          <input type="checkbox" id="chk-${i}" ${on ? 'checked' : ''} onchange="toggleDay(${i})">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>
        <span class="day-name">${DAY_NAMES[i]}</span>
        <div class="time-inputs ${on ? '' : 'disabled'}" id="ti-${i}">
          <select class="time-sel" id="start-${i}">${buildTimeOptions(start)}</select>
          <span class="time-sep">~</span>
          <select class="time-sel" id="end-${i}">${buildTimeOptions(end)}</select>
        </div>
        ${on ? '' : '<span style="font-size:12px;color:#94a3b8;flex:1;">가능한 시간 없음</span>'}
      </div>`;
  }
  return html;
}

function toggleDay(i) {
  const chk = document.getElementById('chk-' + i);
  const ti = document.getElementById('ti-' + i);
  const row = document.getElementById('dr-' + i);
  const noTime = row.querySelector('.no-time');

  if (chk.checked) {
    ti.classList.remove('disabled');
    if (noTime) noTime.remove();
  } else {
    ti.classList.add('disabled');
    if (!row.querySelector('.no-time')) {
      const span = document.createElement('span');
      span.className = 'no-time';
      span.style.cssText = 'font-size:12px;color:#94a3b8;flex:1;';
      span.textContent = '가능한 시간 없음';
      row.appendChild(span);
    }
  }
}

function openModal(clinic) {
  editingId = clinic ? clinic.id : null;
  document.getElementById('modal-title').textContent = clinic ? '클리닉 수정' : '새 클리닉 추가';
  document.getElementById('f-name').value = clinic ? clinic.name : '';
  document.getElementById('f-loc').value = clinic ? (clinic.location || '') : '';
  document.getElementById('f-max').value = clinic ? (clinic.maxPeople || 10) : 10;

  let existingSchedule = null;
  if (clinic && clinic.slots) {
    try {
      const parsed = JSON.parse(clinic.slots);
      if (parsed.weekly) existingSchedule = parsed;
    } catch(e) {}
  }
  if (existingSchedule) {
    document.getElementById('f-interval').value = existingSchedule.interval || 60;
  }

  document.getElementById('day-rows').innerHTML = buildDayRows(existingSchedule);
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function collectSchedule() {
  const days = {};
  for (let i = 0; i < 7; i++) {
    const chk = document.getElementById('chk-' + i);
    if (chk.checked) {
      days[String(i)] = {
        start: document.getElementById('start-' + i).value,
        end: document.getElementById('end-' + i).value
      };
    } else {
      days[String(i)] = null;
    }
  }
  return {
    weekly: true,
    interval: parseInt(document.getElementById('f-interval').value),
    days
  };
}

async function saveClinic() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('클리닉 이름을 입력해주세요.'); return; }
  const schedule = collectSchedule();
  const hasAnyDay = Object.values(schedule.days).some(v => v !== null);
  if (!hasAnyDay) { alert('가능한 요일을 최소 1개 선택해주세요.'); return; }

  const params = {
    name,
    location: document.getElementById('f-loc').value.trim(),
    desc: '',
    slots: JSON.stringify(schedule),
    maxPeople: document.getElementById('f-max').value
  };

  try {
    // 기존 클리닉 수정: 삭제 후 재생성
    if (editingId) {
      await fetch(SU + '?action=deleteClinic&id=' + encodeURIComponent(editingId));
    }
    const qs = Object.entries({action:'createClinic', ...params})
      .map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
    await fetch(SU + '?' + qs);
    closeModal();
    loadClinics();
  } catch(e) {
    alert('저장 실패. 다시 시도해주세요.');
  }
}

async function deleteClinic(id, name) {
  if (!confirm(`"${name}" 클리닉을 삭제하시겠습니까?\n기존 예약 내역도 함께 삭제됩니다.`)) return;
  await fetch(SU + '?action=deleteClinic&id=' + encodeURIComponent(id));
  loadClinics();
}

function renderScheduleChips(slots) {
  try {
    const s = JSON.parse(slots);
    if (!s.weekly) return '<span style="font-size:12px;color:#94a3b8;">기존 형식</span>';
    return DAY_NAMES.map((n, i) => {
      const d = s.days[String(i)];
      if (!d) return `<span class="day-chip off">${n} ✕</span>`;
      return `<span class="day-chip on">${n} ${d.start}~${d.end}</span>`;
    }).join('');
  } catch(e) {
    return '<span style="font-size:12px;color:#94a3b8;">설정 없음</span>';
  }
}

async function loadClinics() {
  const area = document.getElementById('clinic-list');
  area.innerHTML = '<div class="spinner">불러오는 중...</div>';
  try {
    const res = await fetch(SU + '?action=getClinics');
    const data = await res.json();
    clinics = data.clinics || [];
    if (!clinics.length) {
      area.innerHTML = '<div class="empty">등록된 클리닉이 없습니다.<br>위 버튼으로 추가해주세요.</div>';
      return;
    }
    area.innerHTML = clinics.map(c => `
      <div class="clinic-item">
        <div class="clinic-item-header">
          <div class="clinic-item-name">${c.name}</div>
          <div class="clinic-btns">
            <button class="btn-edit" onclick="openModal(${JSON.stringify(c).replace(/"/g,'&quot;')})">수정</button>
            <button class="btn-del" onclick="deleteClinic('${c.id}','${c.name}')">삭제</button>
          </div>
        </div>
        <div class="clinic-item-loc">📍 ${c.location || '장소 미정'} &nbsp;·&nbsp; 최대 ${c.maxPeople}명/시간</div>
        <div class="schedule-preview">${renderScheduleChips(c.slots)}</div>
      </div>
    `).join('');
  } catch(e) {
    area.innerHTML = '<div class="empty">불러오기 실패.</div>';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  // 관리자 체크
  const session = JSON.parse(localStorage.getItem('mkmath_session') || 'null');
  if (!session || session.role !== 'teacher') {
    document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;"><h2>관리자 전용 페이지입니다.</h2><br><a href="homework.html">로그인하러 가기</a></div>';
    return;
  }
  loadClinics();
});
</script>
</body>
</html>
