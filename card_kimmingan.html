<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김민관 수학강사 카드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  }

  .card {
    width: 420px;
    height: 240px;
    background: linear-gradient(135deg, #0f3460 0%, #16213e 60%, #0f3460 100%);
    border-radius: 20px;
    padding: 36px 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  }

  /* 배경 원형 장식 */
  .card::before {
    content: '';
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(82, 168, 255, 0.07);
    right: -80px;
    top: -80px;
  }
  .card::after {
    content: '';
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: rgba(82, 168, 255, 0.05);
    left: -40px;
    bottom: -40px;
  }

  .accent-line {
    width: 40px;
    height: 4px;
    background: linear-gradient(90deg, #52a8ff, #a78bfa);
    border-radius: 2px;
    margin-bottom: 16px;
  }

  .name-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }

  .name {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 2px;
  }

  .subject-badge {
    background: linear-gradient(135deg, #52a8ff, #a78bfa);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  .slogan {
    font-size: 13.5px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    font-style: italic;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 20px;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-icon {
    width: 28px;
    height: 28px;
    background: rgba(82, 168, 255, 0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .phone {
    font-size: 15px;
    color: #52a8ff;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .math-deco {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 72px;
    font-weight: 900;
    color: rgba(255,255,255,0.04);
    font-family: serif;
    user-select: none;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="math-deco">∑∫</div>
    <div class="accent-line"></div>
    <div class="name-row">
      <span class="name">김민관</span>
      <span class="subject-badge">수학</span>
    </div>
    <div class="slogan">" 못하는 건 키즈모델뿐 "</div>
    <div class="divider"></div>
    <div class="info-row">
      <div class="info-icon">📞</div>
      <span class="phone">010-6251-9244</span>
    </div>
  </div>
</body>
</html>
